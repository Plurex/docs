components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-KEY
    ApiSecret:
      type: apiKey
      in: header
      name: X-API-SECRET
  responses:
    BadRequest:
      description: 400 BadRequest; code is InvalidRequest.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            InvalidRequest:
              summary: The body is malformed, has unknown fields or wrong types, or a value is invalid
              value:
                code: InvalidRequest
                message: Invalid cursor
    Unauthenticated:
      description: 401 Unauthenticated; code is Unauthenticated.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            Unauthenticated:
              summary: The API key headers are missing or invalid
              value:
                code: Unauthenticated
                message: Unauthorized
    Forbidden:
      description: 403 Forbidden; code is Forbidden.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            Forbidden:
              summary: The key cannot access this account or operation
              value:
                code: Forbidden
                message: Forbidden
    NotFound:
      description: 404 NotFound; code is AccountNotFound, OrderNotFound or NotFound.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            AccountNotFound:
              summary: The accountId does not exist
              value:
                code: AccountNotFound
                message: 'Account not found: acc_123'
            OrderNotFound:
              summary: The account exists, but the order identifier does not
              value:
                code: OrderNotFound
                message: 'Order not found: ord_456'
            NotFound:
              summary: Unknown path, host or venue
              value:
                code: NotFound
                message: Not Found
    Conflict:
      description: 409 Conflict; code is DuplicateClientOrderId, OrderAlreadyClosed or Conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            DuplicateClientOrderId:
              summary: An order with this clientOrderId already exists
              value:
                code: DuplicateClientOrderId
                message: Client order ID already exists
            OrderAlreadyClosed:
              summary: The order is already filled, cancelled or rejected
              value:
                code: OrderAlreadyClosed
                message: Order is already closed
            Conflict:
              summary: A unique value, such as an account name, is already used
              value:
                code: Conflict
                message: Conflict
    Rejected:
      description: 422 Rejected; code is InsufficientFunds, InvalidProviderCredentials, AccountLimit, NotSupported or Rejected.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            InsufficientFunds:
              summary: The account cannot fund the order or withdrawal
              value:
                code: InsufficientFunds
                message: Insufficient Funds
            InvalidProviderCredentials:
              summary: The provider rejected the account credentials
              value:
                code: InvalidProviderCredentials
                message: Unprocessable Entity
            AccountLimit:
              summary: An account or subscription limit was reached
              value:
                code: AccountLimit
                message: Subscription limit reached
            NotSupported:
              summary: The host does not support this operation, variant or instrument
              value:
                code: NotSupported
                message: Unprocessable Entity
            Rejected:
              summary: The host or validation rejected the command
              value:
                code: Rejected
                message: Order price is not a multiple of the price increment
    RateLimited:
      description: 429 RateLimited; code is RateLimited.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            RateLimited:
              summary: The provider rate limited the request
              value:
                code: RateLimited
                message: Provider rate limited
    UnexpectedError:
      description: 500 UnexpectedError; code is UnexpectedError.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            UnexpectedError:
              summary: Unexpected server failure
              value:
                code: UnexpectedError
                message: Internal Server Error
    UpstreamFailure:
      description: 502 UpstreamFailure; code is UpstreamFailure or CancelAllFailed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            UpstreamFailure:
              summary: The host or venue failed or returned something unreadable
              value:
                code: UpstreamFailure
                message: Bad Gateway
            CancelAllFailed:
              summary: At least one sub-cancel failed; reconcile with ListOpenOrders
              value:
                code: CancelAllFailed
                message: Bad Gateway
    Unavailable:
      description: 503 Unavailable; code is Unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            Unavailable:
              summary: The service or provider is temporarily unavailable
              value:
                code: Unavailable
                message: Service Unavailable
    UpstreamTimeout:
      description: 504 UpstreamTimeout; code is UpstreamTimeout.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            UpstreamTimeout:
              summary: The provider did not respond in time
              value:
                code: UpstreamTimeout
                message: Gateway Timeout
    UnsupportedMediaType:
      description: 415 UnsupportedMediaType; code is UnsupportedMediaType.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            UnsupportedMediaType:
              summary: The request is not Content-Type application/json
              value:
                code: UnsupportedMediaType
                message: Content type text/plain is not supported
  schemas:
    AccountCredentialPublic:
      type: object
      properties:
        publicValue:
          type:
          - string
          - 'null'
          description: Non-secret part of the credential, such as the API key; null when the credential type has none (paper).
        credentialType:
          $ref: '#/components/schemas/HostCredentialType'
      required:
      - publicValue
      - credentialType
      description: 'The non-secret view of an account''s credential: its type and, for API keys, the public key. Secrets are
        never returned.'
    HostCredentialType:
      type: string
      enum:
      - ApiKey
      - Paper
      description: 'How an account authenticates with its host: ApiKey for a connected exchange or broker account, Paper for
        a paper account.'
    AccountHeader:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
          description: The tenant that owns the account.
        hostId:
          type: string
        isPaper:
          type: boolean
        name:
          type: string
        credential:
          $ref: '#/components/schemas/AccountCredentialPublic'
      required:
      - id
      - tenantId
      - hostId
      - isPaper
      - name
      - credential
      description: 'A trading account: the host it trades on, its name, whether it is paper, and the public part of its credential.'
    AccountMarginState:
      type: object
      properties:
        baseCollateralAsset:
          type: string
        totalCollateralValue:
          $ref: '#/components/schemas/Decimal'
        totalInitialMargin:
          $ref: '#/components/schemas/Decimal'
        totalMaintenanceMargin:
          $ref: '#/components/schemas/Decimal'
        accountMarginRatio:
          anyOf:
          - $ref: '#/components/schemas/Decimal'
          - type: 'null'
          description: Host-reported value; null if the host does not supply it.
      required:
      - baseCollateralAsset
      - totalCollateralValue
      - totalInitialMargin
      - totalMaintenanceMargin
      - accountMarginRatio
      description: The account's margin totals for one margin group, valued in its base collateral asset.
    AccountMarketState:
      oneOf:
      - $ref: '#/components/schemas/AccountMarketStateDerivative'
      - $ref: '#/components/schemas/AccountMarketStateSpot'
      - $ref: '#/components/schemas/AccountMarketStateSpotMargin'
      discriminator:
        propertyName: type
        mapping:
          Derivative: '#/components/schemas/AccountMarketStateDerivative'
          Spot: '#/components/schemas/AccountMarketStateSpot'
          SpotMargin: '#/components/schemas/AccountMarketStateSpotMargin'
      description: The account's state in one market (balances, collateral, position and leverage), shaped by the kind of
        market.
    AccountMarketStateDerivative:
      title: Derivative
      type: object
      properties:
        instrument:
          $ref: '#/components/schemas/Instrument'
        currentLeverageSetting:
          $ref: '#/components/schemas/MarketLeverageSetting'
        collateral:
          $ref: '#/components/schemas/MarketCollateral'
        position:
          $ref: '#/components/schemas/MarketPosition'
        type:
          type: string
          enum:
          - Derivative
      required:
      - type
      - instrument
      - currentLeverageSetting
      - collateral
      - position
      description: 'The account''s state in a derivative market (perpetual, future or option): collateral, position and current
        leverage.'
    CanonicalInstrumentSymbol:
      type: string
      readOnly: true
      pattern: ^[A-Z0-9.]{1,32}-[A-Z0-9.]{1,32}-(?:SPOT|PERP|PERPINV|FUT_[0-9]{8}|FUTINV_[0-9]{8}|OPT_[0-9]{8}_(?:0|[1-9][0-9]*)(?:\.[0-9]*[1-9])?_(?:CALL|PUT))$
      description: 'Plurex canonical BASE-QUOTE-TYPE representation of an instrument, independent of venue naming. Derive
        it from an Instrument as base, "-", quote, "-", then the type token: Spot -> SPOT, Perp -> PERP, PerpInv -> PERPINV,
        Future -> FUT_YYYYMMDD, FutureInv -> FUTINV_YYYYMMDD, Option -> OPT_YYYYMMDD_STRIKE_RIGHT, where YYYYMMDD is expiry
        (YYYY-MM-DD) without dashes, STRIKE is strike as given and RIGHT is CALL or PUT. Examples: BTC/USD Future expiring
        2030-03-29 is BTC-USD-FUT_20300329; a BTC/USD 50000 call expiring 2030-03-29 is BTC-USD-OPT_20300329_50000_CALL. Returned
        on host and venue market summaries; not an instrument input field or a venue-native identifier.'
    Instrument:
      oneOf:
      - $ref: '#/components/schemas/InstrumentFuture'
      - $ref: '#/components/schemas/InstrumentFutureInv'
      - $ref: '#/components/schemas/InstrumentOption'
      - $ref: '#/components/schemas/InstrumentPerp'
      - $ref: '#/components/schemas/InstrumentPerpInv'
      - $ref: '#/components/schemas/InstrumentSpot'
      discriminator:
        propertyName: type
        mapping:
          Future: '#/components/schemas/InstrumentFuture'
          FutureInv: '#/components/schemas/InstrumentFutureInv'
          Option: '#/components/schemas/InstrumentOption'
          Perp: '#/components/schemas/InstrumentPerp'
          PerpInv: '#/components/schemas/InstrumentPerpInv'
          Spot: '#/components/schemas/InstrumentSpot'
      description: 'An instrument, identified by its fields rather than a venue symbol: type, base, quote, and expiry, strike
        and right where they apply. type takes the InstrumentType values; unknown types are rejected. Market summaries also
        give its canonical symbol.'
    InstrumentFuture:
      title: Future
      type: object
      properties:
        base:
          type: string
          pattern: ^[A-Z0-9.]{1,32}$
        quote:
          type: string
          pattern: ^[A-Z0-9.]{1,32}$
        expiry:
          type: string
          format: date
          description: Contract expiry date (YYYY-MM-DD).
        type:
          type: string
          enum:
          - Future
      required:
      - type
      - base
      - quote
      - expiry
      description: A linear dated future, quoted and settled in the quote asset, that expires on expiry.
    InstrumentFutureInv:
      title: FutureInv
      type: object
      properties:
        base:
          type: string
          pattern: ^[A-Z0-9.]{1,32}$
        quote:
          type: string
          pattern: ^[A-Z0-9.]{1,32}$
        expiry:
          type: string
          format: date
          description: Contract expiry date (YYYY-MM-DD).
        type:
          type: string
          enum:
          - FutureInv
      required:
      - type
      - base
      - quote
      - expiry
      description: An inverse dated future, quoted in the quote asset and settled in the base asset, that expires on expiry.
    InstrumentOption:
      title: Option
      type: object
      properties:
        base:
          type: string
          pattern: ^[A-Z0-9.]{1,32}$
        quote:
          type: string
          pattern: ^[A-Z0-9.]{1,32}$
        expiry:
          type: string
          format: date
          description: Contract expiry date (YYYY-MM-DD).
        strike:
          type: string
          pattern: ^(?:0|[1-9][0-9]*)(?:\.[0-9]*[1-9])?$
          description: Positive strike price in the quote asset, in canonical form so identity is exact; a plain decimal with
            no exponent and no trailing fractional zeros (50000, not 50000.0 or 5E4).
        right:
          $ref: '#/components/schemas/OptionRight'
        type:
          type: string
          enum:
          - Option
      required:
      - type
      - base
      - quote
      - expiry
      - strike
      - right
      description: Option contract. Option markets are not listed or tradable; options appear only where a host reports account
        activity on them.
    OptionRight:
      type: string
      enum:
      - Call
      - Put
      description: Whether an option gives the right to buy (Call) or to sell (Put) the underlying at the strike.
    InstrumentPerp:
      title: Perp
      type: object
      properties:
        base:
          type: string
          pattern: ^[A-Z0-9.]{1,32}$
        quote:
          type: string
          pattern: ^[A-Z0-9.]{1,32}$
        type:
          type: string
          enum:
          - Perp
      required:
      - type
      - base
      - quote
      description: A linear perpetual swap, with no expiry, quoted and settled in the quote asset.
    InstrumentPerpInv:
      title: PerpInv
      type: object
      properties:
        base:
          type: string
          pattern: ^[A-Z0-9.]{1,32}$
        quote:
          type: string
          pattern: ^[A-Z0-9.]{1,32}$
        type:
          type: string
          enum:
          - PerpInv
      required:
      - type
      - base
      - quote
      description: An inverse perpetual swap, with no expiry, quoted in the quote asset and settled in the base asset.
    InstrumentSpot:
      title: Spot
      type: object
      properties:
        base:
          type: string
          pattern: ^[A-Z0-9.]{1,32}$
        quote:
          type: string
          pattern: ^[A-Z0-9.]{1,32}$
        type:
          type: string
          enum:
          - Spot
      required:
      - type
      - base
      - quote
      description: 'A spot pair: buying or selling the base asset for the quote asset.'
    MarketLeverageSetting:
      description: The account's current market-level leverage for a market whose settings.leverage is non-null. Leveraged
        carries the configured multiple; Disabled means the market-level control exists and leverage is off for this account,
        so orders are not leveraged; Unknown means the host cannot report the setting truthfully.
      oneOf:
      - $ref: '#/components/schemas/MarketLeverageSettingDisabled'
      - $ref: '#/components/schemas/MarketLeverageSettingLeveraged'
      - $ref: '#/components/schemas/MarketLeverageSettingUnknown'
      discriminator:
        propertyName: type
        mapping:
          Disabled: '#/components/schemas/MarketLeverageSettingDisabled'
          Leveraged: '#/components/schemas/MarketLeverageSettingLeveraged'
          Unknown: '#/components/schemas/MarketLeverageSettingUnknown'
    MarketLeverageSettingDisabled:
      title: Disabled
      type: object
      properties:
        type:
          type: string
          enum:
          - Disabled
      required:
      - type
      description: The market has a leverage control and leverage is turned off.
    MarketLeverageSettingLeveraged:
      title: Leveraged
      type: object
      properties:
        leverage:
          $ref: '#/components/schemas/Decimal'
        type:
          type: string
          enum:
          - Leveraged
      required:
      - type
      - leverage
      description: Leverage is on for this market at the given leverage.
    MarketLeverageSettingUnknown:
      title: Unknown
      type: object
      properties:
        message:
          type: string
        type:
          type: string
          enum:
          - Unknown
      required:
      - type
      - message
      description: The host did not report a usable leverage setting; message says why.
    MarketCollateral:
      type: object
      properties:
        valueAsset:
          type: string
        total:
          $ref: '#/components/schemas/Decimal'
        available:
          $ref: '#/components/schemas/Decimal'
      required:
      - valueAsset
      - total
      - available
      description: Collateral backing the account's activity in one market, valued in valueAsset.
    MarketPosition:
      type: object
      properties:
        instrument:
          $ref: '#/components/schemas/Instrument'
        long:
          $ref: '#/components/schemas/Position'
        short:
          $ref: '#/components/schemas/Position'
        mode:
          anyOf:
          - $ref: '#/components/schemas/PositionMode'
          - type: 'null'
          description: Host-reported value; null if the host does not supply it.
      required:
      - instrument
      - long
      - short
      - mode
      description: The account's position in one market, with long and short sides reported separately.
    Position:
      type: object
      properties:
        size:
          $ref: '#/components/schemas/Decimal'
          description: Native contract units; see ContractDetails.
        entryPrice:
          anyOf:
          - $ref: '#/components/schemas/Decimal'
          - type: 'null'
          description: Host-reported value; null if the host does not supply it.
        markPrice:
          anyOf:
          - $ref: '#/components/schemas/Decimal'
          - type: 'null'
          description: The mark price the position is valued at; null if the host does not supply it.
        unrealizedPnl:
          anyOf:
          - $ref: '#/components/schemas/AssetValue'
          - type: 'null'
          description: Profit or loss if the position closed at markPrice, in the settlement asset; null if the host does
            not supply it or the side is flat.
      required:
      - size
      - entryPrice
      - markPrice
      - unrealizedPnl
      description: 'One side of a position: its size and, when the host reports them, its entry price, mark price and unrealized
        profit or loss.'
    PositionMode:
      type: string
      enum:
      - Hedging
      - Netting
      description: 'How a market holds positions: Hedging keeps separate long and short positions, Netting keeps one net position.'
    AccountMarketStateSpot:
      title: Spot
      type: object
      properties:
        instrument:
          $ref: '#/components/schemas/Instrument'
        base:
          $ref: '#/components/schemas/AssetBalance'
        quote:
          $ref: '#/components/schemas/AssetBalance'
        type:
          type: string
          enum:
          - Spot
      required:
      - type
      - instrument
      - base
      - quote
      description: 'The account''s state in a spot market: the available balances of the base and quote assets.'
    AssetBalance:
      type: object
      properties:
        available:
          $ref: '#/components/schemas/Decimal'
      required:
      - available
      description: The balance of one asset available to trade.
    AccountMarketStateSpotMargin:
      title: SpotMargin
      type: object
      properties:
        instrument:
          $ref: '#/components/schemas/Instrument'
        currentLeverageSetting:
          $ref: '#/components/schemas/MarketLeverageSetting'
        collateral:
          $ref: '#/components/schemas/MarketCollateral'
        base:
          $ref: '#/components/schemas/AssetBalance'
        quote:
          $ref: '#/components/schemas/AssetBalance'
        type:
          type: string
          enum:
          - SpotMargin
      required:
      - type
      - instrument
      - currentLeverageSetting
      - collateral
      - base
      - quote
      description: A spot market whose leverage is a market-level setting, as on a perp; only returned when the market's settings.leverage
        is non-null. Spot margin that a host offers only per order is not supported, and those markets are returned as Spot.
    AccountOrderEvent:
      type: object
      properties:
        change:
          $ref: '#/components/schemas/OrderChange'
        order:
          $ref: '#/components/schemas/Order'
      required:
      - change
      - order
      description: One change to one of the account's orders, with the complete order as it stands after the change. Use change
        to see what happened and order for the current state.
    OrderChange:
      oneOf:
      - $ref: '#/components/schemas/OrderChangeCancelled'
      - $ref: '#/components/schemas/OrderChangeCreated'
      - $ref: '#/components/schemas/OrderChangeFillApplied'
      - $ref: '#/components/schemas/OrderChangeRejected'
      - $ref: '#/components/schemas/OrderChangeUnknown'
      discriminator:
        propertyName: type
        mapping:
          Cancelled: '#/components/schemas/OrderChangeCancelled'
          Created: '#/components/schemas/OrderChangeCreated'
          FillApplied: '#/components/schemas/OrderChangeFillApplied'
          Rejected: '#/components/schemas/OrderChangeRejected'
          Unknown: '#/components/schemas/OrderChangeUnknown'
      description: 'What happened to the order in this event: created, filled further, cancelled, rejected, or a host change
        with no standard meaning.'
    OrderChangeCancelled:
      title: Cancelled
      type: object
      properties:
        type:
          type: string
          enum:
          - Cancelled
      required:
      - type
      description: The order was cancelled; the order's state is Cancelled.
    OrderChangeCreated:
      title: Created
      type: object
      properties:
        type:
          type: string
          enum:
          - Created
      required:
      - type
      description: The host accepted a new order; it is now live.
    OrderChangeFillApplied:
      title: FillApplied
      type: object
      properties:
        fill:
          anyOf:
          - $ref: '#/components/schemas/Fill'
          - type: 'null'
          description: Execution details of the fill; null when the host does not supply them (accountOrders.includesFillDetails
            is false).
        type:
          type: string
          enum:
          - FillApplied
      required:
      - fill
      - type
      description: The traded size increased. The order contains cumulative sizeTraded, averagePrice and state. fill is absent/null
        when the host reports only cumulative order state; call ListFills for individual executions. includesFillDetails advertises
        whether executions accompany these changes.
    Fill:
      type: object
      properties:
        orderId:
          type: string
          description: ID of the order this execution belongs to, as returned on Order.id.
        instrument:
          $ref: '#/components/schemas/Instrument'
        side:
          $ref: '#/components/schemas/OrderSide'
          description: The account's side of the execution, which is its order's side, not the taker's side.
        executedAt:
          type: string
          format: date-time
        price:
          $ref: '#/components/schemas/Decimal'
        size:
          $ref: '#/components/schemas/Decimal'
          description: Native contract units; see ContractDetails.
        fees:
          type: array
          items:
            $ref: '#/components/schemas/AssetValue'
        realizedPnl:
          anyOf:
          - $ref: '#/components/schemas/AssetValue'
          - type: 'null'
          description: Host-reported value; null if the host does not supply it.
        id:
          type:
          - string
          - 'null'
          description: The host's execution ID; null when the host does not report one. Plurex does not invent one.
        role:
          anyOf:
          - $ref: '#/components/schemas/TradeRole'
          - type: 'null'
          description: Maker/taker classification, null when not reported.
      required:
      - orderId
      - instrument
      - side
      - executedAt
      - price
      - size
      - fees
      - realizedPnl
      - id
      - role
      description: 'One execution of an account''s order: the price, size and fees of a single trade.'
    AssetValue:
      type: object
      properties:
        asset:
          type: string
        value:
          $ref: '#/components/schemas/Decimal'
      required:
      - asset
      - value
      description: An amount of one asset.
    TradeRole:
      type: string
      enum:
      - Maker
      - Taker
      description: Whether the account's side of a trade added liquidity (Maker) or took it (Taker).
    OrderChangeRejected:
      title: Rejected
      type: object
      properties:
        reason:
          type:
          - string
          - 'null'
          description: Host-supplied rejection reason; null if the host gives none.
        code:
          type:
          - string
          - 'null'
          description: Host-native rejection code; null if the host gives none. Not an ErrorCode.
        type:
          type: string
          enum:
          - Rejected
      required:
      - reason
      - code
      - type
      description: The host rejected the order; the order's state is Rejected. reason and code are the host's own when it
        gives them.
    OrderChangeUnknown:
      title: Unknown
      type: object
      properties:
        nativeType:
          type: string
        type:
          type: string
          enum:
          - Unknown
      required:
      - type
      - nativeType
      description: A host order change with no standard meaning; nativeType holds the host's own event type.
    Order:
      oneOf:
      - $ref: '#/components/schemas/OrderLimit'
      - $ref: '#/components/schemas/OrderMarket'
      - $ref: '#/components/schemas/OrderTriggerLimit'
      - $ref: '#/components/schemas/OrderTriggerMarket'
      discriminator:
        propertyName: type
        mapping:
          Limit: '#/components/schemas/OrderLimit'
          Market: '#/components/schemas/OrderMarket'
          TriggerLimit: '#/components/schemas/OrderTriggerLimit'
          TriggerMarket: '#/components/schemas/OrderTriggerMarket'
      description: 'An order on the account as the host reports it: type, side, instrument, state, traded size and fees. The
        type selects the order''s own fields, such as price for limit orders.'
    OrderLimit:
      title: Limit
      type: object
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        side:
          $ref: '#/components/schemas/OrderSide'
        instrument:
          $ref: '#/components/schemas/Instrument'
        state:
          $ref: '#/components/schemas/OrderState'
        sizeTraded:
          $ref: '#/components/schemas/Decimal'
        averagePrice:
          anyOf:
          - $ref: '#/components/schemas/Decimal'
          - type: 'null'
          description: Host-reported average execution price; null if unavailable. Plurex does not calculate it from fills.
        realizedPnl:
          anyOf:
          - $ref: '#/components/schemas/AssetValue'
          - type: 'null'
          description: Host-reported value; null if the host does not supply it.
        totalFees:
          type: array
          items:
            $ref: '#/components/schemas/AssetValue'
        clientOrderId:
          type:
          - string
          - 'null'
          description: clientOrderId submitted with the order; null if none was submitted or the host does not report it.
        size:
          $ref: '#/components/schemas/Decimal'
          description: Native contract units; see ContractDetails.
        price:
          $ref: '#/components/schemas/Decimal'
        type:
          type: string
          enum:
          - Limit
      required:
      - type
      - id
      - createdAt
      - side
      - instrument
      - state
      - sizeTraded
      - averagePrice
      - realizedPnl
      - totalFees
      - clientOrderId
      - size
      - price
      description: Host-reported order state. Submitted options (tif, postOnly, reduceOnly, positionEffect) are not echoed.
    OrderSide:
      type: string
      enum:
      - Buy
      - Sell
      description: 'The direction of an order: Buy or Sell.'
    OrderState:
      type: string
      enum:
      - Live
      - Filled
      - Cancelled
      - Rejected
      description: 'Where an order is in its life: Live (working on the host), or the final states Filled, Cancelled and Rejected.'
    OrderMarket:
      title: Market
      type: object
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        side:
          $ref: '#/components/schemas/OrderSide'
        instrument:
          $ref: '#/components/schemas/Instrument'
        state:
          $ref: '#/components/schemas/OrderState'
        sizeTraded:
          $ref: '#/components/schemas/Decimal'
        averagePrice:
          anyOf:
          - $ref: '#/components/schemas/Decimal'
          - type: 'null'
          description: Host-reported average execution price; null if unavailable. Plurex does not calculate it from fills.
        realizedPnl:
          anyOf:
          - $ref: '#/components/schemas/AssetValue'
          - type: 'null'
          description: Host-reported value; null if the host does not supply it.
        totalFees:
          type: array
          items:
            $ref: '#/components/schemas/AssetValue'
        clientOrderId:
          type:
          - string
          - 'null'
          description: clientOrderId submitted with the order; null if none was submitted or the host does not report it.
        sizing:
          anyOf:
          - $ref: '#/components/schemas/MarketSizing'
          - type: 'null'
          description: The requested amount and its unit, as the host accepted it (it may round a notional). Null when the
            host does not report both; never inferred from fills.
        type:
          type: string
          enum:
          - Market
      required:
      - type
      - id
      - createdAt
      - side
      - instrument
      - state
      - sizeTraded
      - averagePrice
      - realizedPnl
      - totalFees
      - clientOrderId
      - sizing
      description: Host-reported order state. Submitted options (tif, postOnly, reduceOnly, positionEffect) are not echoed.
    OrderTriggerLimit:
      title: TriggerLimit
      type: object
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        side:
          $ref: '#/components/schemas/OrderSide'
        instrument:
          $ref: '#/components/schemas/Instrument'
        state:
          $ref: '#/components/schemas/OrderState'
        sizeTraded:
          $ref: '#/components/schemas/Decimal'
        averagePrice:
          anyOf:
          - $ref: '#/components/schemas/Decimal'
          - type: 'null'
          description: Host-reported average execution price; null if unavailable. Plurex does not calculate it from fills.
        realizedPnl:
          anyOf:
          - $ref: '#/components/schemas/AssetValue'
          - type: 'null'
          description: Host-reported value; null if the host does not supply it.
        totalFees:
          type: array
          items:
            $ref: '#/components/schemas/AssetValue'
        clientOrderId:
          type:
          - string
          - 'null'
          description: clientOrderId submitted with the order; null if none was submitted or the host does not report it.
        size:
          $ref: '#/components/schemas/Decimal'
          description: Native contract units; see ContractDetails.
        price:
          $ref: '#/components/schemas/Decimal'
        trigger:
          $ref: '#/components/schemas/Trigger'
        type:
          type: string
          enum:
          - TriggerLimit
      required:
      - type
      - id
      - createdAt
      - side
      - instrument
      - state
      - sizeTraded
      - averagePrice
      - realizedPnl
      - totalFees
      - clientOrderId
      - size
      - price
      - trigger
      description: Host-reported order state. Submitted options (tif, postOnly, reduceOnly, positionEffect) are not echoed.
    Trigger:
      type: object
      properties:
        price:
          $ref: '#/components/schemas/Decimal'
        condition:
          $ref: '#/components/schemas/TriggerCondition'
        reference:
          anyOf:
          - $ref: '#/components/schemas/TriggerReferencePrice'
          - type: 'null'
          description: Price the trigger watches; null or omitted lets the host choose, as described by the market's trigger
            referencePrice policy.
      required:
      - price
      - condition
      description: 'The condition that activates a trigger order: when the reference price crosses price in the given direction,
        the order is placed.'
    TriggerCondition:
      type: string
      enum:
      - RefPriceGTE
      - RefPriceLTE
      description: 'The direction that activates a trigger: RefPriceGTE when the reference price rises to or above the trigger
        price, RefPriceLTE when it falls to or below.'
    TriggerReferencePrice:
      type: string
      enum:
      - Mark
      - Index
      - LastTrade
      - BestBid
      - BestAsk
      description: The market price a trigger watches, such as the mark price, index price, last trade or best bid or ask.
    OrderTriggerMarket:
      title: TriggerMarket
      type: object
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        side:
          $ref: '#/components/schemas/OrderSide'
        instrument:
          $ref: '#/components/schemas/Instrument'
        state:
          $ref: '#/components/schemas/OrderState'
        sizeTraded:
          $ref: '#/components/schemas/Decimal'
        averagePrice:
          anyOf:
          - $ref: '#/components/schemas/Decimal'
          - type: 'null'
          description: Host-reported average execution price; null if unavailable. Plurex does not calculate it from fills.
        realizedPnl:
          anyOf:
          - $ref: '#/components/schemas/AssetValue'
          - type: 'null'
          description: Host-reported value; null if the host does not supply it.
        totalFees:
          type: array
          items:
            $ref: '#/components/schemas/AssetValue'
        clientOrderId:
          type:
          - string
          - 'null'
          description: clientOrderId submitted with the order; null if none was submitted or the host does not report it.
        sizing:
          anyOf:
          - $ref: '#/components/schemas/MarketSizing'
          - type: 'null'
          description: The requested amount and its unit, as the host accepted it (it may round a notional). Null when the
            host does not report both; never inferred from fills.
        trigger:
          $ref: '#/components/schemas/Trigger'
        type:
          type: string
          enum:
          - TriggerMarket
      required:
      - type
      - id
      - createdAt
      - side
      - instrument
      - state
      - sizeTraded
      - averagePrice
      - realizedPnl
      - totalFees
      - clientOrderId
      - sizing
      - trigger
      description: Host-reported order state. Submitted options (tif, postOnly, reduceOnly, positionEffect) are not echoed.
    AccountOrdersCapabilities:
      type: object
      properties:
        subscribeToAccountOrders:
          $ref: '#/components/schemas/OperationSupport'
        changes:
          type: array
          items:
            $ref: '#/components/schemas/OrderStreamChangeType'
          uniqueItems: true
        includesFillDetails:
          type: boolean
          description: Whether FillApplied events include the individual execution. False for Bybit, true for VALR and paper.
      required:
      - subscribeToAccountOrders
      - changes
      - includesFillDetails
      description: Order stream support, and the order changes it sends.
    OperationSupport:
      oneOf:
      - $ref: '#/components/schemas/OperationSupportNotSupported'
      - $ref: '#/components/schemas/OperationSupportPerMarket'
      - $ref: '#/components/schemas/OperationSupportSupported'
      discriminator:
        propertyName: type
        mapping:
          NotSupported: '#/components/schemas/OperationSupportNotSupported'
          PerMarket: '#/components/schemas/OperationSupportPerMarket'
          Supported: '#/components/schemas/OperationSupportSupported'
      description: Whether an operation or variant is supported. Supported means on every market; PerMarket means each market
        summary says whether that market supports it.
    OperationSupportNotSupported:
      title: NotSupported
      type: object
      properties:
        type:
          type: string
          enum:
          - NotSupported
      required:
      - type
      description: Not supported; calls return 422 NotSupported.
    OperationSupportPerMarket:
      title: PerMarket
      type: object
      properties:
        type:
          type: string
          enum:
          - PerMarket
      required:
      - type
      description: Supported on some markets; each market summary says which. Used only for operations that take an instrument.
    OperationSupportSupported:
      title: Supported
      type: object
      properties:
        type:
          type: string
          enum:
          - Supported
      required:
      - type
      description: Supported for every input.
    OrderStreamChangeType:
      type: string
      enum:
      - Created
      - FillApplied
      - Cancelled
      - Rejected
      description: The kinds of order change the account orders stream can send; each matches an OrderChange type.
    Ack:
      type: object
      properties: {}
      description: Empty success result. Fields may be added later.
    CancelAllOrders:
      oneOf:
      - $ref: '#/components/schemas/CancelAllOrdersByInstrument'
      - $ref: '#/components/schemas/CancelAllOrdersGlobal'
      discriminator:
        propertyName: type
        mapping:
          ByInstrument: '#/components/schemas/CancelAllOrdersByInstrument'
          Global: '#/components/schemas/CancelAllOrdersGlobal'
      description: 'Which open orders to cancel: all of them, or only those on one instrument.'
    CancelAllOrdersByInstrument:
      title: ByInstrument
      type: object
      properties:
        instrument:
          $ref: '#/components/schemas/Instrument'
        type:
          type: string
          enum:
          - ByInstrument
      required:
      - type
      - instrument
      description: Cancels every open order on one instrument.
    CancelAllOrdersGlobal:
      title: Global
      type: object
      properties:
        type:
          type: string
          enum:
          - Global
      required:
      - type
      description: Cancels every open order on the account.
    CancelAllOrdersCapabilities:
      type: object
      properties:
        global:
          $ref: '#/components/schemas/OperationSupport'
        byInstrument:
