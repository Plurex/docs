          $ref: '#/components/schemas/OpenInterestUnit'
        get:
          type: boolean
          description: GetOpenInterests on this market.
      required:
      - unit
      - get
    CandlesSpec:
      type: object
      properties:
        traded:
          anyOf:
          - $ref: '#/components/schemas/CandleSeriesSpec'
          - type: 'null'
          description: Null when the market has no traded candles.
        mark:
          anyOf:
          - $ref: '#/components/schemas/CandleSeriesSpec'
          - type: 'null'
          description: Null when the market has no mark candles.
        index:
          anyOf:
          - $ref: '#/components/schemas/CandleSeriesSpec'
          - type: 'null'
          description: Null when the market has no index candles.
      required:
      - traded
      - mark
      - index
      description: Candle series per PriceKind.
    CandleSeriesSpec:
      type: object
      properties:
        supportedIntervals:
          type: array
          items:
            $ref: '#/components/schemas/CandleInterval'
          uniqueItems: true
          minItems: 1
          description: Every interval is available to each supported variant.
        maxHistoryAgeByInterval:
          type: object
          propertyNames:
            $ref: '#/components/schemas/CandleInterval'
          additionalProperties:
            type: string
            format: duration
          description: ISO 8601 age limit of reachable history per interval; an interval without an entry has no declared
            limit.
        list:
          type: boolean
          description: ListCandles.ByInstrument for this series.
        listBefore:
          type: boolean
          description: ListCandles.ByInstrumentBefore, and continuing past the first page.
      required:
      - supportedIntervals
      - maxHistoryAgeByInterval
      - list
      - listBefore
      description: One price kind's candles on one market. At least one of list and listBefore is true.
    PriceKind:
      type: string
      enum:
      - Traded
      - Mark
      - Index
      description: What the venue reports a price to be. Kinds are never relabelled or derived from one another.
    CandleInterval:
      type: string
      enum:
      - Minute1
      - Minute3
      - Minute5
      - Minute15
      - Minute30
      - Hour1
      - Hour2
      - Hour4
      - Hour6
      - Hour12
      - Day1
      description: Candle length. Candles are aligned to whole multiples of it from the Unix epoch, in UTC.
    StatisticsWindow:
      oneOf:
      - $ref: '#/components/schemas/StatisticsWindowRolling'
      - $ref: '#/components/schemas/StatisticsWindowCalendarDay'
      discriminator:
        propertyName: type
        mapping:
          Rolling: '#/components/schemas/StatisticsWindowRolling'
          CalendarDay: '#/components/schemas/StatisticsWindowCalendarDay'
      description: The window the venue computes statistics over. Two venues' windows need not mean the same.
    StatisticsWindowRolling:
      type: object
      properties:
        type:
          type: string
          enum:
          - Rolling
        length:
          type: string
          format: duration
          description: ISO 8601 duration, e.g. PT24H.
      required:
      - type
      - length
      description: A window of this length ending now.
    StatisticsWindowCalendarDay:
      type: object
      properties:
        type:
          type: string
          enum:
          - CalendarDay
        timeZone:
          type: string
          description: IANA time zone.
      required:
      - type
      - timeZone
      description: The current calendar day in the venue's time zone.
    StatisticsField:
      type: string
      enum:
      - Open
      - High
      - Low
      - PreviousClose
      - VolumeBase
      - VolumeQuote
    OpenInterestUnit:
      type: string
      enum:
      - Contracts
      - BaseAsset
      - QuoteAsset
    GetOrderBookQuery:
      type: object
      properties:
        venueId:
          type: string
        instrument:
          $ref: '#/components/schemas/Instrument'
      required:
      - venueId
      - instrument
