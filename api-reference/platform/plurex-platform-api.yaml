          ByClientOrderIdForInstrument: '#/components/schemas/GetOrderByClientOrderIdForInstrument'
          ById: '#/components/schemas/GetOrderById'
      description: 'How to identify the order to get: by order ID or by clientOrderId, optionally scoped to an instrument.'
    GetOrderByClientOrderId:
      title: ByClientOrderId
      type: object
      properties:
        clientOrderId:
          type: string
        type:
          type: string
          enum:
          - ByClientOrderId
      required:
      - type
      - clientOrderId
      description: Selects the order by the clientOrderId it was submitted with.
    GetOrderByClientOrderIdForInstrument:
      title: ByClientOrderIdForInstrument
      type: object
      properties:
        instrument:
          $ref: '#/components/schemas/Instrument'
        clientOrderId:
          type: string
        type:
          type: string
          enum:
          - ByClientOrderIdForInstrument
      required:
      - type
      - instrument
      - clientOrderId
      description: Selects the order by clientOrderId on one instrument, for hosts that need the instrument to find it.
    GetOrderById:
      title: ById
      type: object
      properties:
        orderId:
          type: string
        type:
          type: string
          enum:
          - ById
      required:
