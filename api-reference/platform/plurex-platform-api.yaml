  /api/v1/venues/query/GetPrices:
    post:
      operationId: venuesGetPrices
      summary: Get prices
      description: The current price of one kind for each instrument. One result per requested instrument, in request order.
        An instrument without a value comes back as an Unavailable result with its error code, so one instrument cannot fail
        the batch. Served from Plurex's live feed for the market when one is running, otherwise fetched from the venue. No
