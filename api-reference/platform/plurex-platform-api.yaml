          enum:
          - ById
      required:
      - type
      - orderId
    GetOrderQuery:
      type: object
      properties:
        accountId:
          type: string
        query:
          $ref: '#/components/schemas/GetOrder'
      required:
      - accountId
      - query
    GetOrders:
      oneOf:
      - $ref: '#/components/schemas/GetOrdersByClientOrderIds'
      - $ref: '#/components/schemas/GetOrdersByClientOrderIdsForInstrument'
      - $ref: '#/components/schemas/GetOrdersByIds'
      discriminator:
        propertyName: type
        mapping:
          ByClientOrderIds: '#/components/schemas/GetOrdersByClientOrderIds'
          ByClientOrderIdsForInstrument: '#/components/schemas/GetOrdersByClientOrderIdsForInstrument'
          ByIds: '#/components/schemas/GetOrdersByIds'
    GetOrdersByClientOrderIds:
      type: object
      properties:
        clientOrderIds:
          type: array
