    ErrorCode:
      type: string
      enum:
      - InvalidRequest
      - Unauthenticated
      - Forbidden
      - AccountNotFound
      - OrderNotFound
      - NotFound
      - MethodNotAllowed
      - DuplicateClientOrderId
      - OrderAlreadyClosed
      - UnsupportedMediaType
      - InsufficientFunds
      - InvalidProviderCredentials
      - ProviderAccessDenied
      - AccountLimit
      - NotSupported
      - Rejected
      - RateLimited
      - UnexpectedError
      - CancelAllFailed
      - UpstreamFailure
      - Unavailable
      - UpstreamTimeout
      description: 'Stable error reason; each code has a fixed HTTP status. InvalidRequest (400): malformed JSON, wrong types,
        unknown fields or enum values, or invalid values. Unauthenticated (401): missing or invalid API key headers. Forbidden
        (403): no access to the account or operation. AccountNotFound (404): the accountId does not exist. OrderNotFound (404):
        the order identifier does not exist on the account. NotFound (404): unknown path, host or venue. MethodNotAllowed
        (405): the path accepts only POST. DuplicateClientOrderId (409): the host holds another order with this clientOrderId.
        OrderAlreadyClosed (409): the order is filled, cancelled or rejected. UnsupportedMediaType (415): the request is not
        Content-Type application/json. InsufficientFunds (422): the account cannot fund the order or withdrawal. InvalidProviderCredentials
        (422): the provider rejected the credentials (invalid, expired or revoked). ProviderAccessDenied (422): the credentials
        lack the access needed. AccountLimit (422): an account or subscription limit was reached. NotSupported (422): the
        host does not support this operation, variant or instrument. Rejected (422): the host or validation rejected the command.
        RateLimited (429): the provider rate limited the request. UnexpectedError (500): unexpected server failure. CancelAllFailed
        (502): at least one cancel failed; reconcile with ListOpenOrders. UpstreamFailure (502): the provider failed or returned
        an unusable response. Unavailable (503): the service or provider is temporarily unavailable. UpstreamTimeout (504):
        the provider did not respond in time. New codes may be added; handle an unknown code by its HTTP status.'
    MarketPositionModeSetting:
      type: object
      properties:
        mode:
          $ref: '#/components/schemas/PositionMode'
      required:
      - mode
      description: The account's position mode for one market.
    CancelResultCancelled:
      title: Cancelled
      type: object
      properties:
        identifier:
          type: string
          description: The requested order ID or clientOrderId, exactly as sent.
        type:
          type: string
          enum:
          - Cancelled
      required:
      - type
      - identifier
      description: The host accepted the cancel; the order may not be terminal yet, so confirm with the order stream or GetOrder.
    CancelResultFailed:
      title: Failed
      type: object
      properties:
        identifier:
          type: string
          description: The requested order ID or clientOrderId, exactly as sent.
        code:
          $ref: '#/components/schemas/ErrorCode'
          description: 'The code CancelOrder would return. OrderNotFound: reconcile; the order may be unknown or not yet visible.
            OrderAlreadyClosed: terminal and may have filled; do not retry. RateLimited, Unavailable, UpstreamTimeout and
            UpstreamFailure may be retried. Rejected and NotSupported need a changed request.'
        message:
          type: string
        type:
          type: string
          enum:
          - Failed
      required:
      - type
      - identifier
      - code
      - message
      description: The cancel of this identifier failed.
