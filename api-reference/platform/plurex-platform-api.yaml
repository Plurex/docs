      summary: Stream account orders
      description: Streams one account's orders, starting with a Reset of its open orders, then an Update per change the host
        reports, each carrying the complete order. Intermediate states may be merged; a terminal state is final. After an
        Ended line, subscribe again for a fresh Reset.
      tags:
      - orders
      - optional
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscribeToAccountOrdersRequest'
      responses:
        '200':
          description: A Reset, then one Update per line, until an Ended line.
          content:
            application/jsonl:
              itemSchema:
                $ref: '#/components/schemas/AccountOrderStreamMessage'
              examples:
                Stream:
                  summary: A Reset, an Update, a keepalive line and Ended
                  serializedValue: |
