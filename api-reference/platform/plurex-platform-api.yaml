    ErrorCode:
      type: string
      enum:
      - InvalidRequest
      - Unauthenticated
      - Forbidden
      - AccountNotFound
      - OrderNotFound
      - NotFound
      - MethodNotAllowed
      - DuplicateClientOrderId
      - OrderAlreadyClosed
      - Conflict
      - UnsupportedMediaType
      - InsufficientFunds
      - InvalidProviderCredentials
      - AccountLimit
      - NotSupported
      - Rejected
      - RateLimited
      - UnexpectedError
      - CancelAllFailed
      - UpstreamFailure
      - Unavailable
      - UpstreamTimeout
      description: 'Stable error reason. The HTTP status for each code is fixed: InvalidRequest (400): Malformed JSON, wrong
        types, unknown fields or enum values, or invalid values.; Unauthenticated (401): Missing or invalid API key headers.;
        Forbidden (403): Authenticated, but without access to the account or operation.; AccountNotFound (404): The accountId
        does not exist.; OrderNotFound (404): The account exists, but the order identifier does not.; NotFound (404): Unknown
        path, host or venue.; MethodNotAllowed (405): The path exists but only accepts POST.; DuplicateClientOrderId (409):
        An order with this clientOrderId already exists.; OrderAlreadyClosed (409): The order is already filled, cancelled
        or rejected.; Conflict (409): A unique value (for example an account name) is already used.; UnsupportedMediaType
        (415): The request is not Content-Type application/json.; InsufficientFunds (422): The account cannot fund the order
        or withdrawal.; InvalidProviderCredentials (422): The provider rejected the account credentials.; AccountLimit (422):
        An account or subscription limit was reached.; NotSupported (422): The host does not support this operation, variant
        or instrument.; Rejected (422): The host or validation rejected the command.; RateLimited (429): The provider rate
        limited the request.; UnexpectedError (500): Unexpected server failure.; CancelAllFailed (502): At least one sub-cancel
        failed; reconcile with ListOpenOrders.; UpstreamFailure (502): The provider failed or returned an unusable response.;
        Unavailable (503): The service or provider is temporarily unavailable.; UpstreamTimeout (504): The provider did not
        respond in time. New codes may be added; treat an unknown code by its HTTP status.'
    MarketPositionModeSetting:
      type: object
      properties:
        mode:
          $ref: '#/components/schemas/PositionMode'
      required:
      - mode
      description: The account's position mode for one market.
    CancelResultCancelled:
      title: Cancelled
      type: object
      properties:
        identifier:
          type: string
          description: The requested order ID or clientOrderId, echoed exactly as sent.
        type:
          type: string
          enum:
          - Cancelled
      required:
      - type
      - identifier
      description: The host accepted the cancel; the order may not be terminal yet. Confirm with the order stream or GetOrder.
    CancelResultFailed:
      title: Failed
      type: object
      properties:
        identifier:
          type: string
          description: The requested order ID or clientOrderId, echoed exactly as sent.
        code:
          $ref: '#/components/schemas/ErrorCode'
          description: 'The code CancelOrder would return for this identifier. OrderNotFound: reconcile, the order may be
            unknown, forgotten or not yet visible. OrderAlreadyClosed: terminal and may have filled; do not retry. RateLimited,
            Unavailable, UpstreamTimeout and UpstreamFailure are transient and may be retried. Rejected and NotSupported mean
            the request must change.'
        message:
          type: string
        type:
          type: string
          enum:
          - Failed
      required:
      - type
      - identifier
      - code
      - message
      description: The cancel of this identifier failed; code is what CancelOrder would return for it.
