          $ref: '#/components/schemas/CancelOrders'
      required:
      - accountId
      - command
      description: Cancels several orders in one request, with one result per identifier.
    CancelResult:
      oneOf:
      - $ref: '#/components/schemas/CancelResultCancelled'
      - $ref: '#/components/schemas/CancelResultFailed'
      discriminator:
        propertyName: type
        mapping:
          Cancelled: '#/components/schemas/CancelResultCancelled'
          Failed: '#/components/schemas/CancelResultFailed'
      description: Outcome for one requested identifier.
    ConnectAccountCommand:
      type: object
      properties:
        tenantId:
          type: string
          description: The tenant that will own the account. Find your tenant ID next to your API keys on the DevTools page
            of the Plurex app.
        name:
          type: string
        hostId:
          type: string
        credential:
          $ref: '#/components/schemas/ExecutionAccountCredentialNew'
      required:
      - tenantId
      - name
      - hostId
      - credential
      description: Connects an existing exchange or broker account to Plurex using its API credentials.
    ExecutionAccountCredentialNew:
      oneOf:
      - $ref: '#/components/schemas/ExecutionAccountCredentialNewApiKey'
      discriminator:
        propertyName: type
        mapping:
          ApiKey: '#/components/schemas/ExecutionAccountCredentialNewApiKey'
      description: The credential used to connect an exchange or broker account.
    ExecutionAccountCredentialNewApiKey:
      title: ApiKey
      type: object
      properties:
        publicKey:
          type: string
        secretKey:
          type: string
        type:
          type: string
          enum:
          - ApiKey
      required:
      - type
      - publicKey
      - secretKey
      description: An API key pair issued by the exchange or broker. The secret key is never returned.
    ContractDetails:
      type: object
      properties:
        contractType:
          $ref: '#/components/schemas/ContractType'
        settlementAsset:
          type:
          - string
          - 'null'
          description: Asset the contract settles in; null when the host does not report it.
        contractSize:
          $ref: '#/components/schemas/Decimal'
        contractSizeAsset:
          type: string
      required:
      - contractType
      - settlementAsset
      - contractSize
      - contractSizeAsset
      description: 'Every size is in native contracts: one contract is contractSize units of contractSizeAsset. This applies
        to orders, fills, positions and size constraints. Size is not necessarily base-asset units. notional and minNotional
        are quote-asset amounts.'
    ContractType:
      type: string
      enum:
      - Spot
      - Linear
      - Inverse
      - Quanto
      description: 'How a contract is margined and settled: Spot (no contract), Linear (settled in the quote asset), Inverse
        (settled in the base asset) or Quanto (settled in an asset other than base or quote).'
    CreateAccountCommand:
      type: object
      properties:
        tenantId:
          type: string
          description: The tenant that will own the paper account. Find your tenant ID next to your API keys on the DevTools
            page of the Plurex app.
        name:
          type: string
        hostId:
          type: string
        feeTier:
          type:
          - integer
          - 'null'
          description: Initial fee tier index; null or omitted selects the default tier.
      required:
      - tenantId
      - name
      - hostId
      description: Creates a paper account that simulates trading on a paper host.
    CursorPageQuery:
      type: object
      properties:
        cursor:
          type:
          - string
          - 'null'
          description: 'nextCursor from the previous page; omit for the first page. Only valid with the same query: same variant,
            account and filters.'
      required: []
      description: A request for one page of a listing; pass the previous page's nextCursor to continue.
    CursorQueryCapability:
      oneOf:
      - $ref: '#/components/schemas/CursorQueryCapabilityNotSupported'
      - $ref: '#/components/schemas/CursorQueryCapabilityPerMarket'
      - $ref: '#/components/schemas/CursorQueryCapabilitySupported'
      discriminator:
        propertyName: type
        mapping:
          NotSupported: '#/components/schemas/CursorQueryCapabilityNotSupported'
          PerMarket: '#/components/schemas/CursorQueryCapabilityPerMarket'
          Supported: '#/components/schemas/CursorQueryCapabilitySupported'
      description: Support for a paged query variant, and the order its results come in.
    CursorQueryCapabilityNotSupported:
      title: NotSupported
      type: object
      properties:
        type:
          type: string
          enum:
          - NotSupported
      required:
      - type
      description: Not supported; calls return 422 NotSupported.
    CursorQueryCapabilityPerMarket:
      title: PerMarket
      type: object
      properties:
        type:
          type: string
          enum:
          - PerMarket
      required:
      - type
      description: Supported on some markets; each market summary says which, and in what order results come unless the operation
        fixes it. Used only for queries that take an instrument.
    CursorQueryCapabilitySupported:
      title: Supported
      type: object
      properties:
        defaultOrdering:
          $ref: '#/components/schemas/CursorResultOrdering'
        type:
          type: string
          enum:
          - Supported
      required:
      - defaultOrdering
      - type
      description: Supported on every market; results come in defaultOrdering.
    CursorResultOrdering:
      type: string
      enum:
      - Chronological
      - ReverseChronological
      description: The order results come in, within and across pages. Pages are read live, so items can change while you
        page.
    DeleteAccountCommand:
      type: object
      properties:
        accountId:
          type: string
      required:
      - accountId
      description: Removes the account from Plurex.
    DepositCommand:
      type: object
      properties:
        accountId:
          type: string
        amount:
          $ref: '#/components/schemas/Decimal'
        asset:
          type: string
      required:
      - accountId
      - amount
      - asset
      description: Adds an amount of an asset to a paper account's balance.
    WithdrawCommand:
      type: object
      properties:
        accountId:
          type: string
        amount:
          $ref: '#/components/schemas/Decimal'
          description: Positive amount to withdraw; at most the asset's available balance.
        asset:
          type: string
      required:
      - accountId
      - amount
      - asset
      description: Removes an amount of an asset from a paper account's available balance.
    ErrorEnvelope:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
      required:
      - code
      - message
      description: Every error has this shape, at every HTTP status, including unknown paths (404 NotFound) and wrong methods
        (405 MethodNotAllowed). code is the specific reason. Each operation describes when to retry and how to check the outcome;
        an error alone does not prove a command had no effect.
    ExecutionHostCapabilities:
      type: object
      properties:
        orders:
          $ref: '#/components/schemas/OrdersCapabilities'
        fills:
          $ref: '#/components/schemas/FillsCapabilities'
        marketSettings:
          $ref: '#/components/schemas/MarketSettingsCapabilities'
        accountOrders:
          $ref: '#/components/schemas/AccountOrdersCapabilities'
        accountTransactions:
          $ref: '#/components/schemas/AccountTransactionsCapabilities'
      required:
      - orders
      - fills
      - marketSettings
      - accountOrders
      - accountTransactions
      description: Every operation the host offers, grouped by area, with each variant's support. Every entry is always present;
        unsupported ones say NotSupported.
    OrdersCapabilities:
      type: object
      properties:
        getOrder:
          $ref: '#/components/schemas/GetOrderCapabilities'
        getOrders:
          $ref: '#/components/schemas/GetOrdersCapabilities'
        listOpenOrders:
          $ref: '#/components/schemas/ListOpenOrdersCapabilities'
        listClosedOrders:
          $ref: '#/components/schemas/ListClosedOrdersCapabilities'
        cancelOrder:
          $ref: '#/components/schemas/CancelOrderCapabilities'
        cancelOrders:
          $ref: '#/components/schemas/CancelOrdersCapabilities'
        cancelAllOrders:
          $ref: '#/components/schemas/CancelAllOrdersCapabilities'
        submitOrder:
