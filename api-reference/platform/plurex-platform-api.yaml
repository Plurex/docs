      required:
      - orderBook
      - trades
      - prices
      - bestQuote
      - statistics
      - indicativeFunding
      - openInterest
      - candles
      description: Every market-data operation the venue offers, with its support. For PerMarket entries, each market's marketData
        says what that market supports.
