openapi: 3.2.0
info:
  title: Plurex Platform API
  version: 1.0.0
  description: >-
    Trade across exchanges and brokers through one API, and paper trade any of them with the same calls.


    **Venues** are the exchanges where markets trade. Venue operations are market data: markets, order books, recent trades,
    prices, quotes, statistics, funding, open interest and candles.


    **Hosts** hold trading accounts and execute orders on a venue's markets, for example an exchange's own account service
    or a broker. Host operations cover each host's tradable markets and order rules, and every account action: orders, fills,
    balances, positions, margin, leverage and transactions. A venue market tells you what is trading; the matching host market
    tells you what you may order there.


    **Tenants** own trading resources: every account belongs to one tenant. You act as your tenant, and your API keys are
    created under it. Find your tenant ID next to your API keys on the DevTools page of the Plurex app. Every operation, market
    data included, needs an API key: send it in the X-API-KEY and X-API-SECRET headers.


    **Accounts** are your accounts on hosts. Connect an exchange or broker account with its API credentials, or create a **paper**
    account. A paper host simulates a real host against that venue's live order book, so a paper account trades through exactly
    the same host operations and can be switched for a real one without code changes.


    **Capabilities.** Hosts and venues differ. Each host and venue lists every operation it supports, and each market lists
    its order types, settings and market data. Check these before calling: an unsupported call returns 422 NotSupported.


    **Requests.** Every operation is a POST with a JSON body (Content-Type application/json). Every operation needs both the
    X-API-KEY and X-API-SECRET headers. Unknown fields, unknown enum values and wrong types are rejected with 400. Every error
    has the ErrorEnvelope shape; its code says what went wrong.



    **Streams.** Stream operations (paths under /stream/) follow one topic, such as an account's orders or a market's order
    book. Errors are ordinary responses before the stream starts; otherwise the 200 response stays open and carries one JSON
    message per line (application/jsonl). Market data streams start with a Reset holding the current state, then Updates;
    a Reset can arrive again at any time and replaces everything you hold. Account streams send an Event per change and no
    snapshot: read current state with the matching query after the stream opens. A blank line arrives at least every 15 seconds
    while the stream is quiet. The last line is Ended, saying why the stream stopped. A stream that falls too far behind,
    or that ends or fails without an Ended line, has lost messages: open it again after a short, randomized delay and rebuild
    from its first message. Open one stream per topic; a client using HTTP/2 shares one connection between them.


    **Compatibility.** Enum values, union variants, error codes and fields are added over time without a new version. Ignore
    fields you do not recognise, and treat unknown enum values and variants as an unrecognised case instead of failing. Removing
    or renaming any of them would be a breaking change.
servers:
- url: https://api.plurex.io
tags:
- name: venues
  summary: Market data
  description: Market data from the exchanges where markets trade.
  kind: nav
- name: venue-markets
  summary: Venues and markets
  description: The venues and their markets, with the market data each market supports.
  parent: venues
  kind: nav
- name: order-books
  summary: Order books
  description: A market's current bids and asks.
  parent: venues
  kind: nav
- name: public-trades
  summary: Public trades
  description: A market's recent public trades.
  parent: venues
  kind: nav
- name: market-observations
  summary: Prices and market statistics
  description: Current prices, best quotes, statistics, indicative funding and open interest, read in batches of instruments.
  parent: venues
  kind: nav
- name: candles
  summary: Candles
  description: Closed OHLC candles by price kind and interval, newest first.
  parent: venues
  kind: nav
- name: hosts
  summary: Trading
  description: 'Trading on an account: each host''s tradable markets and order rules, orders, fills, balances, positions,
    margin, market settings and transactions. Paper accounts use these same operations.'
  kind: nav
- name: host-markets
  summary: Hosts and markets
  description: The hosts and their tradable markets, with each market's order types, order rules and settings.
  parent: hosts
  kind: nav
- name: orders
  summary: Orders
  description: Submit, cancel and read orders.
  parent: hosts
  kind: nav
- name: fills
  summary: Fills
  description: The account's executions, by order, instrument or across the account.
  parent: hosts
  kind: nav
- name: portfolio
  summary: Balances and positions
  description: Wallet balances, open positions, margin and per-market account state.
  parent: hosts
  kind: nav
- name: market-settings
  summary: Leverage and position mode
  description: Read and set the account's leverage and position mode for a market.
  parent: hosts
  kind: nav
- name: transactions
  summary: Transactions
  description: 'Balance postings: fees, funding payments, deposits and so on.'
  parent: hosts
  kind: nav
- name: accounts
  summary: Accounts
  description: Connect, list and manage a tenant's exchange, broker and paper accounts.
  kind: nav
- name: paper
  summary: Paper trading
  description: Create, fund and draw down paper accounts and set their simulated fees. Trade them through the hosts operations
    like any other account.
  kind: nav
- name: paper-accounts
  summary: Paper accounts
  description: Create, fund and draw down paper accounts.
  parent: paper
  kind: nav
- name: paper-fees
  summary: Paper fees
  description: Choose the fee tier a paper account is charged.
  parent: paper
  kind: nav
- name: optional
  summary: Check capabilities
  description: Not every host or venue supports this operation; check its capabilities first or expect 422 NotSupported.
  kind: badge
- name: paged
  summary: Paged
  description: Returns pages; follow nextCursor until null.
  kind: badge
- name: batch
  summary: Batch
  description: Takes a list of identifiers or instruments and handles them in one call.
  kind: badge
- name: not-repeat-safe
  summary: Not safe to repeat
  description: Repeating the call repeats its effect. If the outcome is unclear, check before retrying. Commands without this
    badge are safe to repeat.
  kind: badge
security:
- ApiKey: []
  ApiSecret: []
paths:
  /api/v1/venues/query/List:
    post:
      operationId: venuesList
      summary: List venues
      description: Lists every venue with the market data it supports.
      tags:
      - venue-markets
      - paged
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CursorPageQuery'
            examples:
              FirstPage:
                summary: First page
                value:
                  cursor: null
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponseVenueHeader'
              examples:
                Page:
                  summary: A venue whose market data reads vary by market
                  value:
                    items:
                    - id: bybit
                      capabilities:
                        orderBook:
                          getOrderBook:
                            type: Supported
                          subscribeToOrderBooks:
                            type: Supported
                        trades:
                          getRecentTrades:
                            type: Supported
                          subscribeToTrades:
                            type: Supported
                        prices:
                          traded:
                            getPrices:
                              type: PerMarket
                            subscribeToPrices:
                              type: PerMarket
                          mark:
                            getPrices:
                              type: PerMarket
                            subscribeToPrices:
                              type: PerMarket
                          index:
                            getPrices:
                              type: PerMarket
                            subscribeToPrices:
                              type: PerMarket
                        bestQuote:
                          getBestQuotes:
                            type: PerMarket
                          subscribeToBestQuotes:
                            type: PerMarket
                        statistics:
                          getMarketStatistics:
                            type: PerMarket
                          subscribeToMarketStatistics:
                            type: PerMarket
                        indicativeFunding:
                          getIndicativeFundings:
                            type: PerMarket
                          subscribeToIndicativeFundings:
                            type: PerMarket
                        openInterest:
                          getOpenInterests:
                            type: PerMarket
                          subscribeToOpenInterests:
                            type: PerMarket
                        candles:
                          listCandles:
                            byInstrument:
                              type: PerMarket
                            byInstrumentBefore:
                              type: PerMarket
                          subscribeToCandles:
                            type: PerMarket
                    nextCursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/UnexpectedError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/venues/query/ListMarkets:
    post:
      operationId: venuesListMarkets
      summary: List venue markets
      description: Lists a venue's markets with the market data each one supports, optionally filtered. Option markets are
        not listed.
      tags:
      - venue-markets
      - paged
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VenueMarketQuery'
            examples:
              BtcMarkets:
                summary: BTC/USDT spot and perpetual markets
                value:
                  venueId: bybit
                  base: BTC
                  quote: USDT
                  types:
                  - Spot
                  - Perp
                  search: null
                  cursor: null
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponseVenueMarketSummary'
              examples:
                Page:
                  summary: A perpetual with mark, index and funding data, and a spot market with traded prices only
                  value:
                    items:
                    - symbol: BTC-USDT-PERP
                      instrument:
                        type: Perp
                        base: BTC
                        quote: USDT
                      increments:
                        price: '0.1'
                        size: '0.001'
                      contractDetails:
                        contractType: Linear
                        settlementAsset: USDT
                        contractSize: '1'
                        contractSizeAsset: BTC
                      marketData:
                        prices:
                          traded:
                            get: true
                            subscribe: true
                          mark:
                            get: true
                            subscribe: true
                          index:
                            get: true
                            subscribe: true
                        bestQuote:
                          supportsSizes: true
                          get: true
                          subscribe: true
                        statistics:
                          window:
                            type: Rolling
                            length: PT24H
                          supportedFields:
                          - High
                          - Low
                          - PreviousClose
                          - VolumeBase
                          - VolumeQuote
                          get: true
                          subscribe: true
                        indicativeFunding:
                          get: true
                          subscribe: true
                        openInterest:
                          unit: BaseAsset
                          get: true
                          subscribe: true
                        candles:
                          traded:
                            supportedIntervals:
                            - Minute1
                            - Hour1
                            - Day1
                            maxHistoryAgeByInterval:
                              Minute1: PT720H
                              Hour1: PT8760H
                              Day1: PT87600H
                            list: true
                            listBefore: true
                            subscribe: false
                          mark:
                            supportedIntervals:
                            - Minute1
                            - Hour1
                            - Day1
                            maxHistoryAgeByInterval:
                              Minute1: PT720H
                              Hour1: PT8760H
                              Day1: PT87600H
                            list: true
                            listBefore: true
                            subscribe: false
                          index:
                            supportedIntervals:
                            - Minute1
                            - Hour1
                            - Day1
                            maxHistoryAgeByInterval:
                              Minute1: PT720H
                              Hour1: PT8760H
                              Day1: PT87600H
                            list: true
                            listBefore: true
                            subscribe: false
                    - symbol: BTC-USDT-SPOT
                      instrument:
                        type: Spot
                        base: BTC
                        quote: USDT
                      increments:
                        price: '0.01'
                        size: '0.000001'
                      contractDetails:
                        contractType: Spot
                        settlementAsset: null
                        contractSize: '1'
                        contractSizeAsset: BTC
                      marketData:
                        prices:
                          traded:
                            get: true
                            subscribe: true
                          mark: null
                          index: null
                        bestQuote:
                          supportsSizes: true
                          get: true
                          subscribe: true
                        statistics:
                          window:
                            type: Rolling
                            length: PT24H
                          supportedFields:
                          - High
                          - Low
                          - PreviousClose
                          - VolumeBase
                          - VolumeQuote
                          get: true
                          subscribe: true
                        indicativeFunding: null
                        openInterest: null
                        candles:
                          traded:
                            supportedIntervals:
                            - Minute1
                            - Hour1
                            - Day1
                            maxHistoryAgeByInterval:
                              Minute1: PT720H
                              Hour1: PT8760H
                              Day1: PT87600H
                            list: true
                            listBefore: true
                            subscribe: false
                          mark: null
                          index: null
                    nextCursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/UnexpectedError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/venues/query/GetOrderBook:
    post:
      operationId: venuesGetOrderBook
      summary: Get order book
      description: The current order book of one market, at the depth the venue provides. An unknown market returns 422 NotSupported.
      tags:
      - order-books
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetOrderBookQuery'
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEnvelopeOrderBook'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Rejected'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/UnexpectedError'
        '502':
          $ref: '#/components/responses/UpstreamFailure'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'
  /api/v1/venues/query/GetRecentTrades:
    post:
      operationId: venuesGetRecentTrades
      summary: Get recent trades
      description: The venue's recent public trades for one market, oldest first. The venue limits how many; this is not a
        complete history. An unknown market returns 422 NotSupported.
      tags:
      - public-trades
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetRecentTradesQuery'
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEnvelopeRecentTrades'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Rejected'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/UnexpectedError'
        '502':
          $ref: '#/components/responses/UpstreamFailure'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'
  /api/v1/venues/stream/SubscribeToOrderBooks:
    post:
      operationId: venuesSubscribeToOrderBooks
      summary: Stream an order book
      description: 'Streams one market''s order book: a Reset of the whole book, then Updates of the levels that changed.
        The depth is the venue''s own and covers more than the best bid and ask. A market the venue does not list returns
        422 NotSupported.'
      tags:
      - order-books
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscribeToOrderBooksRequest'
      responses:
        '200':
          description: 'One message per line: a Reset first, then Updates, until an Ended line.'
          content:
            application/jsonl:
              itemSchema:
                $ref: '#/components/schemas/OrderBookStreamMessage'
              examples:
                Stream:
                  summary: A Reset, an Update, a keepalive line and Ended
                  serializedValue: |
                    {"type":"Reset","timestamp":"2026-10-27T09:00:00.120Z","data":{"bids":[{"price":"67250.1","size":"0.42"}],"asks":[{"price":"67250.2","size":"0.08"}],"observedAt":"2026-10-27T09:00:00.101Z","receivedAt":"2026-10-27T09:00:00.115Z"}}
                    {"type":"Update","timestamp":"2026-10-27T09:00:00.320Z","data":{"bids":[{"price":"67250.1","size":"0.9"}],"asks":[{"price":"67250.2","size":"0"}],"observedAt":"2026-10-27T09:00:00.301Z","receivedAt":"2026-10-27T09:00:00.316Z"}}

                    {"type":"Ended","code":"UpstreamFailure","message":"Upstream stream ended"}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Rejected'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/UnexpectedError'
        '502':
          $ref: '#/components/responses/UpstreamFailure'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'
  /api/v1/venues/stream/SubscribeToTrades:
    post:
      operationId: venuesSubscribeToTrades
      summary: Stream public trades
      description: 'Streams one market''s public trades: a Reset of the recent trades, as GetRecentTrades returns them, then
        Updates with new trades. A market the venue does not list returns 422 NotSupported.'
      tags:
      - public-trades
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscribeToTradesRequest'
      responses:
        '200':
          description: 'One message per line: a Reset first, then Updates, until an Ended line.'
          content:
            application/jsonl:
              itemSchema:
                $ref: '#/components/schemas/TradeStreamMessage'
              examples:
                Stream:
                  summary: A Reset, an Update, a keepalive line and Ended
                  serializedValue: |
                    {"type":"Reset","timestamp":"2026-10-27T09:00:00.120Z","data":{"trades":[{"price":"67250.2","size":"0.01","takerSide":"Buy","observedAt":"2026-10-27T08:59:58.402Z","receivedAt":"2026-10-27T08:59:58.417Z"}]}}
                    {"type":"Update","timestamp":"2026-10-27T09:00:01.210Z","data":{"trades":[{"price":"67251","size":"0.4","takerSide":"Sell","observedAt":"2026-10-27T09:00:01.188Z","receivedAt":"2026-10-27T09:00:01.201Z"}]}}

                    {"type":"Ended","code":"UpstreamFailure","message":"Upstream stream ended"}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Rejected'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/UnexpectedError'
        '502':
          $ref: '#/components/responses/UpstreamFailure'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'
  /api/v1/venues/query/GetPrices:
    post:
      operationId: venuesGetPrices
      summary: Get prices
      description: The current price of one kind (traded, mark or index) for each instrument.
      tags:
      - market-observations
      - optional
      - batch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetPricesQuery'
            examples:
              MarkPrices:
                summary: Mark prices for a perpetual and a spot market
                value:
                  venueId: bybit
                  kind: Mark
                  instruments:
                  - type: Perp
                    base: BTC
                    quote: USDT
                  - type: Spot
                    base: BTC
                    quote: USDT
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEnvelopePriceResultList'
              examples:
                Mixed:
                  summary: The perpetual has a mark price; the spot market has none
                  value:
                    data:
                    - type: Observed
                      instrument:
                        type: Perp
                        base: BTC
                        quote: USDT
                      value:
                        price: '67251.84'
                      observedAt: '2026-10-26T09:30:01Z'
                      confirmedAt: null
                      receivedAt: '2026-10-26T09:30:01.214Z'
                    - type: Unavailable
                      instrument:
                        type: Spot
                        base: BTC
                        quote: USDT
                      code: NotSupported
                      message: The market does not support this read
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/UnexpectedError'
        '502':
          $ref: '#/components/responses/UpstreamFailure'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'
  /api/v1/venues/stream/SubscribeToPrices:
    post:
      operationId: venuesSubscribeToPrices
      summary: Stream a price
      description: 'Streams one market''s price of one kind (traded, mark or index): a Reset with the current value, then
        an Update whenever it changes. A market or kind the venue does not stream returns 422 NotSupported.'
      tags:
      - market-observations
      - optional
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscribeToPricesRequest'
      responses:
        '200':
          description: 'One message per line: a Reset first, then Updates, until an Ended line.'
          content:
            application/jsonl:
              itemSchema:
                $ref: '#/components/schemas/PriceStreamMessage'
              examples:
                Stream:
                  summary: A Reset, an Update, a keepalive line and Ended
                  serializedValue: |
                    {"type":"Reset","timestamp":"2026-10-27T09:00:00.120Z","data":{"value":{"price":"67250.1"},"observedAt":"2026-10-27T09:00:00.101Z","receivedAt":"2026-10-27T09:00:00.115Z"}}
                    {"type":"Update","timestamp":"2026-10-27T09:00:01.320Z","data":{"value":{"price":"67251.4"},"observedAt":"2026-10-27T09:00:01.301Z","receivedAt":"2026-10-27T09:00:01.316Z"}}

                    {"type":"Ended","code":"UpstreamFailure","message":"Upstream stream ended"}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Rejected'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/UnexpectedError'
        '502':
          $ref: '#/components/responses/UpstreamFailure'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'
  /api/v1/venues/query/GetBestQuotes:
    post:
      operationId: venuesGetBestQuotes
      summary: Get best quotes
      description: The best bid and ask for each instrument.
      tags:
      - market-observations
      - optional
      - batch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetBestQuotesQuery'
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEnvelopeBestQuoteResultList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/UnexpectedError'
        '502':
          $ref: '#/components/responses/UpstreamFailure'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'
  /api/v1/venues/stream/SubscribeToBestQuotes:
    post:
      operationId: venuesSubscribeToBestQuotes
      summary: Stream the best bid and ask
