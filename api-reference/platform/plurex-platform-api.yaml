    GetOrdersQuery:
      type: object
      properties:
        accountId:
          type: string
        query:
          $ref: '#/components/schemas/GetOrders'
      required:
      - accountId
      - query
    HostHeader:
      type: object
      properties:
        id:
          type: string
        venueIds:
          type: array
          items:
            type: string
        modelHostId:
          type:
          - string
          - 'null'
          description: The real host whose markets and order rules this paper host simulates; absent for a real host.
        capabilities:
          $ref: '#/components/schemas/ExecutionHostCapabilities'
        isPaper:
          type: boolean
          description: True for a paper host. Paper accounts use the same hosts operations as connected exchange and broker
            accounts.
        supportedCredentialTypes:
          type: array
          items:
            $ref: '#/components/schemas/HostCredentialType'
      required:
      - id
      - venueIds
      - modelHostId
      - capabilities
      - isPaper
      - supportedCredentialTypes
    HostMarketQuery:
      type: object
      properties:
        hostId:
          type: string
        base:
          type:
          - string
          - 'null'
          description: Exact base asset; null or omitted matches any.
        quote:
          type:
          - string
          - 'null'
          description: Exact quote asset; null or omitted matches any.
        types:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/InstrumentType'
          uniqueItems: true
          description: Match any listed InstrumentType; null or omitted matches every type.
          minItems: 1
        search:
          type:
          - string
          - 'null'
          description: Fuzzy, case-insensitive token matching on the canonical instrument symbol.
        cursor:
          type:
          - string
          - 'null'
          description: 'nextCursor from the previous page; omit for the first page. Only valid with the same query: same variant,
            account and filters.'
      required:
      - hostId
    InstrumentType:
      type: string
      enum:
      - Spot
      - Perp
      - PerpInv
      - Future
      - FutureInv
      - Option
    HostMarketSummary:
      type: object
      properties:
        venueId:
          type: string
        symbol:
          $ref: '#/components/schemas/CanonicalInstrumentSymbol'
        instrument:
          $ref: '#/components/schemas/Instrument'
        contractDetails:
          $ref: '#/components/schemas/ContractDetails'
        orderTypes:
          $ref: '#/components/schemas/OrderTypes'
        settings:
          $ref: '#/components/schemas/MarketSettings'
      required:
      - venueId
      - symbol
      - instrument
      - contractDetails
      - orderTypes
      - settings
    OrderTypes:
      type: object
      properties:
        limit:
          $ref: '#/components/schemas/LimitOrderSpec'
        market:
          anyOf:
          - $ref: '#/components/schemas/MarketOrderSpec'
          - type: 'null'
          description: Null means unsupported on this market.
        triggerLimit:
          anyOf:
          - $ref: '#/components/schemas/TriggerLimitOrderSpec'
          - type: 'null'
          description: Null means unsupported on this market.
        triggerMarket:
          anyOf:
          - $ref: '#/components/schemas/TriggerMarketOrderSpec'
          - type: 'null'
          description: Null means unsupported on this market.
      required:
      - limit
      - market
      - triggerLimit
      - triggerMarket
      description: Order types available on this market. limit is always present; null means the type is unsupported.
    LimitOrderSpec:
      type: object
      properties:
        price:
          $ref: '#/components/schemas/PriceConstraints'
        size:
          $ref: '#/components/schemas/SizeConstraints'
        value:
          $ref: '#/components/schemas/ValueConstraints'
        options:
          $ref: '#/components/schemas/LimitOrderOptionSupport'
      required:
      - price
      - size
      - value
      - options
      description: Rules for each input of a limit order on this market, and its supported options.
    LimitOrderOptionSupport:
      type: object
      properties:
        supportsReduceOnly:
          type: boolean
        supportedTimeInForce:
          type: array
          items:
            $ref: '#/components/schemas/LimitOrderTif'
          uniqueItems: true
          minItems: 1
        supportsPostOnly:
          type: boolean
        supportsPositionEffect:
          type: boolean
      required:
      - supportsReduceOnly
      - supportedTimeInForce
      - supportsPostOnly
      - supportsPositionEffect
      description: Options supported for limit orders on this market.
    LimitOrderTif:
      type: string
      enum:
      - GTC
      - FOK
      - IOC
    MarketOrderSpec:
      type: object
      properties:
        sizingSupport:
          $ref: '#/components/schemas/MarketOrderSizingSupport'
        size:
          anyOf:
          - $ref: '#/components/schemas/SizeConstraints'
          - type: 'null'
          description: Present exactly when Size appears in sizingSupport.buy or sizingSupport.sell.
        notional:
          anyOf:
          - $ref: '#/components/schemas/NotionalConstraints'
          - type: 'null'
          description: Present exactly when Notional appears in sizingSupport.buy or sizingSupport.sell.
        options:
          $ref: '#/components/schemas/MarketOrderOptionSupport'
      required:
      - sizingSupport
      - size
      - notional
      - options
      description: Supported sizing modes per side, the rules for each mode and the supported options for market orders on
        this market. Market orders have no value floor here; a host may still reject one worth too little at its own price.
    PriceConstraints:
      type: object
      properties:
        increment:
          $ref: '#/components/schemas/Decimal'
          description: A valid price is a whole multiple of this, in quote per base.
      required:
      - increment
      description: Rules for a price input (price, or trigger.price on trigger orders).
    SizeConstraints:
      type: object
      properties:
        increment:
          $ref: '#/components/schemas/Decimal'
          description: A valid size is a whole multiple of this, in native contracts.
        min:
          anyOf:
          - $ref: '#/components/schemas/Decimal'
          - type: 'null'
          description: Smallest accepted size, inclusive; null when the host publishes none.
      required:
      - increment
      - min
      description: Rules for the size input, in native contracts (see ContractDetails).
    NotionalConstraints:
      type: object
      properties:
        increment:
          anyOf:
          - $ref: '#/components/schemas/Decimal'
          - type: 'null'
          description: A valid notional is a whole multiple of this, in quote. Null when the host publishes none; the host
            may then reject or round the amount, and the order's sizing shows what it accepted.
        min:
          anyOf:
          - $ref: '#/components/schemas/Decimal'
          - type: 'null'
          description: Smallest accepted notional, inclusive; null when the host publishes none.
      required:
      - increment
      - min
      description: Rules for the notional input, in quote. A notional is not a size promise; the size received is the notional
        divided by the fill price and can fall below the market's minimum size.
    ValueConstraints:
      type: object
      properties:
        min:
          anyOf:
          - $ref: '#/components/schemas/Decimal'
          - type: 'null'
          description: Smallest accepted value, inclusive; null when the host publishes none.
      required:
      - min
      description: Rules for the order's value, in quote, computed from its price and size per ContractDetails. Never sent.
    MarketOrderOptionSupport:
      type: object
      properties:
        supportsReduceOnly:
          type: boolean
        supportedTimeInForce:
          type: array
          items:
            $ref: '#/components/schemas/MarketOrderTif'
          uniqueItems: true
          minItems: 1
        supportsPositionEffect:
          type: boolean
      required:
      - supportsReduceOnly
      - supportedTimeInForce
      - supportsPositionEffect
      description: Options supported for market orders on this market.
    MarketOrderSizingSupport:
      type: object
      properties:
        buy:
          type: array
          items:
            $ref: '#/components/schemas/MarketOrderSizingType'
          uniqueItems: true
          minItems: 1
        sell:
          type: array
          items:
            $ref: '#/components/schemas/MarketOrderSizingType'
          uniqueItems: true
          minItems: 1
      required:
      - buy
      - sell
      description: Supported quantity representations for buy and sell market orders.
    MarketOrderSizingType:
      type: string
      enum:
      - Size
      - Notional
    MarketOrderTif:
      type: string
      enum:
      - IOC
      - FOK
    TriggerLimitOrderSpec:
      type: object
      properties:
        price:
          $ref: '#/components/schemas/PriceConstraints'
        size:
          $ref: '#/components/schemas/SizeConstraints'
        value:
          $ref: '#/components/schemas/ValueConstraints'
        options:
          $ref: '#/components/schemas/LimitOrderOptionSupport'
        trigger:
          $ref: '#/components/schemas/TriggerOrderSupport'
      required:
      - price
      - size
      - value
      - options
      - trigger
      description: Rules for each input of a trigger limit order on this market, its supported options and trigger rules.
    TriggerOrderSupport:
      type: object
      properties:
        price:
          $ref: '#/components/schemas/PriceConstraints'
        referencePrice:
          $ref: '#/components/schemas/TriggerReferencePricePolicy'
        sellConditions:
          type: array
          items:
            $ref: '#/components/schemas/TriggerCondition'
          uniqueItems: true
        buyConditions:
          type: array
          items:
            $ref: '#/components/schemas/TriggerCondition'
          uniqueItems: true
      required:
      - price
      - referencePrice
      - sellConditions
      - buyConditions
      description: Rules for the order's trigger.price, and the supported reference prices and conditions for trigger orders
        on this market.
    TriggerReferencePricePolicy:
      oneOf:
      - $ref: '#/components/schemas/TriggerReferencePricePolicyHostSelected'
      - $ref: '#/components/schemas/TriggerReferencePricePolicyUserSelectable'
      discriminator:
        propertyName: type
        mapping:
          HostSelected: '#/components/schemas/TriggerReferencePricePolicyHostSelected'
          UserSelectable: '#/components/schemas/TriggerReferencePricePolicyUserSelectable'
      description: UserSelectable requires an explicit reference in the advertised non-empty set. HostSelected fixes the reference;
        null means the host does not disclose it. Never infer a reference the host did not report.
    TriggerReferencePricePolicyHostSelected:
      type: object
      properties:
        price:
          anyOf:
          - $ref: '#/components/schemas/TriggerReferencePrice'
          - type: 'null'
          description: The reference price the host uses; null when the host does not disclose it.
        type:
          type: string
          enum:
          - HostSelected
      required:
      - price
      - type
    TriggerReferencePricePolicyUserSelectable:
      type: object
      properties:
        prices:
          type: array
          items:
            $ref: '#/components/schemas/TriggerReferencePrice'
          uniqueItems: true
          minItems: 1
        type:
          type: string
          enum:
          - UserSelectable
      required:
      - type
      - prices
    TriggerMarketOrderSpec:
      type: object
      properties:
        sizingSupport:
          $ref: '#/components/schemas/MarketOrderSizingSupport'
        size:
          anyOf:
          - $ref: '#/components/schemas/SizeConstraints'
          - type: 'null'
          description: Present exactly when Size appears in sizingSupport.buy or sizingSupport.sell.
        notional:
          anyOf:
          - $ref: '#/components/schemas/NotionalConstraints'
          - type: 'null'
          description: Present exactly when Notional appears in sizingSupport.buy or sizingSupport.sell.
        options:
          $ref: '#/components/schemas/MarketOrderOptionSupport'
        trigger:
          $ref: '#/components/schemas/TriggerOrderSupport'
      required:
      - sizingSupport
      - size
      - notional
      - options
      - trigger
      description: Supported sizing modes per side, the rules for each mode, the supported options and trigger rules for trigger
        market orders on this market.
    MarketSettings:
      type: object
      properties:
        leverage:
          anyOf:
          - $ref: '#/components/schemas/MarketLeverageSpec'
          - type: 'null'
          description: Null means unsupported on this market.
        positionMode:
          anyOf:
          - $ref: '#/components/schemas/MarketPositionModeSpec'
          - type: 'null'
          description: Null means unsupported on this market.
      required:
      - leverage
      - positionMode
      description: Settings available on this market. null means the setting does not exist here.
    MarketLeverageSpec:
      type: object
      properties:
        min:
          $ref: '#/components/schemas/Decimal'
        max:
          $ref: '#/components/schemas/Decimal'
        step:
          $ref: '#/components/schemas/Decimal'
          description: Positive. Irrelevant when min equals max, which is a single fixed leverage.
        get:
          type: boolean
          description: Whether getMarketLeverage is supported on this market.
        setEffectScope:
          anyOf:
          - $ref: '#/components/schemas/MarketSettingEffectScope'
