      operationId: venuesGetIndicativeFundings
      summary: Get indicative fundings
      description: 'The current indicative funding rate for each perpetual: an estimate, so the rate that settles can differ.
        One result per requested instrument, in request order. An instrument without a value comes back as an Unavailable
        result with its error code, so one instrument cannot fail the batch. Served from Plurex''s live feed for the market
        when one is running, otherwise fetched from the venue. No API key needed.'
