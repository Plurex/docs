  /api/v1/accounts/query/Get:
    post:
      tags:
        - Accounts
      summary: Get details of a specific execution account
      operationId: getAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionAccountGetQuery'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
