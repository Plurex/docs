          ByIds: '#/components/schemas/CancelOrdersByIds'
      description: 'How to identify the orders to cancel: by order IDs or by clientOrderIds, optionally scoped to an instrument.'
    CancelOrdersByClientOrderIds:
      title: ByClientOrderIds
      type: object
      properties:
        clientOrderIds:
          type: array
          items:
            type: string
        type:
