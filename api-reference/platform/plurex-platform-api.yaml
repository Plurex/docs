            scale; group book levels in whole multiples of it.
        size:
          $ref: '#/components/schemas/Decimal'
          description: Order book level sizes sit on this grid, in native contracts. Display precision is its decimal scale.
            Trade sizes may be finer (for example a fill of an order sized by notional).
      required:
      - price
      - size
      description: The grid a venue quotes market data on. Not order rules.
    VenueCapabilities:
