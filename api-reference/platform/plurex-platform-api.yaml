            $ref: '#/components/schemas/InstrumentType'
          uniqueItems: true
          description: Matches any listed type; null or omitted matches every type.
          minItems: 1
        search:
          type:
          - string
          - 'null'
          description: Fuzzy, case-insensitive match on the canonical instrument symbol.
        cursor:
          type:
          - string
          - 'null'
          description: nextCursor from the previous page, valid only with the same query; null or omitted for the first page.
      required:
      - hostId
      description: Lists the markets a host can trade.
    InstrumentType:
      type: string
      enum:
      - Spot
      - Perp
      - PerpInv
      - Future
      - FutureInv
      - Option
      description: The kind of instrument, matching Instrument's type.
    HostMarketSummary:
      type: object
      properties:
        venueId:
          type: string
        symbol:
          $ref: '#/components/schemas/CanonicalInstrumentSymbol'
        instrument:
          $ref: '#/components/schemas/Instrument'
        contractDetails:
          $ref: '#/components/schemas/ContractDetails'
        orderTypes:
          $ref: '#/components/schemas/OrderTypes'
        settings:
          $ref: '#/components/schemas/MarketSettings'
      required:
      - venueId
      - symbol
      - instrument
      - contractDetails
      - orderTypes
      - settings
      description: A market a host can trade, with its contract details, order rules and account settings.
    OrderTypes:
      type: object
      properties:
        limit:
          $ref: '#/components/schemas/LimitOrderSpec'
        market:
          anyOf:
          - $ref: '#/components/schemas/MarketOrderSpec'
          - type: 'null'
          description: Null means unsupported on this market.
        triggerLimit:
          anyOf:
          - $ref: '#/components/schemas/TriggerLimitOrderSpec'
          - type: 'null'
          description: Null means unsupported on this market.
        triggerMarket:
          anyOf:
          - $ref: '#/components/schemas/TriggerMarketOrderSpec'
          - type: 'null'
          description: Null means unsupported on this market.
      required:
      - limit
      - market
      - triggerLimit
      - triggerMarket
      description: Order types available on this market; null means unsupported.
    LimitOrderSpec:
      type: object
      properties:
        price:
          $ref: '#/components/schemas/PriceConstraints'
        size:
          $ref: '#/components/schemas/SizeConstraints'
        value:
          $ref: '#/components/schemas/ValueConstraints'
        options:
          $ref: '#/components/schemas/LimitOrderOptionSupport'
      required:
      - price
      - size
      - value
      - options
      description: The rules for limit orders on this market.
    LimitOrderOptionSupport:
      type: object
      properties:
        supportsReduceOnly:
          type: boolean
        supportedTimeInForce:
          type: array
          items:
            $ref: '#/components/schemas/LimitOrderTif'
          uniqueItems: true
          minItems: 1
        supportsPostOnly:
          type: boolean
        supportsPositionEffect:
          type: boolean
      required:
      - supportsReduceOnly
      - supportedTimeInForce
      - supportsPostOnly
      - supportsPositionEffect
      description: Options supported for limit orders on this market.
    LimitOrderTif:
      type: string
      enum:
      - GTC
      - FOK
      - IOC
      description: 'How long a limit order stays working: GTC (until cancelled), IOC (fill what it can now, cancel the rest)
        or FOK (fill entirely now or cancel).'
    MarketOrderSpec:
      type: object
      properties:
        sizingSupport:
          $ref: '#/components/schemas/MarketOrderSizingSupport'
        size:
          anyOf:
          - $ref: '#/components/schemas/SizeConstraints'
          - type: 'null'
          description: Present exactly when Size appears in sizingSupport.buy or sizingSupport.sell.
        notional:
          anyOf:
          - $ref: '#/components/schemas/NotionalConstraints'
          - type: 'null'
          description: Present exactly when Notional appears in sizingSupport.buy or sizingSupport.sell.
        options:
          $ref: '#/components/schemas/MarketOrderOptionSupport'
      required:
      - sizingSupport
      - size
      - notional
      - options
      description: 'Rules for market orders on this market: sizing modes per side, the constraints for each mode and the supported
        options.'
    PriceConstraints:
      type: object
      properties:
        increment:
          $ref: '#/components/schemas/Decimal'
          description: A valid price is a whole multiple of this, in quote per base.
      required:
      - increment
      description: Rules for a price input (price, or trigger.price on trigger orders).
    SizeConstraints:
      type: object
      properties:
        increment:
          $ref: '#/components/schemas/Decimal'
          description: A valid size is a whole multiple of this.
        min:
          anyOf:
          - $ref: '#/components/schemas/Decimal'
          - type: 'null'
          description: Smallest accepted size, inclusive; null when the host publishes none.
      required:
      - increment
      - min
      description: Rules for the size input, in native contracts (see ContractDetails).
    NotionalConstraints:
      type: object
      properties:
        increment:
          anyOf:
          - $ref: '#/components/schemas/Decimal'
          - type: 'null'
          description: A valid notional is a whole multiple of this; null when the host publishes none.
        min:
          anyOf:
          - $ref: '#/components/schemas/Decimal'
          - type: 'null'
          description: Smallest accepted notional, inclusive; null when the host publishes none.
      required:
      - increment
      - min
      description: Rules for the notional input, in quote. The size received is the notional divided by the fill price and
        can fall below the market's minimum size.
    ValueConstraints:
      type: object
      properties:
        min:
          anyOf:
          - $ref: '#/components/schemas/Decimal'
          - type: 'null'
          description: Smallest accepted value, inclusive; null when the host publishes none.
      required:
      - min
      description: Rules for the order's value, in quote, computed from its price and size per ContractDetails. Never sent.
    MarketOrderOptionSupport:
      type: object
      properties:
        supportsReduceOnly:
          type: boolean
        supportedTimeInForce:
          type: array
          items:
            $ref: '#/components/schemas/MarketOrderTif'
          uniqueItems: true
          minItems: 1
        supportsPositionEffect:
          type: boolean
      required:
      - supportsReduceOnly
      - supportedTimeInForce
      - supportsPositionEffect
      description: Options supported for market orders on this market.
    MarketOrderSizingSupport:
      type: object
      properties:
        buy:
          type: array
          items:
            $ref: '#/components/schemas/MarketOrderSizingType'
          uniqueItems: true
          minItems: 1
        sell:
          type: array
          items:
            $ref: '#/components/schemas/MarketOrderSizingType'
          uniqueItems: true
          minItems: 1
      required:
      - buy
      - sell
      description: Supported sizing types for buy and sell market orders.
    MarketOrderSizingType:
      type: string
      enum:
      - Size
      - Notional
      description: 'How a market order''s amount is given: Size in native contracts, or Notional as a quote-asset amount.'
    MarketOrderTif:
      type: string
      enum:
      - IOC
      - FOK
      description: 'How a market order handles what it cannot fill now: IOC cancels the rest, FOK cancels the whole order
        unless it fills entirely.'
    TriggerLimitOrderSpec:
      type: object
      properties:
        price:
          $ref: '#/components/schemas/PriceConstraints'
        size:
          $ref: '#/components/schemas/SizeConstraints'
        value:
          $ref: '#/components/schemas/ValueConstraints'
        options:
          $ref: '#/components/schemas/LimitOrderOptionSupport'
        trigger:
          $ref: '#/components/schemas/TriggerOrderSupport'
      required:
      - price
      - size
      - value
      - options
      - trigger
      description: 'Rules for trigger limit orders on this market: input constraints, supported options and trigger rules.'
    TriggerOrderSupport:
      type: object
      properties:
        price:
          $ref: '#/components/schemas/PriceConstraints'
        referencePrice:
          $ref: '#/components/schemas/TriggerReferencePricePolicy'
        sellConditions:
          type: array
          items:
            $ref: '#/components/schemas/TriggerCondition'
          uniqueItems: true
        buyConditions:
          type: array
          items:
            $ref: '#/components/schemas/TriggerCondition'
          uniqueItems: true
      required:
      - price
      - referencePrice
      - sellConditions
      - buyConditions
      description: 'Trigger rules for trigger orders on this market: the trigger.price constraints and the supported reference
        prices and conditions.'
    TriggerReferencePricePolicy:
      oneOf:
      - $ref: '#/components/schemas/TriggerReferencePricePolicyHostSelected'
      - $ref: '#/components/schemas/TriggerReferencePricePolicyUserSelectable'
      discriminator:
        propertyName: type
        mapping:
          HostSelected: '#/components/schemas/TriggerReferencePricePolicyHostSelected'
          UserSelectable: '#/components/schemas/TriggerReferencePricePolicyUserSelectable'
      description: Whether a trigger order chooses its reference price (UserSelectable) or the host fixes it (HostSelected).
    TriggerReferencePricePolicyHostSelected:
      title: HostSelected
      type: object
      properties:
        price:
          anyOf:
          - $ref: '#/components/schemas/TriggerReferencePrice'
          - type: 'null'
          description: The reference price the host uses; null when the host does not disclose it.
        type:
          type: string
          enum:
          - HostSelected
      required:
      - price
      - type
      description: The host fixes the reference price triggers watch on this market; orders must not send a reference.
    TriggerReferencePricePolicyUserSelectable:
      title: UserSelectable
      type: object
      properties:
        prices:
          type: array
          items:
            $ref: '#/components/schemas/TriggerReferencePrice'
          uniqueItems: true
          minItems: 1
        type:
          type: string
          enum:
          - UserSelectable
      required:
      - type
      - prices
      description: Each trigger order must set a reference from prices.
    TriggerMarketOrderSpec:
      type: object
      properties:
        sizingSupport:
          $ref: '#/components/schemas/MarketOrderSizingSupport'
        size:
          anyOf:
          - $ref: '#/components/schemas/SizeConstraints'
          - type: 'null'
          description: Present exactly when Size appears in sizingSupport.buy or sizingSupport.sell.
        notional:
          anyOf:
          - $ref: '#/components/schemas/NotionalConstraints'
          - type: 'null'
          description: Present exactly when Notional appears in sizingSupport.buy or sizingSupport.sell.
        options:
          $ref: '#/components/schemas/MarketOrderOptionSupport'
        trigger:
          $ref: '#/components/schemas/TriggerOrderSupport'
      required:
      - sizingSupport
      - size
      - notional
      - options
      - trigger
      description: 'Rules for trigger market orders on this market: sizing modes per side, the constraints for each mode,
        supported options and trigger rules.'
    MarketSettings:
      type: object
      properties:
        leverage:
          anyOf:
          - $ref: '#/components/schemas/MarketLeverageSpec'
          - type: 'null'
          description: Null means unsupported on this market.
        positionMode:
          anyOf:
          - $ref: '#/components/schemas/MarketPositionModeSpec'
          - type: 'null'
          description: Null means unsupported on this market.
      required:
      - leverage
      - positionMode
      description: Settings available on this market; null means the setting does not exist here.
    MarketLeverageSpec:
      type: object
      properties:
        min:
          $ref: '#/components/schemas/Decimal'
        max:
          $ref: '#/components/schemas/Decimal'
        step:
          $ref: '#/components/schemas/Decimal'
          description: Positive. Irrelevant when min equals max.
        get:
          type: boolean
          description: Whether GetMarketLeverage is supported on this market.
        setEffectScope:
          anyOf:
          - $ref: '#/components/schemas/MarketSettingEffectScope'
          - type: 'null'
          description: What a SetMarketLeverage affects; null means leverage cannot be set here.
      required:
      - min
      - max
      - step
      - get
      - setEffectScope
      description: 'The leverage a market accepts: inclusive min and max, where valid values are min plus a whole number of
        steps.'
    MarketSettingEffectScope:
      oneOf:
      - $ref: '#/components/schemas/MarketSettingEffectScopeAccount'
      - $ref: '#/components/schemas/MarketSettingEffectScopeMarket'
      - $ref: '#/components/schemas/MarketSettingEffectScopeMarketGroup'
      discriminator:
        propertyName: type
        mapping:
          Account: '#/components/schemas/MarketSettingEffectScopeAccount'
          Market: '#/components/schemas/MarketSettingEffectScopeMarket'
          MarketGroup: '#/components/schemas/MarketSettingEffectScopeMarketGroup'
      description: 'What changing a market setting affects: only this market, a host-defined group of markets, or the whole
        account.'
    MarketSettingEffectScopeAccount:
      title: Account
      type: object
      properties:
        type:
          type: string
          enum:
          - Account
      required:
      - type
      description: A change applies to every market on the account.
    MarketSettingEffectScopeMarket:
      title: Market
      type: object
      properties:
        type:
          type: string
          enum:
          - Market
      required:
      - type
      description: A change applies only to this market.
    MarketSettingEffectScopeMarketGroup:
      title: MarketGroup
      type: object
      properties:
        type:
          type: string
          enum:
          - MarketGroup
      required:
      - type
      description: A change applies to a host-defined group of markets that includes this one.
    MarketPositionModeSpec:
      type: object
      properties:
        values:
          type: array
          items:
            $ref: '#/components/schemas/PositionMode'
          uniqueItems: true
          minItems: 1
        get:
          type: boolean
          description: Whether GetMarketPositionMode is supported on this market.
        setEffectScope:
          anyOf:
          - $ref: '#/components/schemas/MarketSettingEffectScope'
          - type: 'null'
          description: What a SetMarketPositionMode affects; null means the mode cannot be set here.
      required:
      - values
      - get
      - setEffectScope
      description: The position modes this market offers, and whether the account's mode can be read and set here.
    PositionEffect:
      type: string
      enum:
      - Open
      - Close
      description: Whether an order opens or adds to a position (Open) or reduces or closes one (Close).
    ListAccountMarginStatesQuery:
      type: object
      properties:
        accountId:
          type: string
        cursor:
          type:
          - string
          - 'null'
          description: nextCursor from the previous page, valid only with the same query; null or omitted for the first page.
      required:
      - accountId
      description: Lists the account's margin state per margin group.
    ListAccountsQuery:
      type: object
      properties:
        tenantId:
          type: string
          description: The tenant whose accounts to list.
        hostIds:
          type:
          - array
          - 'null'
          items:
            type: string
          uniqueItems: true
          description: Only accounts on these hosts; null or omitted matches every host.
        isPaper:
          type:
          - boolean
          - 'null'
          description: Only paper (true) or connected (false) accounts; null or omitted matches both.
        cursor:
          type:
          - string
          - 'null'
          description: nextCursor from the previous page, valid only with the same query; null or omitted for the first page.
      required:
      - tenantId
      description: Lists the tenant's accounts.
    ListClosedOrders:
      oneOf:
      - $ref: '#/components/schemas/ListClosedOrdersByInstrument'
      - $ref: '#/components/schemas/ListClosedOrdersByInstrumentAfter'
      - $ref: '#/components/schemas/ListClosedOrdersByInstrumentBefore'
      - $ref: '#/components/schemas/ListClosedOrdersGlobal'
      - $ref: '#/components/schemas/ListClosedOrdersGlobalAfter'
      - $ref: '#/components/schemas/ListClosedOrdersGlobalBefore'
      discriminator:
        propertyName: type
        mapping:
          ByInstrument: '#/components/schemas/ListClosedOrdersByInstrument'
          ByInstrumentAfter: '#/components/schemas/ListClosedOrdersByInstrumentAfter'
          ByInstrumentBefore: '#/components/schemas/ListClosedOrdersByInstrumentBefore'
          Global: '#/components/schemas/ListClosedOrdersGlobal'
          GlobalAfter: '#/components/schemas/ListClosedOrdersGlobalAfter'
          GlobalBefore: '#/components/schemas/ListClosedOrdersGlobalBefore'
      description: 'Which closed orders to list: all or one instrument, optionally only those before or after a time.'
    ListClosedOrdersByInstrument:
      title: ByInstrument
      type: object
      properties:
        instrument:
          $ref: '#/components/schemas/Instrument'
        type:
          type: string
          enum:
          - ByInstrument
      required:
      - type
      - instrument
      description: Lists closed orders on one instrument.
    ListClosedOrdersByInstrumentAfter:
      title: ByInstrumentAfter
      type: object
      properties:
        instrument:
          $ref: '#/components/schemas/Instrument'
        after:
          type: string
          format: date-time
        type:
          type: string
          enum:
          - ByInstrumentAfter
      required:
      - type
      - instrument
      - after
      description: Lists closed orders on one instrument after a time.
    ListClosedOrdersByInstrumentBefore:
      title: ByInstrumentBefore
      type: object
      properties:
        instrument:
          $ref: '#/components/schemas/Instrument'
        before:
          type: string
          format: date-time
        type:
          type: string
          enum:
          - ByInstrumentBefore
      required:
      - type
      - instrument
      - before
      description: Lists closed orders on one instrument before a time.
    ListClosedOrdersGlobal:
      title: Global
      type: object
      properties:
        type:
          type: string
          enum:
          - Global
      required:
      - type
      description: Lists closed orders on every instrument.
    ListClosedOrdersGlobalAfter:
      title: GlobalAfter
      type: object
      properties:
        after:
          type: string
          format: date-time
        type:
          type: string
          enum:
          - GlobalAfter
      required:
      - type
      - after
      description: Lists closed orders on every instrument after a time.
    ListClosedOrdersGlobalBefore:
      title: GlobalBefore
      type: object
      properties:
        before:
          type: string
          format: date-time
        type:
          type: string
          enum:
          - GlobalBefore
      required:
      - type
      - before
      description: Lists closed orders on every instrument before a time.
    ListClosedOrdersQuery:
      type: object
      properties:
        accountId:
          type: string
        query:
          $ref: '#/components/schemas/ListClosedOrders'
        cursor:
          type:
          - string
          - 'null'
          description: nextCursor from the previous page, valid only with the same query; null or omitted for the first page.
      required:
      - accountId
      - query
      description: Lists the account's filled, cancelled and rejected orders.
    ListFills:
      oneOf:
      - $ref: '#/components/schemas/ListFillsByInstrument'
      - $ref: '#/components/schemas/ListFillsByOrderId'
      - $ref: '#/components/schemas/ListFillsGlobal'
      discriminator:
        propertyName: type
        mapping:
          ByInstrument: '#/components/schemas/ListFillsByInstrument'
          ByOrderId: '#/components/schemas/ListFillsByOrderId'
          Global: '#/components/schemas/ListFillsGlobal'
      description: 'Which fills to list: all, one instrument, or one order.'
    ListFillsByInstrument:
      title: ByInstrument
      type: object
      properties:
        instrument:
          $ref: '#/components/schemas/Instrument'
        type:
          type: string
          enum:
          - ByInstrument
      required:
      - type
      - instrument
      description: Lists fills on one instrument.
    ListFillsByOrderId:
      title: ByOrderId
      type: object
      properties:
        orderId:
          type: string
        type:
          type: string
          enum:
          - ByOrderId
      required:
      - type
      - orderId
      description: Lists the fills of one order.
    ListFillsGlobal:
      title: Global
      type: object
      properties:
        type:
          type: string
          enum:
          - Global
      required:
      - type
      description: Lists fills on every instrument.
    ListFillsQuery:
      type: object
      properties:
        accountId:
          type: string
        query:
          $ref: '#/components/schemas/ListFills'
        cursor:
          type:
          - string
          - 'null'
          description: nextCursor from the previous page, valid only with the same query; null or omitted for the first page.
      required:
      - accountId
      - query
      description: Lists the account's fills.
    ListOpenOrders:
      oneOf:
      - $ref: '#/components/schemas/ListOpenOrdersByInstrument'
      - $ref: '#/components/schemas/ListOpenOrdersGlobal'
      discriminator:
        propertyName: type
        mapping:
          ByInstrument: '#/components/schemas/ListOpenOrdersByInstrument'
          Global: '#/components/schemas/ListOpenOrdersGlobal'
      description: 'Which open orders to list: all, or one instrument.'
    ListOpenOrdersByInstrument:
      title: ByInstrument
      type: object
      properties:
        instrument:
          $ref: '#/components/schemas/Instrument'
        type:
          type: string
          enum:
          - ByInstrument
      required:
      - type
      - instrument
      description: Lists open orders on one instrument.
    ListOpenOrdersGlobal:
      title: Global
      type: object
      properties:
        type:
          type: string
          enum:
          - Global
      required:
      - type
      description: Lists open orders on every instrument.
    ListOpenOrdersQuery:
      type: object
      properties:
        accountId:
          type: string
        query:
          $ref: '#/components/schemas/ListOpenOrders'
        cursor:
          type:
          - string
          - 'null'
          description: nextCursor from the previous page, valid only with the same query; null or omitted for the first page.
      required:
      - accountId
      - query
      description: Lists the account's live orders.
    SubscribeToAccountOrdersRequest:
      type: object
      properties:
        accountId:
          type: string
      required:
      - accountId
      description: Streams one account's order changes.
    ListOpenPositionsQuery:
      type: object
      properties:
        accountId:
          type: string
        cursor:
          type:
          - string
          - 'null'
          description: nextCursor from the previous page, valid only with the same query; null or omitted for the first page.
      required:
      - accountId
      description: Lists the account's open derivative positions.
    ListWalletsQuery:
      type: object
      properties:
        accountId:
          type: string
        cursor:
          type:
          - string
          - 'null'
          description: nextCursor from the previous page, valid only with the same query; null or omitted for the first page.
      required:
      - accountId
      description: Lists the account's wallet balances.
    MarketSizing:
      oneOf:
      - $ref: '#/components/schemas/MarketSizingNotional'
      - $ref: '#/components/schemas/MarketSizingSize'
      discriminator:
        propertyName: type
        mapping:
          Notional: '#/components/schemas/MarketSizingNotional'
          Size: '#/components/schemas/MarketSizingSize'
      description: 'The amount of a market order: a size in native contracts, or a notional amount of the quote asset.'
    MarketSizingNotional:
      title: Notional
      type: object
      properties:
        notional:
          $ref: '#/components/schemas/Decimal'
          description: Amount of the quote asset.
        type:
          type: string
          enum:
          - Notional
      required:
      - type
      - notional
      description: Sizes the order by an amount of the quote asset to spend or receive.
    MarketSizingSize:
      title: Size
      type: object
      properties:
        size:
          $ref: '#/components/schemas/Decimal'
          description: Native contract units; see ContractDetails.
        type:
          type: string
          enum:
          - Size
      required:
      - type
      - size
      description: Sizes the order in native contracts.
    OrderNew:
      oneOf:
      - $ref: '#/components/schemas/OrderNewLimit'
      - $ref: '#/components/schemas/OrderNewMarket'
      - $ref: '#/components/schemas/OrderNewTriggerLimit'
      - $ref: '#/components/schemas/OrderNewTriggerMarket'
      discriminator:
        propertyName: type
        mapping:
          Limit: '#/components/schemas/OrderNewLimit'
          Market: '#/components/schemas/OrderNewMarket'
          TriggerLimit: '#/components/schemas/OrderNewTriggerLimit'
          TriggerMarket: '#/components/schemas/OrderNewTriggerMarket'
      description: A new order to submit; the type selects the order kind and its fields.
    OrderNewLimit:
      title: Limit
      type: object
      properties:
        instrument:
          $ref: '#/components/schemas/Instrument'
        side:
          $ref: '#/components/schemas/OrderSide'
        size:
          $ref: '#/components/schemas/Decimal'
          description: Native contract units; see ContractDetails.
        price:
          $ref: '#/components/schemas/Decimal'
        reduceOnly:
          type: boolean
        tif:
          $ref: '#/components/schemas/LimitOrderTif'
        postOnly:
          type: boolean
          default: false
          description: Maker-only; defaults to false.
        clientOrderId:
          type:
          - string
          - 'null'
          description: Host-side correlation ID, accepted when submitOrder.clientOrderId is supported; null or omitted for
            none.
        positionEffect:
          anyOf:
          - $ref: '#/components/schemas/PositionEffect'
          - type: 'null'
          description: Accepted when the market's supportsPositionEffect is true; null or omitted lets the host decide.
        type:
          type: string
          enum:
          - Limit
      required:
      - type
      - instrument
      - side
      - size
      - price
      - reduceOnly
      - tif
      description: 'A limit order: buy or sell size at price or better.'
    OrderNewMarket:
      title: Market
      type: object
      properties:
        instrument:
          $ref: '#/components/schemas/Instrument'
        side:
          $ref: '#/components/schemas/OrderSide'
        sizing:
          $ref: '#/components/schemas/MarketSizing'
        reduceOnly:
          type: boolean
        tif:
          $ref: '#/components/schemas/MarketOrderTif'
          default: IOC
          description: Defaults to IOC.
        clientOrderId:
          type:
          - string
          - 'null'
          description: Host-side correlation ID, accepted when submitOrder.clientOrderId is supported; null or omitted for
            none.
        positionEffect:
          anyOf:
          - $ref: '#/components/schemas/PositionEffect'
          - type: 'null'
          description: Accepted when the market's supportsPositionEffect is true; null or omitted lets the host decide.
        type:
          type: string
          enum:
          - Market
      required:
      - type
      - instrument
      - side
      - sizing
      - reduceOnly
      description: 'A market order: buy or sell immediately at the best available prices.'
    OrderNewTriggerLimit:
      title: TriggerLimit
      type: object
      properties:
        instrument:
          $ref: '#/components/schemas/Instrument'
        side:
          $ref: '#/components/schemas/OrderSide'
        size:
          $ref: '#/components/schemas/Decimal'
          description: Native contract units; see ContractDetails.
        price:
          $ref: '#/components/schemas/Decimal'
        reduceOnly:
          type: boolean
        tif:
          $ref: '#/components/schemas/LimitOrderTif'
        postOnly:
          type: boolean
          default: false
          description: Maker-only; defaults to false.
        clientOrderId:
          type:
          - string
          - 'null'
          description: Host-side correlation ID, accepted when submitOrder.clientOrderId is supported; null or omitted for
            none.
        trigger:
          $ref: '#/components/schemas/Trigger'
        positionEffect:
          anyOf:
          - $ref: '#/components/schemas/PositionEffect'
          - type: 'null'
          description: Accepted when the market's supportsPositionEffect is true; null or omitted lets the host decide.
        type:
          type: string
          enum:
          - TriggerLimit
      required:
      - type
      - instrument
      - side
      - size
      - price
      - reduceOnly
      - tif
      - trigger
      description: A limit order that is placed when its trigger condition is met.
    OrderNewTriggerMarket:
      title: TriggerMarket
      type: object
      properties:
        instrument:
          $ref: '#/components/schemas/Instrument'
        side:
          $ref: '#/components/schemas/OrderSide'
        sizing:
          $ref: '#/components/schemas/MarketSizing'
        reduceOnly:
          type: boolean
        tif:
          $ref: '#/components/schemas/MarketOrderTif'
          default: IOC
          description: Defaults to IOC.
        clientOrderId:
          type:
          - string
          - 'null'
          description: Host-side correlation ID, accepted when submitOrder.clientOrderId is supported; null or omitted for
            none.
        trigger:
          $ref: '#/components/schemas/Trigger'
        positionEffect:
          anyOf:
          - $ref: '#/components/schemas/PositionEffect'
          - type: 'null'
          description: Accepted when the market's supportsPositionEffect is true; null or omitted lets the host decide.
        type:
          type: string
          enum:
          - TriggerMarket
      required:
      - type
      - instrument
      - side
      - sizing
      - reduceOnly
      - trigger
      description: A market order that is placed when its trigger condition is met.
    PaperFeeRates:
      type: object
      properties:
        makerFeePercent:
          $ref: '#/components/schemas/Decimal'
        takerFeePercent:
          $ref: '#/components/schemas/Decimal'
        fractionDigits:
          type:
          - integer
          - 'null'
          description: Decimal places fees are rounded to; it follows the fee asset, so tier rates report null. GetEffectiveFeeRates
            reports it for an instrument.
      required:
      - makerFeePercent
      - takerFeePercent
      - fractionDigits
      description: Maker and taker fee rates, as percentages of traded value.
    PaperFeeSettings:
      type: object
      properties:
        tiers:
          type: array
          items:
            $ref: '#/components/schemas/PaperFeeTier'
        selectedTier:
          type: integer
      required:
      - tiers
      - selectedTier
      description: A paper account's available fee tiers and the tier it uses.
    PaperHostFeeTiers:
      type: object
      properties:
        tiers:
          type: array
          items:
            $ref: '#/components/schemas/PaperFeeTier'
        defaultTier:
          type: integer
          description: The tier ID a new account uses when CreateAccount omits feeTier.
      required:
      - tiers
      - defaultTier
      description: A paper host's selectable fee tiers and its default tier.
    PaperFeeTier:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        defaults:
          $ref: '#/components/schemas/PaperFeeRates'
        instrumentOverrides:
          type: array
          items:
            $ref: '#/components/schemas/PaperInstrumentFeeRates'
      required:
      - id
      - name
      - defaults
      - instrumentOverrides
      description: 'A named paper fee tier: default rates, with overrides for matching instruments.'
    PaperInstrumentFeeRates:
      type: object
      properties:
        instrumentPattern:
          type: string
        rates:
          $ref: '#/components/schemas/PaperFeeRates'
      required:
      - instrumentPattern
      - rates
      description: Fee rates that replace a tier's defaults for instruments whose canonical symbol matches the regular expression
        instrumentPattern.
    RenameAccountCommand:
      type: object
      properties:
        accountId:
          type: string
        name:
          type: string
      required:
      - accountId
      - name
      description: Renames an account.
    SetFeeTierCommand:
      type: object
      properties:
        accountId:
          type: string
        tier:
          type: integer
          description: Fee tier ID from GetHostFeeTiers; an unknown ID is 422 Rejected.
      required:
      - accountId
      - tier
      description: Selects a paper account's fee tier.
    SetMarketLeverageCommand:
      type: object
      properties:
        accountId:
          type: string
        instrument:
          $ref: '#/components/schemas/Instrument'
        leverage:
          $ref: '#/components/schemas/Decimal'
      required:
      - accountId
      - instrument
      - leverage
      description: Sets the account's leverage for a market.
    SetMarketPositionModeCommand:
      type: object
      properties:
        accountId:
          type: string
        instrument:
          $ref: '#/components/schemas/Instrument'
        mode:
          $ref: '#/components/schemas/PositionMode'
      required:
      - accountId
      - instrument
      - mode
      description: Sets the account's position mode for a market.
    SubmitOrderCommand:
      type: object
      properties:
        accountId:
          type: string
        order:
          $ref: '#/components/schemas/OrderNew'
      required:
      - accountId
      - order
      description: Submits a new order on the account.
    UpdateAccountConnectionCommand:
      type: object
      properties:
        accountId:
          type: string
        credential:
          $ref: '#/components/schemas/ExecutionAccountCredentialNew'
      required:
      - accountId
      - credential
      description: Replaces the API credentials of a connected exchange or broker account.
    VenueHeader:
      type: object
      properties:
        id:
          type: string
        capabilities:
          $ref: '#/components/schemas/VenueCapabilities'
      required:
      - id
      - capabilities
      description: A venue (an exchange or other liquidity source) and the market data it provides.
    VenueMarketQuery:
      type: object
      properties:
        venueId:
          type: string
        base:
          type:
          - string
          - 'null'
          description: Exact base asset; null or omitted matches any.
        quote:
          type:
          - string
          - 'null'
          description: Exact quote asset; null or omitted matches any.
        types:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/InstrumentType'
          uniqueItems: true
          description: Match any listed type; null or omitted matches every type.
          minItems: 1
        search:
          type:
          - string
          - 'null'
          description: Fuzzy, case-insensitive match on the canonical instrument symbol.
        cursor:
          type:
          - string
          - 'null'
          description: nextCursor from the previous page; omit for the first page. Only valid with the same query.
      required:
      - venueId
      description: Lists a venue's markets, optionally filtered by asset, instrument type or symbol search.
    VenueMarketSummary:
      type: object
      properties:
        symbol:
          $ref: '#/components/schemas/CanonicalInstrumentSymbol'
        instrument:
          $ref: '#/components/schemas/Instrument'
        increments:
          $ref: '#/components/schemas/MarketIncrements'
        contractDetails:
          $ref: '#/components/schemas/ContractDetails'
        marketData:
          $ref: '#/components/schemas/VenueMarketData'
      required:
      - symbol
      - instrument
      - increments
      - contractDetails
      - marketData
      description: Market data for a venue market. Order rules come from the host's market summary.
    MarketIncrements:
      type: object
      properties:
        price:
          $ref: '#/components/schemas/Decimal'
          description: Order book and trade prices sit on this grid, in quote per base.
        size:
          $ref: '#/components/schemas/Decimal'
          description: Order book level sizes sit on this grid, in native contracts. Trade sizes may be finer.
      required:
      - price
      - size
      description: The grid a venue quotes market data on; not order rules.
    VenueCapabilities:
      type: object
      properties:
        orderBookL2:
          $ref: '#/components/schemas/OrderBookL2Capabilities'
        trades:
          $ref: '#/components/schemas/TradesCapabilities'
        prices:
          $ref: '#/components/schemas/PricesCapabilities'
        orderBookL1:
          $ref: '#/components/schemas/OrderBookL1Capabilities'
        statistics:
          $ref: '#/components/schemas/MarketStatisticsCapabilities'
        indicativeFunding:
          $ref: '#/components/schemas/IndicativeFundingCapabilities'
        openInterest:
          $ref: '#/components/schemas/OpenInterestCapabilities'
        candles:
          $ref: '#/components/schemas/CandlesCapabilities'
        fundingPeriods:
          $ref: '#/components/schemas/FundingPeriodsCapabilities'
      required:
      - orderBookL2
      - trades
      - prices
      - orderBookL1
      - statistics
      - indicativeFunding
      - openInterest
      - candles
      - fundingPeriods
      description: Every market-data operation the venue offers, with its support. For PerMarket entries, each market's marketData
        says what that market supports.
    OrderBookL2Capabilities:
      type: object
      properties:
        getOrderBookL2:
          $ref: '#/components/schemas/Supported'
        subscribeToOrderBookL2s:
          $ref: '#/components/schemas/Supported'
      required:
      - getOrderBookL2
      - subscribeToOrderBookL2s
      description: GetOrderBookL2 and the order book stream; supported on every venue.
    TradesCapabilities:
      type: object
      properties:
        getRecentTrades:
          $ref: '#/components/schemas/Supported'
        subscribeToTrades:
          $ref: '#/components/schemas/Supported'
      required:
      - getRecentTrades
      - subscribeToTrades
      description: GetRecentTrades and the trades stream; supported on every venue.
    PricesCapabilities:
      type: object
      properties:
        traded:
          $ref: '#/components/schemas/PriceCapabilities'
        mark:
          $ref: '#/components/schemas/PriceCapabilities'
        index:
          $ref: '#/components/schemas/PriceCapabilities'
      required:
      - traded
      - mark
      - index
      description: GetPrice support for each PriceKind.
    PriceCapabilities:
      type: object
      properties:
        getPrice:
          $ref: '#/components/schemas/MarketSupport'
        subscribeToPrices:
          $ref: '#/components/schemas/MarketSupport'
      required:
      - getPrice
      - subscribeToPrices
      description: Whether the venue serves GetPrice and SubscribeToPrices for this price kind.
    OrderBookL1Capabilities:
      type: object
      properties:
        getOrderBookL1:
          $ref: '#/components/schemas/MarketSupport'
        subscribeToOrderBookL1s:
          $ref: '#/components/schemas/MarketSupport'
      required:
      - getOrderBookL1
      - subscribeToOrderBookL1s
      description: Whether the venue serves GetOrderBookL1 and SubscribeToOrderBookL1s.
    MarketStatisticsCapabilities:
      type: object
      properties:
        getMarketStatistics:
          $ref: '#/components/schemas/MarketSupport'
        subscribeToMarketStatistics:
          $ref: '#/components/schemas/MarketSupport'
      required:
      - getMarketStatistics
      - subscribeToMarketStatistics
      description: Whether the venue serves GetMarketStatistics and SubscribeToMarketStatistics.
    IndicativeFundingCapabilities:
      type: object
      properties:
        getIndicativeFunding:
          $ref: '#/components/schemas/MarketSupport'
        subscribeToIndicativeFundings:
          $ref: '#/components/schemas/MarketSupport'
      required:
      - getIndicativeFunding
      - subscribeToIndicativeFundings
      description: Whether the venue serves GetIndicativeFunding and SubscribeToIndicativeFundings.
    OpenInterestCapabilities:
      type: object
      properties:
        getOpenInterest:
          $ref: '#/components/schemas/MarketSupport'
        subscribeToOpenInterests:
          $ref: '#/components/schemas/MarketSupport'
      required:
      - getOpenInterest
      - subscribeToOpenInterests
      description: Whether the venue serves GetOpenInterest and SubscribeToOpenInterests.
    CandlesCapabilities:
      type: object
      properties:
        listCandles:
          $ref: '#/components/schemas/ListCandlesCapabilities'
        subscribeToCandles:
          $ref: '#/components/schemas/MarketSupport'
      required:
      - listCandles
      - subscribeToCandles
      description: Whether the venue serves ListCandles, and which variants, and SubscribeToCandles.
    ListCandlesCapabilities:
      type: object
      properties:
        byInstrument:
          $ref: '#/components/schemas/MarketSupport'
        byInstrumentBefore:
          $ref: '#/components/schemas/MarketSupport'
      required:
      - byInstrument
      - byInstrumentBefore
      description: ListCandles variants. Candles are always ReverseChronological.
    FundingPeriodsCapabilities:
      type: object
      properties:
        listFundingPeriods:
          $ref: '#/components/schemas/ListFundingPeriodsCapabilities'
      required:
      - listFundingPeriods
      description: Whether the venue serves ListFundingPeriods, and which variants.
    ListFundingPeriodsCapabilities:
      type: object
      properties:
        byInstrument:
          $ref: '#/components/schemas/MarketSupport'
      required:
      - byInstrument
      description: ListFundingPeriods variants. Funding periods are always ReverseChronological.
    VenueMarketData:
      type: object
      properties:
        prices:
          $ref: '#/components/schemas/PricesSpec'
        orderBookL1:
          anyOf:
          - $ref: '#/components/schemas/OrderBookL1Spec'
          - type: 'null'
          description: Null when the market has no best quote.
        statistics:
          anyOf:
          - $ref: '#/components/schemas/StatisticsSpec'
          - type: 'null'
          description: Null when the market has no statistics.
        indicativeFunding:
          anyOf:
          - $ref: '#/components/schemas/IndicativeFundingSpec'
          - type: 'null'
          description: Null unless the market is a perpetual with indicative funding.
        openInterest:
          anyOf:
          - $ref: '#/components/schemas/OpenInterestSpec'
          - type: 'null'
          description: Null unless the market is a derivative with open interest.
        candles:
          $ref: '#/components/schemas/CandlesSpec'
        fundingPeriods:
          anyOf:
          - $ref: '#/components/schemas/FundingPeriodsSpec'
          - type: 'null'
          description: Null unless the market is a perpetual with funding history.
      required:
      - prices
      - orderBookL1
      - statistics
      - indicativeFunding
      - openInterest
      - candles
      - fundingPeriods
      description: Which market-data reads this market supports.
    PricesSpec:
      type: object
      properties:
        traded:
          anyOf:
          - $ref: '#/components/schemas/PriceSpec'
          - type: 'null'
          description: Null when the market does not report traded prices.
        mark:
          anyOf:
          - $ref: '#/components/schemas/PriceSpec'
          - type: 'null'
          description: Null when the market does not report mark prices.
        index:
          anyOf:
          - $ref: '#/components/schemas/PriceSpec'
          - type: 'null'
          description: Null when the market does not report index prices.
      required:
      - traded
      - mark
      - index
      description: Price kinds this market reports.
    PriceSpec:
      type: object
      properties:
        get:
          type: boolean
          description: Whether GetPrice supports this kind on this market.
        subscribe:
          type: boolean
          description: Whether SubscribeToPrices supports this kind on this market.
      required:
      - get
      - subscribe
      description: How this market supports one price kind.
    OrderBookL1Spec:
      type: object
      properties:
        get:
          type: boolean
          description: GetOrderBookL1 on this market.
        subscribe:
          type: boolean
          description: SubscribeToOrderBookL1s on this market.
      required:
      - get
      - subscribe
      description: How this market supports the L1 order book.
    StatisticsSpec:
      type: object
      properties:
        window:
          $ref: '#/components/schemas/StatisticsWindow'
        supportedFields:
          type: array
          items:
            $ref: '#/components/schemas/StatisticsField'
          uniqueItems: true
          minItems: 1
          description: Fields the venue reports; others are always null.
        get:
          type: boolean
          description: Whether GetMarketStatistics is supported on this market.
        subscribe:
          type: boolean
          description: Whether SubscribeToMarketStatistics is supported on this market.
      required:
      - window
      - supportedFields
      - get
      - subscribe
      description: 'How this market supports statistics: the window and the fields the venue reports.'
    IndicativeFundingSpec:
      type: object
      properties:
        get:
          type: boolean
          description: GetIndicativeFunding on this market.
        subscribe:
          type: boolean
          description: SubscribeToIndicativeFundings on this market.
      required:
      - get
      - subscribe
      description: How this market supports indicative funding reads.
    OpenInterestSpec:
      type: object
      properties:
        unit:
          $ref: '#/components/schemas/OpenInterestUnit'
        get:
          type: boolean
          description: Whether GetOpenInterest is supported on this market.
        subscribe:
          type: boolean
          description: Whether SubscribeToOpenInterests is supported on this market.
      required:
      - unit
      - get
      - subscribe
      description: How this market supports open interest reads, and their unit.
    CandlesSpec:
      type: object
      properties:
        traded:
          anyOf:
          - $ref: '#/components/schemas/CandleSeriesSpec'
          - type: 'null'
          description: Null when the market has no traded candles.
        mark:
          anyOf:
          - $ref: '#/components/schemas/CandleSeriesSpec'
          - type: 'null'
          description: Null when the market has no mark candles.
        index:
          anyOf:
          - $ref: '#/components/schemas/CandleSeriesSpec'
          - type: 'null'
          description: Null when the market has no index candles.
      required:
      - traded
      - mark
      - index
      description: Candle series per PriceKind.
    CandleSeriesSpec:
      type: object
      properties:
        supportedIntervals:
          type: array
          items:
            $ref: '#/components/schemas/CandleInterval'
          uniqueItems: true
          minItems: 1
          description: Every interval is available to each supported variant.
        list:
          type: boolean
          description: ListCandles.ByInstrument for this series.
        listBefore:
          type: boolean
          description: ListCandles.ByInstrumentBefore, and continuing past the first page.
        subscribe:
          type: boolean
          description: SubscribeToCandles for this series, at every supported interval.
      required:
      - supportedIntervals
      - list
      - listBefore
      - subscribe
      description: One price kind's candles on one market. At least one of list and listBefore is true.
    FundingPeriodsSpec:
      type: object
      properties:
        list:
          type: boolean
          description: ListFundingPeriods.ByInstrument on this market.
      required:
      - list
      description: How this market supports funding history reads.
    PriceKind:
      type: string
      enum:
      - Traded
      - Mark
      - Index
      description: 'What a price is. Traded: the last traded price; Mark: the venue''s mark price; Index: the venue''s index
        price.'
    CandleInterval:
      type: string
      enum:
      - Minute1
      - Minute3
      - Minute5
      - Minute15
      - Minute30
      - Hour1
      - Hour2
      - Hour4
      - Hour6
      - Hour12
      - Day1
      description: Candle length. Candles are aligned to whole multiples of it from the Unix epoch, in UTC.
    StatisticsWindow:
      oneOf:
      - $ref: '#/components/schemas/StatisticsWindowRolling'
      - $ref: '#/components/schemas/StatisticsWindowCalendarDay'
      discriminator:
        propertyName: type
        mapping:
          Rolling: '#/components/schemas/StatisticsWindowRolling'
          CalendarDay: '#/components/schemas/StatisticsWindowCalendarDay'
      description: The window the venue computes statistics over; windows differ between venues.
    StatisticsWindowRolling:
      title: Rolling
      type: object
      properties:
        type:
          type: string
          enum:
          - Rolling
        length:
          type: string
          format: duration
          description: ISO 8601 duration.
      required:
      - type
      - length
      description: A window of this length ending now.
    StatisticsWindowCalendarDay:
      title: CalendarDay
      type: object
      properties:
        type:
          type: string
          enum:
          - CalendarDay
        timeZone:
          type: string
          description: IANA time zone.
      required:
      - type
      - timeZone
      description: The current calendar day in the venue's time zone.
    StatisticsField:
      type: string
      enum:
      - Open
      - High
      - Low
      - PreviousClose
      - VolumeBase
      - VolumeQuote
      description: A market statistic the venue can report.
    OpenInterestUnit:
      type: string
      enum:
      - Contracts
      - BaseAsset
      - QuoteAsset
      description: 'The unit open interest is reported in: native contracts, the base asset or the quote asset.'
    GetOrderBookL2Query:
      type: object
      properties:
        venueId:
          type: string
        instrument:
          $ref: '#/components/schemas/Instrument'
      required:
      - venueId
      - instrument
      description: Gets the order book of one market on a venue.
    OrderBookL2:
      type: object
      properties:
        instrument:
          $ref: '#/components/schemas/Instrument'
        bids:
          type: array
          items:
            $ref: '#/components/schemas/OrderBookL2Level'
          description: Best (highest) price first.
        asks:
          type: array
          items:
            $ref: '#/components/schemas/OrderBookL2Level'
          description: Best (lowest) price first.
        asOf:
          type: string
          format: date-time
          description: The time the book is current as of.
      required:
      - instrument
      - bids
      - asks
      - asOf
      description: The bids and asks of one market at asOf, best price first.
    OrderBookL2Level:
      type: object
      properties:
        price:
          $ref: '#/components/schemas/Decimal'
        size:
          $ref: '#/components/schemas/Decimal'
          description: Native contract units.
      required:
      - price
      - size
      description: 'One price level of an order book: a price and the total size resting there.'
    OrderBookL2Levels:
      type: object
      properties:
        bids:
          type: array
          items:
            $ref: '#/components/schemas/OrderBookL2Level'
          description: Best (highest) price first.
        asks:
          type: array
          items:
            $ref: '#/components/schemas/OrderBookL2Level'
          description: Best (lowest) price first.
        observedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Venue time of these levels; null when the venue does not report it.
        receivedAt:
          type: string
          format: date-time
          description: When Plurex received these levels.
      required:
      - bids
      - asks
      - observedAt
      - receivedAt
      description: Order book levels on the order book stream. In a Reset they are the whole book; in an Update only the changed
        levels, each with its new total size, where size 0 removes the level.
    GetRecentTradesQuery:
      type: object
      properties:
        venueId:
          type: string
        instrument:
          $ref: '#/components/schemas/Instrument'
      required:
      - venueId
      - instrument
      description: Gets the most recent public trades of one market on a venue.
    SubscribeToOrderBookL2sRequest:
      type: object
      properties:
        venueId:
          type: string
        instrument:
          $ref: '#/components/schemas/Instrument'
      required:
      - venueId
      - instrument
      description: Streams one market's order book on a venue.
    SubscribeToTradesRequest:
      type: object
      properties:
        venueId:
          type: string
        instrument:
          $ref: '#/components/schemas/Instrument'
      required:
      - venueId
      - instrument
      description: Streams one market's public trades on a venue.
    SubscribeToPricesRequest:
      type: object
      properties:
        venueId:
          type: string
        kind:
          $ref: '#/components/schemas/PriceKind'
        instrument:
          $ref: '#/components/schemas/Instrument'
      required:
      - venueId
      - kind
      - instrument
      description: Streams one market's price on a venue.
    SubscribeToOrderBookL1sRequest:
      type: object
      properties:
        venueId:
          type: string
        instrument:
          $ref: '#/components/schemas/Instrument'
      required:
      - venueId
      - instrument
      description: Streams one market's best bid and ask on a venue.
    SubscribeToMarketStatisticsRequest:
      type: object
      properties:
        venueId:
          type: string
        instrument:
          $ref: '#/components/schemas/Instrument'
      required:
      - venueId
      - instrument
      description: Streams one market's statistics on a venue.
    SubscribeToIndicativeFundingsRequest:
      type: object
      properties:
        venueId:
          type: string
        instrument:
          $ref: '#/components/schemas/Instrument'
      required:
      - venueId
      - instrument
      description: Streams one market's indicative funding on a venue.
    SubscribeToOpenInterestsRequest:
      type: object
      properties:
        venueId:
          type: string
        instrument:
          $ref: '#/components/schemas/Instrument'
      required:
