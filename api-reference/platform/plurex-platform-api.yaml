          uniqueItems: true
          minItems: 1
        get:
          type: boolean
          description: Whether getMarketPositionMode is supported on this market.
        setEffectScope:
          anyOf:
          - $ref: '#/components/schemas/MarketSettingEffectScope'
          - type: 'null'
          description: 'setMarketPositionMode on this market: what a set affects (this market, its host-defined group, or
            the whole account). Null means it cannot be set.'
      required:
      - values
      - get
      - setEffectScope
    PositionEffect:
      type: string
