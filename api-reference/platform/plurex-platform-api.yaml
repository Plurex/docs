          type: array
          items:
            $ref: '#/components/schemas/StatisticsField'
          uniqueItems: true
          minItems: 1
          description: Fields the venue reports; others are always null.
        get:
          type: boolean
          description: GetMarketStatistics on this market.
      required:
      - window
      - supportedFields
      - get
    IndicativeFundingSpec:
      type: object
      properties:
        get:
          type: boolean
          description: GetIndicativeFundings on this market.
      required:
      - get
    OpenInterestSpec:
      type: object
