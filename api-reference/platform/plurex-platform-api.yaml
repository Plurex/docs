        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Rejected'
        '500':
          $ref: '#/components/responses/UnexpectedError'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-KEY
    ApiSecret:
      type: apiKey
      in: header
      name: X-API-SECRET
  responses:
    BadRequest:
      description: 400 BadRequest; code is InvalidRequest.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthenticated:
      description: 401 Unauthenticated; code is Unauthenticated.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: 403 Forbidden; code is Forbidden.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: 404 NotFound; code is AccountNotFound, OrderNotFound or NotFound.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: 409 Conflict; code is DuplicateClientOrderId, OrderAlreadyClosed or Conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Rejected:
      description: 422 Rejected; code is InsufficientFunds, InvalidProviderCredentials, AccountLimit, NotSupported or Rejected.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: 429 RateLimited; code is RateLimited.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnexpectedError:
      description: 500 UnexpectedError; code is UnexpectedError.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UpstreamFailure:
      description: 502 UpstreamFailure; code is UpstreamFailure or CancelAllFailed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unavailable:
      description: 503 Unavailable; code is Unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UpstreamTimeout:
      description: 504 UpstreamTimeout; code is UpstreamTimeout.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnsupportedMediaType:
      description: 415 UnsupportedMediaType; code is UnsupportedMediaType.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    AccountCredentialPublic:
      type: object
      properties:
        publicValue:
          type:
          - string
          - 'null'
          description: Non-secret part of the credential, such as the API key; null when the credential type has none (paper).
        credentialType:
          $ref: '#/components/schemas/HostCredentialType'
      required:
      - publicValue
      - credentialType
    HostCredentialType:
      type: string
      enum:
      - ApiKey
      - Paper
    AccountHeader:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
          description: The tenant that owns the account.
        hostId:
          type: string
        isPaper:
          type: boolean
        name:
          type: string
        credential:
          $ref: '#/components/schemas/AccountCredentialPublic'
      required:
      - id
      - tenantId
      - hostId
      - isPaper
      - name
      - credential
    AccountMarginState:
      type: object
      properties:
        baseCollateralAsset:
          type: string
        totalCollateralValue:
          $ref: '#/components/schemas/Decimal'
        totalInitialMargin:
          $ref: '#/components/schemas/Decimal'
        totalMaintenanceMargin:
          $ref: '#/components/schemas/Decimal'
        accountMarginRatio:
          anyOf:
          - $ref: '#/components/schemas/Decimal'
          - type: 'null'
          description: Host-reported value; null if the host does not supply it.
      required:
      - baseCollateralAsset
      - totalCollateralValue
      - totalInitialMargin
      - totalMaintenanceMargin
      - accountMarginRatio
    AccountMarketState:
      oneOf:
      - $ref: '#/components/schemas/AccountMarketStateDerivative'
      - $ref: '#/components/schemas/AccountMarketStateSpot'
      - $ref: '#/components/schemas/AccountMarketStateSpotMargin'
      discriminator:
        propertyName: type
        mapping:
          Derivative: '#/components/schemas/AccountMarketStateDerivative'
          Spot: '#/components/schemas/AccountMarketStateSpot'
          SpotMargin: '#/components/schemas/AccountMarketStateSpotMargin'
    AccountMarketStateDerivative:
      type: object
      properties:
        instrument:
          $ref: '#/components/schemas/Instrument'
        currentLeverageSetting:
          $ref: '#/components/schemas/MarketLeverageSetting'
        collateral:
          $ref: '#/components/schemas/MarketCollateral'
        position:
          $ref: '#/components/schemas/MarketPosition'
        type:
          type: string
          enum:
          - Derivative
      required:
      - type
      - instrument
      - currentLeverageSetting
      - collateral
      - position
    CanonicalInstrumentSymbol:
      type: string
      readOnly: true
      pattern: ^[A-Z0-9.]{1,32}-[A-Z0-9.]{1,32}-(?:SPOT|PERP|PERPINV|FUT_[0-9]{8}|FUTINV_[0-9]{8}|OPT_[0-9]{8}_(?:0|[1-9][0-9]*)(?:\.[0-9]*[1-9])?_(?:CALL|PUT))$
      description: 'Plurex canonical BASE-QUOTE-TYPE representation of an instrument, independent of venue naming. Derive
        it from an Instrument as base, "-", quote, "-", then the type token: Spot -> SPOT, Perp -> PERP, PerpInv -> PERPINV,
        Future -> FUT_YYYYMMDD, FutureInv -> FUTINV_YYYYMMDD, Option -> OPT_YYYYMMDD_STRIKE_RIGHT, where YYYYMMDD is expiry
        (YYYY-MM-DD) without dashes, STRIKE is strike as given and RIGHT is CALL or PUT. Examples: BTC/USD Future expiring
        2030-03-29 is BTC-USD-FUT_20300329; a BTC/USD 50000 call expiring 2030-03-29 is BTC-USD-OPT_20300329_50000_CALL. Returned
        on host and venue market summaries; not an instrument input field or a venue-native identifier.'
    Instrument:
      oneOf:
      - $ref: '#/components/schemas/InstrumentFuture'
      - $ref: '#/components/schemas/InstrumentFutureInv'
      - $ref: '#/components/schemas/InstrumentOption'
      - $ref: '#/components/schemas/InstrumentPerp'
      - $ref: '#/components/schemas/InstrumentPerpInv'
      - $ref: '#/components/schemas/InstrumentSpot'
      discriminator:
        propertyName: type
        mapping:
          Future: '#/components/schemas/InstrumentFuture'
          FutureInv: '#/components/schemas/InstrumentFutureInv'
          Option: '#/components/schemas/InstrumentOption'
          Perp: '#/components/schemas/InstrumentPerp'
          PerpInv: '#/components/schemas/InstrumentPerpInv'
          Spot: '#/components/schemas/InstrumentSpot'
      description: 'An instrument, identified by its fields rather than a venue symbol: type, base, quote, and expiry, strike
        and right where they apply. type takes the InstrumentType values; unknown types are rejected. Market summaries also
        give its canonical symbol.'
    InstrumentFuture:
      type: object
      properties:
        base:
          type: string
          pattern: ^[A-Z0-9.]{1,32}$
        quote:
          type: string
          pattern: ^[A-Z0-9.]{1,32}$
        expiry:
          type: string
          format: date
          description: Contract expiry date (YYYY-MM-DD).
        type:
          type: string
          enum:
          - Future
      required:
      - type
      - base
      - quote
      - expiry
    InstrumentFutureInv:
      type: object
      properties:
        base:
          type: string
          pattern: ^[A-Z0-9.]{1,32}$
        quote:
          type: string
          pattern: ^[A-Z0-9.]{1,32}$
        expiry:
          type: string
          format: date
          description: Contract expiry date (YYYY-MM-DD).
        type:
          type: string
          enum:
          - FutureInv
      required:
      - type
      - base
      - quote
      - expiry
    InstrumentOption:
      type: object
      properties:
        base:
          type: string
          pattern: ^[A-Z0-9.]{1,32}$
        quote:
          type: string
          pattern: ^[A-Z0-9.]{1,32}$
        expiry:
          type: string
          format: date
          description: Contract expiry date (YYYY-MM-DD).
        strike:
          type: string
          pattern: ^(?:0|[1-9][0-9]*)(?:\.[0-9]*[1-9])?$
          description: Positive strike price in the quote asset, in canonical form so identity is exact; a plain decimal with
            no exponent and no trailing fractional zeros (50000, not 50000.0 or 5E4).
        right:
          $ref: '#/components/schemas/OptionRight'
        type:
          type: string
          enum:
          - Option
      required:
      - type
      - base
      - quote
      - expiry
      - strike
      - right
      description: Option contract. Option markets are not listed or tradable yet; options appear only where a host reports
        account activity on them.
    OptionRight:
      type: string
      enum:
      - Call
      - Put
    InstrumentPerp:
      type: object
      properties:
        base:
          type: string
          pattern: ^[A-Z0-9.]{1,32}$
        quote:
          type: string
          pattern: ^[A-Z0-9.]{1,32}$
        type:
          type: string
          enum:
          - Perp
      required:
      - type
      - base
      - quote
    InstrumentPerpInv:
      type: object
      properties:
        base:
          type: string
          pattern: ^[A-Z0-9.]{1,32}$
        quote:
          type: string
          pattern: ^[A-Z0-9.]{1,32}$
        type:
          type: string
          enum:
          - PerpInv
      required:
      - type
      - base
      - quote
    InstrumentSpot:
      type: object
      properties:
        base:
          type: string
          pattern: ^[A-Z0-9.]{1,32}$
        quote:
          type: string
          pattern: ^[A-Z0-9.]{1,32}$
        type:
          type: string
          enum:
          - Spot
      required:
      - type
      - base
      - quote
    MarketLeverageSetting:
      description: The account's current market-level leverage for a market whose settings.leverage is non-null. Leveraged
        carries the configured multiple; Disabled means the market-level control exists and leverage is off for this account,
        so orders are not leveraged; Unknown means the host cannot report the setting truthfully.
      oneOf:
      - $ref: '#/components/schemas/MarketLeverageSettingDisabled'
      - $ref: '#/components/schemas/MarketLeverageSettingLeveraged'
      - $ref: '#/components/schemas/MarketLeverageSettingUnknown'
      discriminator:
        propertyName: type
        mapping:
          Disabled: '#/components/schemas/MarketLeverageSettingDisabled'
          Leveraged: '#/components/schemas/MarketLeverageSettingLeveraged'
          Unknown: '#/components/schemas/MarketLeverageSettingUnknown'
    MarketLeverageSettingDisabled:
      type: object
      properties:
        type:
          type: string
          enum:
          - Disabled
      required:
      - type
    MarketLeverageSettingLeveraged:
      type: object
      properties:
        leverage:
          $ref: '#/components/schemas/Decimal'
        type:
          type: string
          enum:
          - Leveraged
      required:
      - type
      - leverage
    MarketLeverageSettingUnknown:
      type: object
      properties:
        message:
          type: string
        type:
          type: string
          enum:
          - Unknown
      required:
      - type
      - message
    MarketCollateral:
      type: object
      properties:
        valueAsset:
          type: string
        total:
          $ref: '#/components/schemas/Decimal'
        available:
          $ref: '#/components/schemas/Decimal'
      required:
      - valueAsset
      - total
      - available
    MarketPosition:
      type: object
      properties:
        instrument:
          $ref: '#/components/schemas/Instrument'
        long:
          $ref: '#/components/schemas/Position'
        short:
          $ref: '#/components/schemas/Position'
        mode:
          anyOf:
          - $ref: '#/components/schemas/PositionMode'
          - type: 'null'
          description: Host-reported value; null if the host does not supply it.
      required:
      - instrument
      - long
      - short
      - mode
    Position:
      type: object
      properties:
        size:
          $ref: '#/components/schemas/Decimal'
          description: Native contract units; see ContractDetails.
        entryPrice:
          anyOf:
          - $ref: '#/components/schemas/Decimal'
          - type: 'null'
          description: Host-reported value; null if the host does not supply it.
      required:
      - size
      - entryPrice
    PositionMode:
      type: string
      enum:
      - Hedging
      - Netting
    AccountMarketStateSpot:
      type: object
      properties:
        instrument:
          $ref: '#/components/schemas/Instrument'
        base:
          $ref: '#/components/schemas/AssetBalance'
        quote:
          $ref: '#/components/schemas/AssetBalance'
        type:
          type: string
          enum:
          - Spot
      required:
      - type
      - instrument
      - base
      - quote
    AssetBalance:
      type: object
      properties:
        available:
          $ref: '#/components/schemas/Decimal'
      required:
      - available
    AccountMarketStateSpotMargin:
      type: object
      properties:
        instrument:
          $ref: '#/components/schemas/Instrument'
        currentLeverageSetting:
          $ref: '#/components/schemas/MarketLeverageSetting'
        collateral:
          $ref: '#/components/schemas/MarketCollateral'
        base:
          $ref: '#/components/schemas/AssetBalance'
        quote:
          $ref: '#/components/schemas/AssetBalance'
        type:
          type: string
          enum:
          - SpotMargin
      required:
      - type
      - instrument
      - currentLeverageSetting
      - collateral
      - base
      - quote
      description: A spot market whose leverage is a market-level setting, as on a perp; only returned when the market's settings.leverage
        is non-null. Spot margin that a host offers only per order is not supported, and those markets are returned as Spot.
    AccountOrderEvent:
      type: object
      properties:
        change:
          $ref: '#/components/schemas/OrderChange'
        order:
