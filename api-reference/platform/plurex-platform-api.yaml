      operationId: depositPaperAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaperAccountDepositCommand'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
