  /api/v1/hosts/command/SubmitOrder:
    post:
      operationId: hostsSubmitOrder
      summary: Submit an order
      description: Submits one order and returns it as the host accepted it. If the outcome is unclear (a timeout or 5xx),
        look the order up by clientOrderId before resubmitting. 409 DuplicateClientOrderId means an order with that clientOrderId
        already exists.
      tags:
      - orders
      - not-repeat-safe
      security:
      - ApiKey: []
        ApiSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitOrderCommand'
            examples:
              Limit:
                summary: Post-only GTC limit buy on a perpetual
                value:
                  accountId: acc_123
                  order:
                    type: Limit
                    instrument:
                      type: Perp
                      base: BTC
                      quote: USDT
                    side: Buy
                    size: '0.010'
                    price: '67250.5'
                    reduceOnly: false
                    tif: GTC
                    postOnly: true
                    clientOrderId: grid-buy-0042
              MarketBySize:
                summary: Reduce-only market sell of 0.005 contracts
                value:
                  accountId: acc_123
                  order:
                    type: Market
                    instrument:
                      type: Perp
                      base: BTC
                      quote: USDT
                    side: Sell
                    sizing:
                      type: Size
                      size: '0.005'
                    reduceOnly: true
                    tif: IOC
                    clientOrderId: tp-0007
              MarketByNotional:
                summary: Market buy of 250 USDT worth of spot BTC
                value:
                  accountId: acc_123
                  order:
                    type: Market
                    instrument:
                      type: Spot
                      base: BTC
                      quote: USDT
                    side: Buy
                    sizing:
                      type: Notional
                      notional: '250'
                    reduceOnly: false
                    clientOrderId: null
              TriggerLimit:
                summary: 'Stop-limit: sell when the mark price falls to 65000'
                value:
                  accountId: acc_123
                  order:
                    type: TriggerLimit
                    instrument:
                      type: Perp
                      base: BTC
                      quote: USDT
                    side: Sell
                    size: '0.010'
                    price: '64900'
                    reduceOnly: true
                    tif: GTC
                    clientOrderId: sl-0042
                    trigger:
                      price: '65000'
                      condition: RefPriceLTE
                      reference: Mark
              TriggerMarket:
                summary: 'Breakout: market buy when the last trade reaches 70000'
                value:
                  accountId: acc_123
                  order:
                    type: TriggerMarket
                    instrument:
                      type: Perp
                      base: BTC
                      quote: USDT
                    side: Buy
                    sizing:
                      type: Size
                      size: '0.020'
                    reduceOnly: false
                    tif: IOC
                    clientOrderId: breakout-0003
                    trigger:
                      price: '70000'
                      condition: RefPriceGTE
                      reference: LastTrade
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEnvelopeOrder'
              examples:
                Limit:
                  summary: Accepted and resting on the book
                  value:
                    data:
                      type: Limit
                      id: '1843029411'
                      createdAt: '2026-10-26T09:30:00.120Z'
                      side: Buy
                      instrument:
                        type: Perp
                        base: BTC
                        quote: USDT
                      state: Live
                      sizeTraded: '0'
                      averagePrice: null
                      realizedPnl: null
                      totalFees: []
                      clientOrderId: grid-buy-0042
                      size: '0.010'
                      price: '67250.5'
                MarketBySize:
                  summary: Filled immediately; fees and realized PnL reported
                  value:
                    data:
                      type: Market
                      id: '1843029412'
                      createdAt: '2026-10-26T09:30:00.120Z'
                      side: Sell
                      instrument:
                        type: Perp
                        base: BTC
                        quote: USDT
                      state: Filled
                      sizeTraded: '0.005'
                      averagePrice: '67248.1'
                      realizedPnl:
                        asset: USDT
                        value: '4.12'
                      totalFees:
                      - asset: USDT
                        value: '0.184932'
                      clientOrderId: tp-0007
                      sizing:
                        type: Size
                        size: '0.005'
                MarketByNotional:
