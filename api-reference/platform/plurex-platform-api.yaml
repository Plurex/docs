    GetOrders:
      oneOf:
      - $ref: '#/components/schemas/GetOrdersByClientOrderIds'
      - $ref: '#/components/schemas/GetOrdersByClientOrderIdsForInstrument'
      - $ref: '#/components/schemas/GetOrdersByIds'
      discriminator:
        propertyName: type
        mapping:
          ByClientOrderIds: '#/components/schemas/GetOrdersByClientOrderIds'
          ByClientOrderIdsForInstrument: '#/components/schemas/GetOrdersByClientOrderIdsForInstrument'
          ByIds: '#/components/schemas/GetOrdersByIds'
      description: 'How to identify the orders to get: by order IDs or by clientOrderIds, optionally scoped to an instrument.'
    GetOrdersByClientOrderIds:
      title: ByClientOrderIds
      type: object
      properties:
        clientOrderIds:
          type: array
          items:
            type: string
        type:
          type: string
          enum:
          - ByClientOrderIds
      required:
      - type
      - clientOrderIds
      description: Selects the orders by the clientOrderIds they were submitted with.
    GetOrdersByClientOrderIdsForInstrument:
      title: ByClientOrderIdsForInstrument
      type: object
      properties:
        instrument:
          $ref: '#/components/schemas/Instrument'
        clientOrderIds:
          type: array
          items:
            type: string
        type:
          type: string
          enum:
          - ByClientOrderIdsForInstrument
      required:
      - type
      - instrument
      - clientOrderIds
      description: Selects the orders by clientOrderId on one instrument, for hosts that need the instrument to find them.
    GetOrdersByIds:
      title: ByIds
      type: object
      properties:
        orderIds:
          type: array
          items:
            type: string
        type:
          type: string
          enum:
          - ByIds
      required:
      - type
      - orderIds
      description: Selects the orders by their order IDs, as returned on Order.id.
    GetOrdersQuery:
      type: object
      properties:
        accountId:
          type: string
        query:
          $ref: '#/components/schemas/GetOrders'
      required:
      - accountId
      - query
      description: Gets several orders on the account in one request.
    HostHeader:
      type: object
      properties:
        id:
          type: string
        venueIds:
          type: array
          items:
            type: string
        modelHostId:
          type:
          - string
          - 'null'
          description: The real host whose markets and order rules this paper host simulates; absent for a real host.
        capabilities:
          $ref: '#/components/schemas/ExecutionHostCapabilities'
        isPaper:
          type: boolean
          description: True for a paper host. Paper accounts use the same hosts operations as connected exchange and broker
            accounts.
        supportedCredentialTypes:
          type: array
          items:
            $ref: '#/components/schemas/HostCredentialType'
      required:
      - id
      - venueIds
      - modelHostId
      - capabilities
      - isPaper
      - supportedCredentialTypes
      description: 'A host (an exchange, broker or paper simulation) that accounts trade on: the venues it reaches, the credentials
        it accepts and what it supports. Check capabilities before using optional operations.'
    HostMarketQuery:
      type: object
      properties:
        hostId:
          type: string
        base:
          type:
          - string
          - 'null'
          description: Exact base asset; null or omitted matches any.
        quote:
          type:
          - string
          - 'null'
          description: Exact quote asset; null or omitted matches any.
        types:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/InstrumentType'
          uniqueItems: true
          description: Match any listed InstrumentType; null or omitted matches every type.
          minItems: 1
        search:
          type:
          - string
          - 'null'
          description: Fuzzy, case-insensitive token matching on the canonical instrument symbol.
        cursor:
          type:
          - string
          - 'null'
          description: 'nextCursor from the previous page; omit for the first page. Only valid with the same query: same variant,
            account and filters.'
      required:
      - hostId
      description: Lists the markets a host can trade, optionally filtered by asset, instrument type or symbol search.
    InstrumentType:
      type: string
      enum:
      - Spot
      - Perp
      - PerpInv
      - Future
      - FutureInv
      - Option
      description: The kind of instrument, matching Instrument's type, used to filter market listings.
    HostMarketSummary:
      type: object
      properties:
        venueId:
          type: string
        symbol:
          $ref: '#/components/schemas/CanonicalInstrumentSymbol'
        instrument:
          $ref: '#/components/schemas/Instrument'
        contractDetails:
          $ref: '#/components/schemas/ContractDetails'
        orderTypes:
          $ref: '#/components/schemas/OrderTypes'
        settings:
          $ref: '#/components/schemas/MarketSettings'
      required:
      - venueId
      - symbol
      - instrument
      - contractDetails
      - orderTypes
      - settings
      description: 'A market a host can trade: its instrument and symbol, contract details, the order types it accepts with
        their rules, and its account settings.'
    OrderTypes:
      type: object
      properties:
        limit:
          $ref: '#/components/schemas/LimitOrderSpec'
        market:
          anyOf:
          - $ref: '#/components/schemas/MarketOrderSpec'
          - type: 'null'
          description: Null means unsupported on this market.
        triggerLimit:
          anyOf:
          - $ref: '#/components/schemas/TriggerLimitOrderSpec'
          - type: 'null'
          description: Null means unsupported on this market.
        triggerMarket:
          anyOf:
          - $ref: '#/components/schemas/TriggerMarketOrderSpec'
          - type: 'null'
          description: Null means unsupported on this market.
      required:
      - limit
      - market
      - triggerLimit
      - triggerMarket
      description: Order types available on this market. limit is always present; null means the type is unsupported.
    LimitOrderSpec:
      type: object
      properties:
        price:
          $ref: '#/components/schemas/PriceConstraints'
        size:
          $ref: '#/components/schemas/SizeConstraints'
        value:
          $ref: '#/components/schemas/ValueConstraints'
        options:
          $ref: '#/components/schemas/LimitOrderOptionSupport'
      required:
      - price
      - size
      - value
      - options
      description: Rules for each input of a limit order on this market, and its supported options.
    LimitOrderOptionSupport:
      type: object
      properties:
        supportsReduceOnly:
          type: boolean
        supportedTimeInForce:
          type: array
          items:
            $ref: '#/components/schemas/LimitOrderTif'
          uniqueItems: true
          minItems: 1
        supportsPostOnly:
          type: boolean
        supportsPositionEffect:
          type: boolean
      required:
      - supportsReduceOnly
      - supportedTimeInForce
      - supportsPostOnly
      - supportsPositionEffect
      description: Options supported for limit orders on this market.
    LimitOrderTif:
      type: string
      enum:
      - GTC
      - FOK
      - IOC
      description: 'How long a limit order stays working: GTC (until cancelled), IOC (fill what it can now, cancel the rest)
        or FOK (fill entirely now or cancel).'
    MarketOrderSpec:
      type: object
      properties:
        sizingSupport:
          $ref: '#/components/schemas/MarketOrderSizingSupport'
        size:
          anyOf:
          - $ref: '#/components/schemas/SizeConstraints'
          - type: 'null'
          description: Present exactly when Size appears in sizingSupport.buy or sizingSupport.sell.
        notional:
          anyOf:
          - $ref: '#/components/schemas/NotionalConstraints'
          - type: 'null'
          description: Present exactly when Notional appears in sizingSupport.buy or sizingSupport.sell.
        options:
          $ref: '#/components/schemas/MarketOrderOptionSupport'
      required:
      - sizingSupport
      - size
      - notional
      - options
      description: Supported sizing modes per side, the rules for each mode and the supported options for market orders on
        this market. Market orders have no value floor here; a host may still reject one worth too little at its own price.
    PriceConstraints:
      type: object
      properties:
        increment:
          $ref: '#/components/schemas/Decimal'
          description: A valid price is a whole multiple of this, in quote per base.
      required:
      - increment
      description: Rules for a price input (price, or trigger.price on trigger orders).
    SizeConstraints:
      type: object
      properties:
        increment:
          $ref: '#/components/schemas/Decimal'
          description: A valid size is a whole multiple of this, in native contracts.
        min:
          anyOf:
          - $ref: '#/components/schemas/Decimal'
          - type: 'null'
          description: Smallest accepted size, inclusive; null when the host publishes none.
      required:
      - increment
      - min
      description: Rules for the size input, in native contracts (see ContractDetails).
    NotionalConstraints:
      type: object
      properties:
        increment:
          anyOf:
          - $ref: '#/components/schemas/Decimal'
          - type: 'null'
          description: A valid notional is a whole multiple of this, in quote. Null when the host publishes none; the host
            may then reject or round the amount, and the order's sizing shows what it accepted.
        min:
          anyOf:
          - $ref: '#/components/schemas/Decimal'
          - type: 'null'
          description: Smallest accepted notional, inclusive; null when the host publishes none.
      required:
      - increment
      - min
      description: Rules for the notional input, in quote. A notional is not a size promise; the size received is the notional
        divided by the fill price and can fall below the market's minimum size.
    ValueConstraints:
      type: object
      properties:
        min:
          anyOf:
          - $ref: '#/components/schemas/Decimal'
          - type: 'null'
          description: Smallest accepted value, inclusive; null when the host publishes none.
      required:
      - min
      description: Rules for the order's value, in quote, computed from its price and size per ContractDetails. Never sent.
    MarketOrderOptionSupport:
      type: object
      properties:
        supportsReduceOnly:
          type: boolean
        supportedTimeInForce:
          type: array
          items:
            $ref: '#/components/schemas/MarketOrderTif'
          uniqueItems: true
          minItems: 1
        supportsPositionEffect:
          type: boolean
      required:
      - supportsReduceOnly
      - supportedTimeInForce
      - supportsPositionEffect
      description: Options supported for market orders on this market.
    MarketOrderSizingSupport:
      type: object
      properties:
        buy:
          type: array
          items:
            $ref: '#/components/schemas/MarketOrderSizingType'
          uniqueItems: true
          minItems: 1
        sell:
          type: array
          items:
            $ref: '#/components/schemas/MarketOrderSizingType'
          uniqueItems: true
          minItems: 1
      required:
      - buy
      - sell
      description: Supported quantity representations for buy and sell market orders.
    MarketOrderSizingType:
      type: string
      enum:
      - Size
      - Notional
      description: 'How a market order''s amount is given: Size in native contracts, or Notional as a quote-asset amount.'
    MarketOrderTif:
      type: string
      enum:
      - IOC
      - FOK
      description: 'How a market order handles what it cannot fill now: IOC cancels the rest, FOK cancels the whole order
        unless it fills entirely.'
    TriggerLimitOrderSpec:
      type: object
      properties:
        price:
          $ref: '#/components/schemas/PriceConstraints'
        size:
          $ref: '#/components/schemas/SizeConstraints'
        value:
          $ref: '#/components/schemas/ValueConstraints'
        options:
          $ref: '#/components/schemas/LimitOrderOptionSupport'
        trigger:
          $ref: '#/components/schemas/TriggerOrderSupport'
      required:
      - price
      - size
      - value
      - options
      - trigger
      description: Rules for each input of a trigger limit order on this market, its supported options and trigger rules.
    TriggerOrderSupport:
      type: object
      properties:
        price:
          $ref: '#/components/schemas/PriceConstraints'
        referencePrice:
          $ref: '#/components/schemas/TriggerReferencePricePolicy'
        sellConditions:
          type: array
          items:
            $ref: '#/components/schemas/TriggerCondition'
          uniqueItems: true
        buyConditions:
          type: array
          items:
            $ref: '#/components/schemas/TriggerCondition'
          uniqueItems: true
      required:
      - price
      - referencePrice
      - sellConditions
      - buyConditions
      description: Rules for the order's trigger.price, and the supported reference prices and conditions for trigger orders
        on this market.
    TriggerReferencePricePolicy:
      oneOf:
      - $ref: '#/components/schemas/TriggerReferencePricePolicyHostSelected'
      - $ref: '#/components/schemas/TriggerReferencePricePolicyUserSelectable'
      discriminator:
        propertyName: type
        mapping:
          HostSelected: '#/components/schemas/TriggerReferencePricePolicyHostSelected'
          UserSelectable: '#/components/schemas/TriggerReferencePricePolicyUserSelectable'
      description: UserSelectable requires an explicit reference in the advertised non-empty set. HostSelected fixes the reference;
        null means the host does not disclose it. Never infer a reference the host did not report.
    TriggerReferencePricePolicyHostSelected:
      title: HostSelected
      type: object
      properties:
        price:
          anyOf:
          - $ref: '#/components/schemas/TriggerReferencePrice'
          - type: 'null'
          description: The reference price the host uses; null when the host does not disclose it.
        type:
          type: string
          enum:
          - HostSelected
      required:
      - price
      - type
      description: The host fixes the reference price triggers watch on this market.
    TriggerReferencePricePolicyUserSelectable:
      title: UserSelectable
      type: object
      properties:
        prices:
          type: array
          items:
            $ref: '#/components/schemas/TriggerReferencePrice'
          uniqueItems: true
          minItems: 1
        type:
          type: string
          enum:
          - UserSelectable
      required:
      - type
      - prices
      description: Each trigger order must choose its reference price from prices.
    TriggerMarketOrderSpec:
      type: object
      properties:
        sizingSupport:
          $ref: '#/components/schemas/MarketOrderSizingSupport'
        size:
          anyOf:
          - $ref: '#/components/schemas/SizeConstraints'
          - type: 'null'
          description: Present exactly when Size appears in sizingSupport.buy or sizingSupport.sell.
        notional:
          anyOf:
          - $ref: '#/components/schemas/NotionalConstraints'
          - type: 'null'
          description: Present exactly when Notional appears in sizingSupport.buy or sizingSupport.sell.
        options:
          $ref: '#/components/schemas/MarketOrderOptionSupport'
        trigger:
          $ref: '#/components/schemas/TriggerOrderSupport'
      required:
      - sizingSupport
      - size
      - notional
      - options
      - trigger
      description: Supported sizing modes per side, the rules for each mode, the supported options and trigger rules for trigger
        market orders on this market.
    MarketSettings:
      type: object
      properties:
        leverage:
          anyOf:
          - $ref: '#/components/schemas/MarketLeverageSpec'
          - type: 'null'
          description: Null means unsupported on this market.
        positionMode:
          anyOf:
          - $ref: '#/components/schemas/MarketPositionModeSpec'
          - type: 'null'
          description: Null means unsupported on this market.
      required:
      - leverage
      - positionMode
      description: Settings available on this market. null means the setting does not exist here.
    MarketLeverageSpec:
      type: object
      properties:
        min:
          $ref: '#/components/schemas/Decimal'
        max:
          $ref: '#/components/schemas/Decimal'
        step:
          $ref: '#/components/schemas/Decimal'
          description: Positive. Irrelevant when min equals max, which is a single fixed leverage.
        get:
          type: boolean
          description: Whether getMarketLeverage is supported on this market.
        setEffectScope:
          anyOf:
          - $ref: '#/components/schemas/MarketSettingEffectScope'
          - type: 'null'
          description: 'setMarketLeverage on this market: what a set affects (this market, its host-defined group, or the
            whole account). Null means it cannot be set.'
      required:
      - min
      - max
      - step
      - get
      - setEffectScope
      description: Inclusive min/max; accepted values are exactly min plus a whole number of steps.
    MarketSettingEffectScope:
      oneOf:
      - $ref: '#/components/schemas/MarketSettingEffectScopeAccount'
      - $ref: '#/components/schemas/MarketSettingEffectScopeMarket'
      - $ref: '#/components/schemas/MarketSettingEffectScopeMarketGroup'
      discriminator:
        propertyName: type
        mapping:
          Account: '#/components/schemas/MarketSettingEffectScopeAccount'
          Market: '#/components/schemas/MarketSettingEffectScopeMarket'
          MarketGroup: '#/components/schemas/MarketSettingEffectScopeMarketGroup'
      description: 'What changing a market setting affects: only this market, a host-defined group of markets, or the whole
        account.'
    MarketSettingEffectScopeAccount:
      title: Account
      type: object
      properties:
        type:
          type: string
          enum:
          - Account
      required:
      - type
      description: A change applies to every market on the account.
    MarketSettingEffectScopeMarket:
      title: Market
      type: object
      properties:
        type:
          type: string
          enum:
          - Market
      required:
      - type
      description: A change applies only to this market.
    MarketSettingEffectScopeMarketGroup:
      title: MarketGroup
      type: object
      properties:
        type:
          type: string
          enum:
          - MarketGroup
      required:
      - type
      description: A change applies to a host-defined group of markets that includes this one.
    MarketPositionModeSpec:
      type: object
      properties:
        values:
          type: array
          items:
            $ref: '#/components/schemas/PositionMode'
          uniqueItems: true
          minItems: 1
        get:
          type: boolean
          description: Whether getMarketPositionMode is supported on this market.
        setEffectScope:
          anyOf:
          - $ref: '#/components/schemas/MarketSettingEffectScope'
          - type: 'null'
          description: 'setMarketPositionMode on this market: what a set affects (this market, its host-defined group, or
            the whole account). Null means it cannot be set.'
      required:
      - values
      - get
      - setEffectScope
      description: The position modes this market offers, and whether the account's mode can be read and set here.
    PositionEffect:
      type: string
      enum:
      - Open
      - Close
      description: Whether an order opens or adds to a position (Open) or reduces or closes one (Close), for hosts that need
        it in hedging mode.
    ListAccountMarginStatesQuery:
      type: object
      properties:
        accountId:
          type: string
        cursor:
          type:
          - string
          - 'null'
          description: 'nextCursor from the previous page; omit for the first page. Only valid with the same query: same variant,
            account and filters.'
      required:
      - accountId
      description: Lists the account's margin state per margin group.
    ListAccountsQuery:
      type: object
      properties:
        tenantId:
          type: string
          description: The tenant whose accounts to list. Find your tenant ID next to your API keys on the DevTools page of
            the Plurex app.
        hostIds:
          type:
          - array
          - 'null'
          items:
            type: string
          uniqueItems: true
          description: Only accounts on these hosts; null or omitted matches every host.
        isPaper:
          type:
          - boolean
          - 'null'
          description: Only paper (true) or connected exchange and broker (false) accounts; null or omitted matches both.
        cursor:
          type:
          - string
          - 'null'
          description: 'nextCursor from the previous page; omit for the first page. Only valid with the same query: same variant,
            account and filters.'
      required:
      - tenantId
      description: Lists the tenant's accounts, optionally filtered by host or by paper.
    ListClosedOrders:
      oneOf:
      - $ref: '#/components/schemas/ListClosedOrdersByInstrument'
      - $ref: '#/components/schemas/ListClosedOrdersByInstrumentAfter'
      - $ref: '#/components/schemas/ListClosedOrdersByInstrumentBefore'
      - $ref: '#/components/schemas/ListClosedOrdersGlobal'
      - $ref: '#/components/schemas/ListClosedOrdersGlobalAfter'
      - $ref: '#/components/schemas/ListClosedOrdersGlobalBefore'
      discriminator:
        propertyName: type
        mapping:
          ByInstrument: '#/components/schemas/ListClosedOrdersByInstrument'
          ByInstrumentAfter: '#/components/schemas/ListClosedOrdersByInstrumentAfter'
          ByInstrumentBefore: '#/components/schemas/ListClosedOrdersByInstrumentBefore'
          Global: '#/components/schemas/ListClosedOrdersGlobal'
          GlobalAfter: '#/components/schemas/ListClosedOrdersGlobalAfter'
          GlobalBefore: '#/components/schemas/ListClosedOrdersGlobalBefore'
      description: 'Which closed orders to list: all or one instrument, optionally only those before or after a time.'
    ListClosedOrdersByInstrument:
      title: ByInstrument
      type: object
      properties:
        instrument:
          $ref: '#/components/schemas/Instrument'
        type:
          type: string
          enum:
          - ByInstrument
      required:
      - type
      - instrument
      description: Lists closed orders on one instrument.
    ListClosedOrdersByInstrumentAfter:
      title: ByInstrumentAfter
      type: object
      properties:
        instrument:
          $ref: '#/components/schemas/Instrument'
        after:
          type: string
          format: date-time
        type:
          type: string
          enum:
          - ByInstrumentAfter
      required:
      - type
      - instrument
      - after
      description: Lists closed orders on one instrument after a time.
    ListClosedOrdersByInstrumentBefore:
      title: ByInstrumentBefore
      type: object
      properties:
        instrument:
          $ref: '#/components/schemas/Instrument'
        before:
          type: string
          format: date-time
        type:
          type: string
          enum:
          - ByInstrumentBefore
      required:
      - type
      - instrument
      - before
      description: Lists closed orders on one instrument before a time.
    ListClosedOrdersGlobal:
      title: Global
      type: object
      properties:
        type:
          type: string
          enum:
          - Global
      required:
      - type
      description: Lists closed orders on every instrument.
    ListClosedOrdersGlobalAfter:
      title: GlobalAfter
      type: object
      properties:
        after:
          type: string
          format: date-time
        type:
          type: string
          enum:
          - GlobalAfter
      required:
      - type
      - after
      description: Lists closed orders on every instrument after a time.
    ListClosedOrdersGlobalBefore:
      title: GlobalBefore
      type: object
      properties:
        before:
          type: string
          format: date-time
        type:
          type: string
          enum:
          - GlobalBefore
      required:
      - type
      - before
      description: Lists closed orders on every instrument before a time.
    ListClosedOrdersQuery:
      type: object
      properties:
        accountId:
          type: string
        query:
          $ref: '#/components/schemas/ListClosedOrders'
        cursor:
          type:
          - string
          - 'null'
          description: 'nextCursor from the previous page; omit for the first page. Only valid with the same query: same variant,
            account and filters.'
      required:
      - accountId
      - query
      description: Lists the account's filled, cancelled and rejected orders.
    ListFills:
      oneOf:
      - $ref: '#/components/schemas/ListFillsByInstrument'
      - $ref: '#/components/schemas/ListFillsByOrderId'
      - $ref: '#/components/schemas/ListFillsGlobal'
      discriminator:
        propertyName: type
        mapping:
          ByInstrument: '#/components/schemas/ListFillsByInstrument'
          ByOrderId: '#/components/schemas/ListFillsByOrderId'
          Global: '#/components/schemas/ListFillsGlobal'
      description: 'Which fills to list: all, one instrument, or one order.'
    ListFillsByInstrument:
      title: ByInstrument
      type: object
      properties:
        instrument:
          $ref: '#/components/schemas/Instrument'
        type:
          type: string
          enum:
          - ByInstrument
      required:
      - type
      - instrument
      description: Lists fills on one instrument.
    ListFillsByOrderId:
      title: ByOrderId
      type: object
      properties:
        orderId:
          type: string
        type:
          type: string
          enum:
          - ByOrderId
      required:
      - type
      - orderId
      description: Lists the fills of one order.
    ListFillsGlobal:
      title: Global
      type: object
      properties:
        type:
          type: string
          enum:
          - Global
      required:
      - type
      description: Lists fills on every instrument.
    ListFillsQuery:
      type: object
      properties:
        accountId:
          type: string
        query:
          $ref: '#/components/schemas/ListFills'
        cursor:
          type:
          - string
          - 'null'
          description: 'nextCursor from the previous page; omit for the first page. Only valid with the same query: same variant,
            account and filters.'
      required:
      - accountId
      - query
      description: Lists the account's fills.
    ListOpenOrders:
      oneOf:
      - $ref: '#/components/schemas/ListOpenOrdersByInstrument'
      - $ref: '#/components/schemas/ListOpenOrdersGlobal'
      discriminator:
        propertyName: type
        mapping:
          ByInstrument: '#/components/schemas/ListOpenOrdersByInstrument'
          Global: '#/components/schemas/ListOpenOrdersGlobal'
      description: 'Which open orders to list: all, or one instrument.'
    ListOpenOrdersByInstrument:
      title: ByInstrument
      type: object
      properties:
        instrument:
          $ref: '#/components/schemas/Instrument'
        type:
          type: string
          enum:
          - ByInstrument
      required:
      - type
      - instrument
      description: Lists open orders on one instrument.
    ListOpenOrdersGlobal:
      title: Global
      type: object
      properties:
        type:
          type: string
          enum:
          - Global
      required:
      - type
      description: Lists open orders on every instrument.
    ListOpenOrdersQuery:
      type: object
      properties:
        accountId:
          type: string
        query:
          $ref: '#/components/schemas/ListOpenOrders'
        cursor:
          type:
          - string
          - 'null'
          description: 'nextCursor from the previous page; omit for the first page. Only valid with the same query: same variant,
            account and filters.'
      required:
      - accountId
      - query
      description: Lists the account's live orders.
    SubscribeToAccountOrdersRequest:
      type: object
      properties:
        accountId:
          type: string
          description: The account to stream.
      required:
      - accountId
      description: Streams one account's order changes.
    ListOpenPositionsQuery:
      type: object
      properties:
        accountId:
          type: string
        cursor:
          type:
          - string
          - 'null'
          description: 'nextCursor from the previous page; omit for the first page. Only valid with the same query: same variant,
            account and filters.'
      required:
      - accountId
      description: Lists the account's open derivative positions.
    ListWalletsQuery:
      type: object
      properties:
        accountId:
          type: string
        cursor:
          type:
          - string
          - 'null'
          description: 'nextCursor from the previous page; omit for the first page. Only valid with the same query: same variant,
            account and filters.'
      required:
      - accountId
      description: Lists the account's wallet balances.
    MarketSizing:
      oneOf:
      - $ref: '#/components/schemas/MarketSizingNotional'
      - $ref: '#/components/schemas/MarketSizingSize'
      discriminator:
        propertyName: type
        mapping:
          Notional: '#/components/schemas/MarketSizingNotional'
          Size: '#/components/schemas/MarketSizingSize'
      description: 'The amount of a market order: a size in native contracts, or a notional amount of the quote asset.'
    MarketSizingNotional:
      title: Notional
      type: object
      properties:
        notional:
          $ref: '#/components/schemas/Decimal'
          description: Amount of the quote asset.
        type:
          type: string
          enum:
          - Notional
      required:
      - type
      - notional
      description: Sizes the order by an amount of the quote asset to spend or receive.
    MarketSizingSize:
      title: Size
      type: object
      properties:
        size:
          $ref: '#/components/schemas/Decimal'
          description: Native contract units; see ContractDetails.
        type:
          type: string
          enum:
          - Size
      required:
      - type
      - size
      description: Sizes the order in native contracts.
    OrderNew:
      oneOf:
      - $ref: '#/components/schemas/OrderNewLimit'
      - $ref: '#/components/schemas/OrderNewMarket'
      - $ref: '#/components/schemas/OrderNewTriggerLimit'
      - $ref: '#/components/schemas/OrderNewTriggerMarket'
      discriminator:
        propertyName: type
        mapping:
          Limit: '#/components/schemas/OrderNewLimit'
          Market: '#/components/schemas/OrderNewMarket'
          TriggerLimit: '#/components/schemas/OrderNewTriggerLimit'
          TriggerMarket: '#/components/schemas/OrderNewTriggerMarket'
      description: A new order to submit. The type selects the order kind and its fields; check the market's orderTypes first.
    OrderNewLimit:
      title: Limit
      type: object
      properties:
        instrument:
          $ref: '#/components/schemas/Instrument'
        side:
          $ref: '#/components/schemas/OrderSide'
        size:
          $ref: '#/components/schemas/Decimal'
          description: Native contract units; see ContractDetails.
        price:
          $ref: '#/components/schemas/Decimal'
        reduceOnly:
          type: boolean
        tif:
          $ref: '#/components/schemas/LimitOrderTif'
        postOnly:
          type: boolean
          default: false
          description: Maker-only; defaults to false.
        clientOrderId:
          type:
          - string
          - 'null'
          description: Host-side correlation ID, accepted when submitOrder.clientOrderId is supported; null or omitted for
            none.
        positionEffect:
          anyOf:
          - $ref: '#/components/schemas/PositionEffect'
          - type: 'null'
          description: Open or Close, accepted when the market's supportsPositionEffect is true; null or omitted lets the
            host decide.
        type:
          type: string
          enum:
          - Limit
      required:
      - type
      - instrument
      - side
      - size
      - price
      - reduceOnly
      - tif
      description: 'A limit order: buy or sell size at price or better.'
    OrderNewMarket:
      title: Market
      type: object
      properties:
        instrument:
          $ref: '#/components/schemas/Instrument'
        side:
          $ref: '#/components/schemas/OrderSide'
        sizing:
          $ref: '#/components/schemas/MarketSizing'
        reduceOnly:
          type: boolean
        tif:
          $ref: '#/components/schemas/MarketOrderTif'
          default: IOC
          description: Defaults to IOC.
        clientOrderId:
          type:
          - string
          - 'null'
          description: Host-side correlation ID, accepted when submitOrder.clientOrderId is supported; null or omitted for
            none.
        positionEffect:
          anyOf:
          - $ref: '#/components/schemas/PositionEffect'
          - type: 'null'
          description: Open or Close, accepted when the market's supportsPositionEffect is true; null or omitted lets the
            host decide.
        type:
          type: string
          enum:
          - Market
      required:
      - type
      - instrument
      - side
      - sizing
      - reduceOnly
      description: 'A market order: buy or sell immediately at the best available prices.'
    OrderNewTriggerLimit:
      title: TriggerLimit
      type: object
      properties:
        instrument:
          $ref: '#/components/schemas/Instrument'
        side:
          $ref: '#/components/schemas/OrderSide'
        size:
          $ref: '#/components/schemas/Decimal'
          description: Native contract units; see ContractDetails.
        price:
          $ref: '#/components/schemas/Decimal'
        reduceOnly:
          type: boolean
        tif:
          $ref: '#/components/schemas/LimitOrderTif'
        postOnly:
          type: boolean
          default: false
          description: Maker-only; defaults to false.
        clientOrderId:
          type:
          - string
          - 'null'
          description: Host-side correlation ID, accepted when submitOrder.clientOrderId is supported; null or omitted for
            none.
        trigger:
          $ref: '#/components/schemas/Trigger'
        positionEffect:
          anyOf:
          - $ref: '#/components/schemas/PositionEffect'
          - type: 'null'
          description: Open or Close, accepted when the market's supportsPositionEffect is true; null or omitted lets the
            host decide.
        type:
          type: string
          enum:
          - TriggerLimit
      required:
      - type
      - instrument
      - side
      - size
      - price
      - reduceOnly
      - tif
      - trigger
      description: A limit order that is placed when its trigger condition is met.
    OrderNewTriggerMarket:
      title: TriggerMarket
      type: object
      properties:
        instrument:
          $ref: '#/components/schemas/Instrument'
        side:
          $ref: '#/components/schemas/OrderSide'
        sizing:
          $ref: '#/components/schemas/MarketSizing'
        reduceOnly:
          type: boolean
        tif:
          $ref: '#/components/schemas/MarketOrderTif'
          default: IOC
          description: Defaults to IOC.
        clientOrderId:
          type:
          - string
          - 'null'
          description: Host-side correlation ID, accepted when submitOrder.clientOrderId is supported; null or omitted for
            none.
        trigger:
          $ref: '#/components/schemas/Trigger'
        positionEffect:
          anyOf:
          - $ref: '#/components/schemas/PositionEffect'
          - type: 'null'
          description: Open or Close, accepted when the market's supportsPositionEffect is true; null or omitted lets the
            host decide.
        type:
          type: string
          enum:
          - TriggerMarket
      required:
      - type
      - instrument
      - side
      - sizing
      - reduceOnly
      - trigger
      description: A market order that is placed when its trigger condition is met.
    PaperFeeRates:
      type: object
      properties:
        makerFeePercent:
          $ref: '#/components/schemas/Decimal'
        takerFeePercent:
          $ref: '#/components/schemas/Decimal'
        fractionDigits:
          type:
          - integer
          - 'null'
          description: Decimal places fees are rounded to; null when fees are not rounded.
      required:
      - makerFeePercent
      - takerFeePercent
      - fractionDigits
      description: Maker and taker fee rates, as percentages of traded value, for paper fills.
    PaperFeeSettings:
      type: object
      properties:
        tiers:
          type: array
          items:
            $ref: '#/components/schemas/PaperFeeTier'
        selectedTier:
          type: integer
      required:
      - tiers
      - selectedTier
      description: A paper account's available fee tiers and the tier it uses.
    PaperFeeTier:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        defaults:
          $ref: '#/components/schemas/PaperFeeRates'
        instrumentOverrides:
          type: array
          items:
            $ref: '#/components/schemas/PaperInstrumentFeeRates'
      required:
      - id
      - name
      - defaults
      - instrumentOverrides
      description: 'A named paper fee tier: default rates, with overrides for matching instruments.'
    PaperInstrumentFeeRates:
      type: object
      properties:
        instrumentPattern:
          type: string
        rates:
          $ref: '#/components/schemas/PaperFeeRates'
      required:
      - instrumentPattern
      - rates
      description: Fee rates that replace a tier's defaults for instruments whose canonical symbol matches instrumentPattern,
        a regular expression.
    RenameAccountCommand:
      type: object
      properties:
        accountId:
          type: string
        name:
          type: string
      required:
      - accountId
      - name
      description: Renames an account.
    SetFeeTierCommand:
      type: object
      properties:
        accountId:
          type: string
        tier:
          type: integer
      required:
      - accountId
      - tier
      description: Selects a paper account's fee tier.
    SetMarketLeverageCommand:
      type: object
      properties:
        accountId:
          type: string
        instrument:
          $ref: '#/components/schemas/Instrument'
        leverage:
          $ref: '#/components/schemas/Decimal'
      required:
      - accountId
      - instrument
      - leverage
      description: Sets the account's leverage for a market.
    SetMarketPositionModeCommand:
      type: object
      properties:
        accountId:
          type: string
        instrument:
          $ref: '#/components/schemas/Instrument'
        mode:
          $ref: '#/components/schemas/PositionMode'
      required:
      - accountId
      - instrument
      - mode
      description: Sets the account's position mode for a market.
    SubmitOrderCommand:
      type: object
      properties:
        accountId:
          type: string
        order:
          $ref: '#/components/schemas/OrderNew'
      required:
      - accountId
      - order
      description: Submits a new order on the account.
    UpdateAccountConnectionCommand:
      type: object
      properties:
        accountId:
          type: string
        credential:
          $ref: '#/components/schemas/ExecutionAccountCredentialNew'
      required:
      - accountId
      - credential
      description: Replaces the API credentials of a connected exchange or broker account.
    VenueHeader:
      type: object
      properties:
        id:
          type: string
        capabilities:
          $ref: '#/components/schemas/VenueCapabilities'
      required:
      - id
      - capabilities
      description: A venue (an exchange or other liquidity source) and the market data it provides. Check capabilities before
        using optional reads.
    VenueMarketQuery:
      type: object
      properties:
        venueId:
          type: string
        base:
          type:
          - string
          - 'null'
          description: Exact base asset; null or omitted matches any.
        quote:
          type:
          - string
          - 'null'
          description: Exact quote asset; null or omitted matches any.
        types:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/InstrumentType'
          uniqueItems: true
          description: Match any listed InstrumentType; null or omitted matches every type.
          minItems: 1
        search:
          type:
          - string
          - 'null'
          description: Fuzzy, case-insensitive token matching on the canonical instrument symbol.
        cursor:
          type:
          - string
          - 'null'
          description: 'nextCursor from the previous page; omit for the first page. Only valid with the same query: same variant,
            account and filters.'
      required:
      - venueId
      description: Lists a venue's markets, optionally filtered by asset, instrument type or symbol search.
    VenueMarketSummary:
      type: object
      properties:
        symbol:
          $ref: '#/components/schemas/CanonicalInstrumentSymbol'
        instrument:
          $ref: '#/components/schemas/Instrument'
        increments:
          $ref: '#/components/schemas/MarketIncrements'
        contractDetails:
          $ref: '#/components/schemas/ContractDetails'
        marketData:
          $ref: '#/components/schemas/VenueMarketData'
      required:
      - symbol
      - instrument
      - increments
      - contractDetails
      - marketData
      description: Market data for a venue market. Order rules come from the host's market summary, never from here.
    MarketIncrements:
      type: object
      properties:
        price:
          $ref: '#/components/schemas/Decimal'
          description: Order book levels and trade prices sit on this grid, in quote per base. Display precision is its decimal
            scale; group book levels in whole multiples of it.
        size:
          $ref: '#/components/schemas/Decimal'
          description: Order book level sizes sit on this grid, in native contracts. Display precision is its decimal scale.
            Trade sizes may be finer (for example a fill of an order sized by notional).
      required:
      - price
      - size
      description: The grid a venue quotes market data on. Not order rules.
    VenueCapabilities:
      type: object
      properties:
        orderBook:
          $ref: '#/components/schemas/OrderBookCapabilities'
        trades:
          $ref: '#/components/schemas/TradesCapabilities'
        prices:
          $ref: '#/components/schemas/PricesCapabilities'
        bestQuote:
          $ref: '#/components/schemas/BestQuoteCapabilities'
        statistics:
          $ref: '#/components/schemas/MarketStatisticsCapabilities'
        indicativeFunding:
          $ref: '#/components/schemas/IndicativeFundingCapabilities'
        openInterest:
          $ref: '#/components/schemas/OpenInterestCapabilities'
        candles:
          $ref: '#/components/schemas/CandlesCapabilities'
      required:
      - orderBook
      - trades
      - prices
      - bestQuote
      - statistics
      - indicativeFunding
      - openInterest
      - candles
      description: Every market-data operation the venue offers, with its support. For PerMarket entries, each market's marketData
        says what that market supports.
    OrderBookCapabilities:
      type: object
      properties:
        getOrderBook:
          $ref: '#/components/schemas/Supported'
        subscribeToOrderBooks:
          $ref: '#/components/schemas/Supported'
      required:
      - getOrderBook
      - subscribeToOrderBooks
      description: GetOrderBook and the order book stream; supported on every venue.
    TradesCapabilities:
      type: object
      properties:
        getRecentTrades:
          $ref: '#/components/schemas/Supported'
        subscribeToTrades:
          $ref: '#/components/schemas/Supported'
      required:
      - getRecentTrades
      - subscribeToTrades
      description: GetRecentTrades and the trades stream; supported on every venue.
    PricesCapabilities:
      type: object
      properties:
        traded:
          $ref: '#/components/schemas/PriceCapabilities'
        mark:
          $ref: '#/components/schemas/PriceCapabilities'
        index:
          $ref: '#/components/schemas/PriceCapabilities'
      required:
      - traded
      - mark
      - index
      description: GetPrices support for each PriceKind.
    PriceCapabilities:
      type: object
      properties:
        getPrices:
          $ref: '#/components/schemas/OperationSupport'
        subscribeToPrices:
          $ref: '#/components/schemas/OperationSupport'
      required:
      - getPrices
      - subscribeToPrices
      description: Whether the venue serves GetPrices and SubscribeToPrices for this price kind.
    BestQuoteCapabilities:
      type: object
      properties:
        getBestQuotes:
          $ref: '#/components/schemas/OperationSupport'
        subscribeToBestQuotes:
          $ref: '#/components/schemas/OperationSupport'
      required:
      - getBestQuotes
      - subscribeToBestQuotes
      description: Whether the venue serves GetBestQuotes and SubscribeToBestQuotes.
    MarketStatisticsCapabilities:
      type: object
      properties:
        getMarketStatistics:
          $ref: '#/components/schemas/OperationSupport'
        subscribeToMarketStatistics:
          $ref: '#/components/schemas/OperationSupport'
      required:
      - getMarketStatistics
      - subscribeToMarketStatistics
      description: Whether the venue serves GetMarketStatistics and SubscribeToMarketStatistics.
    IndicativeFundingCapabilities:
      type: object
      properties:
        getIndicativeFundings:
          $ref: '#/components/schemas/OperationSupport'
        subscribeToIndicativeFundings:
          $ref: '#/components/schemas/OperationSupport'
      required:
      - getIndicativeFundings
      - subscribeToIndicativeFundings
      description: Whether the venue serves GetIndicativeFundings and SubscribeToIndicativeFundings.
    OpenInterestCapabilities:
      type: object
      properties:
        getOpenInterests:
          $ref: '#/components/schemas/OperationSupport'
        subscribeToOpenInterests:
          $ref: '#/components/schemas/OperationSupport'
      required:
      - getOpenInterests
      - subscribeToOpenInterests
      description: Whether the venue serves GetOpenInterests and SubscribeToOpenInterests.
    CandlesCapabilities:
      type: object
      properties:
        listCandles:
          $ref: '#/components/schemas/ListCandlesCapabilities'
        subscribeToCandles:
          $ref: '#/components/schemas/OperationSupport'
      required:
      - listCandles
      - subscribeToCandles
      description: Whether the venue serves ListCandles, and which variants, and SubscribeToCandles.
    ListCandlesCapabilities:
      type: object
      properties:
        byInstrument:
          $ref: '#/components/schemas/CursorQueryCapability'
        byInstrumentBefore:
          $ref: '#/components/schemas/CursorQueryCapability'
      required:
      - byInstrument
      - byInstrumentBefore
      description: ListCandles variants. Candles are always ReverseChronological.
    VenueMarketData:
      type: object
      properties:
        prices:
          $ref: '#/components/schemas/PricesSpec'
        bestQuote:
          anyOf:
          - $ref: '#/components/schemas/BestQuoteSpec'
          - type: 'null'
          description: Null when the market has no best quote.
        statistics:
          anyOf:
          - $ref: '#/components/schemas/StatisticsSpec'
          - type: 'null'
          description: Null when the market has no statistics.
        indicativeFunding:
          anyOf:
          - $ref: '#/components/schemas/IndicativeFundingSpec'
          - type: 'null'
          description: Null unless the market is a perpetual with indicative funding.
        openInterest:
          anyOf:
          - $ref: '#/components/schemas/OpenInterestSpec'
          - type: 'null'
          description: Null unless the market is a derivative with open interest.
        candles:
          $ref: '#/components/schemas/CandlesSpec'
      required:
      - prices
      - bestQuote
      - statistics
      - indicativeFunding
      - openInterest
      - candles
      description: Which market-data reads this market supports, and on what terms.
    PricesSpec:
      type: object
      properties:
        traded:
          anyOf:
          - $ref: '#/components/schemas/PriceSpec'
          - type: 'null'
          description: Null when the market does not report traded prices.
        mark:
          anyOf:
          - $ref: '#/components/schemas/PriceSpec'
          - type: 'null'
          description: Null when the market does not report mark prices.
        index:
          anyOf:
          - $ref: '#/components/schemas/PriceSpec'
          - type: 'null'
          description: Null when the market does not report index prices.
      required:
      - traded
      - mark
      - index
      description: Price kinds this market reports.
    PriceSpec:
      type: object
      properties:
        get:
          type: boolean
          description: GetPrices for this kind on this market.
        subscribe:
          type: boolean
          description: SubscribeToPrices for this kind on this market.
      required:
      - get
      - subscribe
      description: How this market supports one price kind.
    BestQuoteSpec:
      type: object
      properties:
        supportsSizes:
          type: boolean
          description: Whether quote levels carry sizes.
        get:
          type: boolean
          description: GetBestQuotes on this market.
        subscribe:
          type: boolean
          description: SubscribeToBestQuotes on this market.
      required:
      - supportsSizes
      - get
      - subscribe
      description: How this market supports best bid and ask reads.
    StatisticsSpec:
      type: object
      properties:
        window:
          $ref: '#/components/schemas/StatisticsWindow'
        supportedFields:
          type: array
          items:
            $ref: '#/components/schemas/StatisticsField'
          uniqueItems: true
          minItems: 1
          description: Fields the venue reports; others are always null.
        get:
          type: boolean
          description: GetMarketStatistics on this market.
        subscribe:
          type: boolean
          description: SubscribeToMarketStatistics on this market.
      required:
      - window
      - supportedFields
      - get
      - subscribe
      description: 'How this market supports statistics reads: the window and the fields the venue reports.'
    IndicativeFundingSpec:
      type: object
      properties:
        get:
          type: boolean
          description: GetIndicativeFundings on this market.
        subscribe:
          type: boolean
          description: SubscribeToIndicativeFundings on this market.
      required:
      - get
      - subscribe
      description: How this market supports indicative funding reads.
    OpenInterestSpec:
      type: object
      properties:
        unit:
          $ref: '#/components/schemas/OpenInterestUnit'
        get:
          type: boolean
          description: GetOpenInterests on this market.
        subscribe:
          type: boolean
          description: SubscribeToOpenInterests on this market.
      required:
      - unit
      - get
      - subscribe
      description: How this market supports open interest reads, and the unit they are reported in.
    CandlesSpec:
      type: object
      properties:
        traded:
          anyOf:
          - $ref: '#/components/schemas/CandleSeriesSpec'
          - type: 'null'
          description: Null when the market has no traded candles.
        mark:
          anyOf:
          - $ref: '#/components/schemas/CandleSeriesSpec'
          - type: 'null'
          description: Null when the market has no mark candles.
        index:
          anyOf:
          - $ref: '#/components/schemas/CandleSeriesSpec'
          - type: 'null'
          description: Null when the market has no index candles.
      required:
      - traded
      - mark
      - index
      description: Candle series per PriceKind.
    CandleSeriesSpec:
      type: object
      properties:
        supportedIntervals:
          type: array
          items:
            $ref: '#/components/schemas/CandleInterval'
          uniqueItems: true
          minItems: 1
          description: Every interval is available to each supported variant.
        maxHistoryAgeByInterval:
          type: object
          propertyNames:
            $ref: '#/components/schemas/CandleInterval'
          additionalProperties:
            type: string
            format: duration
          description: ISO 8601 age limit of reachable history per interval; an interval without an entry has no declared
            limit.
        list:
          type: boolean
          description: ListCandles.ByInstrument for this series.
        listBefore:
          type: boolean
          description: ListCandles.ByInstrumentBefore, and continuing past the first page.
        subscribe:
          type: boolean
          description: SubscribeToCandles for this series, at every supported interval.
      required:
      - supportedIntervals
      - maxHistoryAgeByInterval
      - list
      - listBefore
      - subscribe
      description: One price kind's candles on one market. At least one of list and listBefore is true.
    PriceKind:
      type: string
      enum:
      - Traded
      - Mark
      - Index
      description: What the venue reports a price to be. Kinds are never relabelled or derived from one another.
    CandleInterval:
      type: string
      enum:
      - Minute1
      - Minute3
      - Minute5
      - Minute15
      - Minute30
      - Hour1
      - Hour2
      - Hour4
      - Hour6
      - Hour12
      - Day1
      description: Candle length. Candles are aligned to whole multiples of it from the Unix epoch, in UTC.
    StatisticsWindow:
      oneOf:
      - $ref: '#/components/schemas/StatisticsWindowRolling'
      - $ref: '#/components/schemas/StatisticsWindowCalendarDay'
      discriminator:
        propertyName: type
        mapping:
          Rolling: '#/components/schemas/StatisticsWindowRolling'
          CalendarDay: '#/components/schemas/StatisticsWindowCalendarDay'
      description: The window the venue computes statistics over. Two venues' windows need not mean the same.
    StatisticsWindowRolling:
      title: Rolling
      type: object
      properties:
        type:
          type: string
          enum:
          - Rolling
        length:
          type: string
          format: duration
          description: ISO 8601 duration, e.g. PT24H.
      required:
      - type
      - length
      description: A window of this length ending now.
    StatisticsWindowCalendarDay:
      title: CalendarDay
      type: object
      properties:
        type:
          type: string
          enum:
          - CalendarDay
        timeZone:
          type: string
          description: IANA time zone.
      required:
      - type
      - timeZone
      description: The current calendar day in the venue's time zone.
    StatisticsField:
      type: string
      enum:
      - Open
      - High
      - Low
      - PreviousClose
      - VolumeBase
      - VolumeQuote
      description: A market statistic the venue can report, such as open, high, low, previous close and traded volume.
    OpenInterestUnit:
      type: string
      enum:
      - Contracts
      - BaseAsset
      - QuoteAsset
      description: 'The unit open interest is reported in: native contracts, the base asset or the quote asset.'
    GetOrderBookQuery:
      type: object
      properties:
        venueId:
          type: string
        instrument:
          $ref: '#/components/schemas/Instrument'
      required:
      - venueId
      - instrument
      description: Gets the order book of one market on a venue.
    OrderBook:
      type: object
      properties:
        instrument:
          $ref: '#/components/schemas/Instrument'
        bids:
          type: array
          items:
            $ref: '#/components/schemas/OrderBookLevel'
          description: Best (highest) price first.
        asks:
          type: array
          items:
            $ref: '#/components/schemas/OrderBookLevel'
          description: Best (lowest) price first.
        asOf:
          type: string
          format: date-time
          description: The time the book is current as of. From a live feed this can be the read time, even when the last
            change arrived earlier.
      required:
      - instrument
      - bids
      - asks
      - asOf
      description: The bids and asks of one market at asOf, best price first.
    OrderBookLevel:
      type: object
      properties:
        price:
          $ref: '#/components/schemas/Decimal'
        size:
          $ref: '#/components/schemas/Decimal'
          description: Native contract units.
      required:
      - price
      - size
      description: 'One price level of an order book: a price and the total size resting there.'
    OrderBookLevels:
      type: object
      properties:
        bids:
          type: array
          items:
            $ref: '#/components/schemas/OrderBookLevel'
          description: Best (highest) price first.
        asks:
          type: array
          items:
            $ref: '#/components/schemas/OrderBookLevel'
          description: Best (lowest) price first.
        observedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Venue time of these levels; null when the venue does not report it.
        receivedAt:
          type: string
          format: date-time
          description: When Plurex received these levels.
      required:
      - bids
      - asks
      - observedAt
      - receivedAt
      description: Order book levels on the order book stream. In a Reset they are the whole book, best price first; in an
        Update only the levels that changed, each with its new total size, where size 0 removes the level.
    GetRecentTradesQuery:
      type: object
      properties:
        venueId:
          type: string
        instrument:
          $ref: '#/components/schemas/Instrument'
      required:
      - venueId
      - instrument
      description: Gets the most recent public trades of one market on a venue.
    SubscribeToOrderBooksRequest:
      type: object
      properties:
        venueId:
          type: string
        instrument:
          $ref: '#/components/schemas/Instrument'
      required:
      - venueId
      - instrument
      description: Streams one market's order book on a venue.
    SubscribeToTradesRequest:
      type: object
      properties:
        venueId:
          type: string
        instrument:
          $ref: '#/components/schemas/Instrument'
      required:
      - venueId
      - instrument
      description: Streams one market's public trades on a venue.
    SubscribeToPricesRequest:
      type: object
      properties:
        venueId:
          type: string
        kind:
          $ref: '#/components/schemas/PriceKind'
        instrument:
          $ref: '#/components/schemas/Instrument'
      required:
      - venueId
      - kind
      - instrument
      description: Streams one market's price on a venue.
    SubscribeToBestQuotesRequest:
      type: object
      properties:
        venueId:
          type: string
        instrument:
          $ref: '#/components/schemas/Instrument'
      required:
      - venueId
      - instrument
      description: Streams one market's best bid and ask on a venue.
    SubscribeToMarketStatisticsRequest:
      type: object
      properties:
        venueId:
          type: string
        instrument:
          $ref: '#/components/schemas/Instrument'
      required:
      - venueId
      - instrument
      description: Streams one market's statistics on a venue.
    SubscribeToIndicativeFundingsRequest:
      type: object
      properties:
        venueId:
          type: string
        instrument:
          $ref: '#/components/schemas/Instrument'
      required:
      - venueId
      - instrument
      description: Streams one market's indicative funding on a venue.
    SubscribeToOpenInterestsRequest:
      type: object
      properties:
        venueId:
          type: string
        instrument:
          $ref: '#/components/schemas/Instrument'
      required:
      - venueId
      - instrument
      description: Streams one market's open interest on a venue.
    SubscribeToCandlesRequest:
      type: object
      properties:
        venueId:
          type: string
        priceKind:
          $ref: '#/components/schemas/PriceKind'
        interval:
          $ref: '#/components/schemas/CandleInterval'
        instrument:
          $ref: '#/components/schemas/Instrument'
      required:
      - venueId
      - priceKind
      - interval
      - instrument
      description: Streams one market's candles of one price kind at one interval on a venue.
    RecentTrades:
      type: object
      properties:
        instrument:
          $ref: '#/components/schemas/Instrument'
        trades:
          type: array
          items:
            $ref: '#/components/schemas/PublicTrade'
          description: Oldest first.
        asOf:
          type: string
          format: date-time
          description: The time the list is current as of.
      required:
      - instrument
      - trades
      - asOf
      description: The most recent public trades of one market, oldest first.
    PublicTrade:
      type: object
      properties:
        price:
          $ref: '#/components/schemas/Decimal'
        size:
          $ref: '#/components/schemas/Decimal'
          description: Native contract units.
        takerSide:
          anyOf:
          - $ref: '#/components/schemas/OrderSide'
          - type: 'null'
          description: The aggressor's side; null when the venue does not report it.
        observedAt:
          type: string
          format: date-time
          description: Venue time of the trade.
        receivedAt:
          type: string
          format: date-time
          description: When Plurex received the trade.
      required:
      - price
      - size
      - takerSide
      - observedAt
      - receivedAt
      description: A public trade print. Trades carry no identity.
    PublicTrades:
      type: object
      properties:
        trades:
          type: array
          items:
            $ref: '#/components/schemas/PublicTrade'
          description: Oldest first.
      required:
      - trades
      description: Public trades on the trades stream. In a Reset they are the recent trades, which can include trades an
        earlier Update already delivered; in an Update they are new trades.
    GetPricesQuery:
      type: object
      properties:
        venueId:
          type: string
        kind:
