      - byInstrument
      - byInstrumentBefore
      description: ListCandles variants. Candles are always ReverseChronological.
    VenueMarketData:
      type: object
      properties:
        prices:
          $ref: '#/components/schemas/PricesSpec'
        bestQuote:
          anyOf:
          - $ref: '#/components/schemas/BestQuoteSpec'
          - type: 'null'
          description: Null when the market has no best quote.
        statistics:
          anyOf:
          - $ref: '#/components/schemas/StatisticsSpec'
          - type: 'null'
          description: Null when the market has no statistics.
        indicativeFunding:
          anyOf:
          - $ref: '#/components/schemas/IndicativeFundingSpec'
          - type: 'null'
          description: Null unless the market is a perpetual with indicative funding.
        openInterest:
          anyOf:
          - $ref: '#/components/schemas/OpenInterestSpec'
          - type: 'null'
          description: Null unless the market is a derivative with open interest.
        candles:
          $ref: '#/components/schemas/CandlesSpec'
      required:
      - prices
      - bestQuote
      - statistics
      - indicativeFunding
      - openInterest
      - candles
      description: Which market-data reads this market supports, and on what terms.
    PricesSpec:
      type: object
      properties:
        traded:
          anyOf:
          - $ref: '#/components/schemas/PriceSpec'
          - type: 'null'
          description: Null when the market does not report traded prices.
        mark:
          anyOf:
          - $ref: '#/components/schemas/PriceSpec'
          - type: 'null'
          description: Null when the market does not report mark prices.
        index:
          anyOf:
          - $ref: '#/components/schemas/PriceSpec'
          - type: 'null'
          description: Null when the market does not report index prices.
      required:
      - traded
      - mark
      - index
      description: Price kinds this market reports.
    PriceSpec:
      type: object
      properties:
        get:
          type: boolean
          description: GetPrices for this kind on this market.
      required:
      - get
    BestQuoteSpec:
      type: object
      properties:
        supportsSizes:
          type: boolean
          description: Whether quote levels carry sizes.
        get:
          type: boolean
          description: GetBestQuotes on this market.
      required:
      - supportsSizes
      - get
    StatisticsSpec:
      type: object
