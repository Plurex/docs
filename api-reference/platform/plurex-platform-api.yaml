components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-KEY
    ApiSecretAuth:
      type: apiKey
      in: header
      name: X-API-SECRET
  schemas:
    # --- Base ---

    BaseResponse:
      type: object
      required:
        - traceId
        - serverTime
      properties:
        traceId:
          type: string
          format: uuid
          description: Unique identifier for tracing.
        serverTime:
          type: string
          format: date-time
          description: RFC3339 timestamp of processing.
        warnings:
          type: array
          items:
            type: string

    BaseSuccessResponseEnvelope:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          required:
            - data
          properties:
            data:
              type: object
              description: The actual payload of the successful response.

    BaseSuccessPageResponseEnvelope:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                type: object
            nextCursor:
              type: string
              nullable: true
              description: Use this value in the next request to fetch the following page.

    BaseErrorResponseEnvelope:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          required:
            - code
            - error
          properties:
            code:
              type: string
              description: Machine-readable code (e.g., INSUFFICIENT_FUNDS).
            message:
              type: string
              description: Optional human-readable description.
            error:
              type: object
              description: A flexible object for domain-specific error details.
            retryable:
              type: boolean
              default: false

    BasePageQuery:
      type: object
      properties:
        cursor:
          type: string
          nullable: true

    BaseCommand:
      type: object
      required:
        - clientRequestId
      properties:
        clientRequestId:
          type: string
          description: Client-generated nonce for idempotency. Recommended to be unique per tenant scope.

    # --- Common ---
    # Use the 'Common' prefix for any component schemas that span multiple domains (e.g., Venues and Hosts).

    MoneyValue:
      type: string
      description: String-encoded BigDecimal for high precision monetary values.

    Wallet:
      type: object
      properties:
        id:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        asset:
          type: string
        totalBalance:
          $ref: '#/components/schemas/MoneyValue'
        availableBalance:
          $ref: '#/components/schemas/MoneyValue'

    Instrument:
      type: object
      properties:
        base:
          type: string
        quote:
          type: string
        marketType:
          type: string

    MarketAsset:
      type: string
      enum:
        - Base
        - Quote
      description: Market asset (Base or Quote).

    OrderLimitTif:
      type: string
      enum:
        - GTC
        - FOK
      description: Time-in-force policy for limit orders.

    OrderSide:
      type: string
      enum:
        - Buy
        - Sell
      description: Market side (Buy or Sell).

    OrderState:
      type: string
      enum:
        - Complete
        - Pending

    TradeRole:
      type: string
      enum:
        - Maker
        - Taker

    Fee:
      type: object
      required:
        - asset
        - amount
      properties:
        asset:
          type: string
        amount:
          $ref: '#/components/schemas/MoneyValue'

    OrderMatch:
      type: object
      required:
        - timestamp
        - price
        - size
        - fee
      properties:
        timestamp:
          type: string
          format: date-time
        price:
          $ref: '#/components/schemas/MoneyValue'
        size:
          $ref: '#/components/schemas/MoneyValue'
        fee:
          $ref: '#/components/schemas/Fee'
        id:
          type: string
          nullable: true
        role:
          $ref: '#/components/schemas/TradeRole'
          nullable: true

    OrderTraded:
      type: object
      required:
        - type
        - baseTraded
        - quoteTraded
        - totalFees
      properties:
        type:
          type: string
          description: The discriminator for order traded types.
        baseTraded:
          $ref: '#/components/schemas/MoneyValue'
        quoteTraded:
          $ref: '#/components/schemas/MoneyValue'
        totalFees:
          type: array
          items:
            $ref: '#/components/schemas/Fee'
      discriminator:
        propertyName: type
        mapping:
          Batched: '#/components/schemas/OrderTradedBatched'
          Detailed: '#/components/schemas/OrderTradedDetailed'
      oneOf:
        - $ref: '#/components/schemas/OrderTradedBatched'
        - $ref: '#/components/schemas/OrderTradedDetailed'

    OrderTradedBatched:
      type: object
      required:
        - type
        - baseTraded
        - quoteTraded
        - totalFees
      properties:
        type:
          type: string
          enum: [Batched]
        baseTraded:
          $ref: '#/components/schemas/MoneyValue'
        quoteTraded:
          $ref: '#/components/schemas/MoneyValue'
        totalFees:
          type: array
          items:
            $ref: '#/components/schemas/Fee'
        lastUpdated:
          type: string
          format: date-time
          nullable: true

    OrderTradedDetailed:
      type: object
      required:
        - type
        - baseTraded
        - quoteTraded
        - totalFees
        - trades
      properties:
        type:
          type: string
          enum: [Detailed]
        baseTraded:
          $ref: '#/components/schemas/MoneyValue'
        quoteTraded:
          $ref: '#/components/schemas/MoneyValue'
        totalFees:
          type: array
          items:
            $ref: '#/components/schemas/Fee'
        trades:
          type: array
          items:
            $ref: '#/components/schemas/OrderMatch'

    Order:
      type: object
      required:
        - type
        - id
        - createdTimestamp
        - side
        - instrument
        - state
        - traded
      properties:
        type:
          type: string
          description: The discriminator for order types.
        id:
          type: string
        createdTimestamp:
          type: string
          format: date-time
        side:
          $ref: '#/components/schemas/OrderSide'
        instrument:
          $ref: '#/components/schemas/Instrument'
        state:
          $ref: '#/components/schemas/OrderState'
        traded:
          $ref: '#/components/schemas/OrderTraded'
      discriminator:
        propertyName: type
        mapping:
          Limit: '#/components/schemas/OrderLimit'
          TriggerLimit: '#/components/schemas/OrderTriggerLimit'
          Market: '#/components/schemas/OrderMarket'
          TriggerMarket: '#/components/schemas/OrderTriggerMarket'
      oneOf:
        - $ref: '#/components/schemas/OrderLimit'
        - $ref: '#/components/schemas/OrderTriggerLimit'
        - $ref: '#/components/schemas/OrderMarket'
        - $ref: '#/components/schemas/OrderTriggerMarket'

    OrderLimit:
      type: object
      required:
        - type
        - id
        - createdTimestamp
        - side
        - instrument
        - state
        - traded
        - size
        - price
      properties:
        type:
          type: string
          enum: [Limit]
        id: { type: string }
        createdTimestamp: { type: string, format: date-time }
        side: { $ref: '#/components/schemas/OrderSide' }
        instrument: { $ref: '#/components/schemas/Instrument' }
        state: { $ref: '#/components/schemas/OrderState' }
        traded: { $ref: '#/components/schemas/OrderTraded' }
