      type: object
      properties:
        instrument:
          $ref: '#/components/schemas/Instrument'
        bids:
          type: array
          items:
            $ref: '#/components/schemas/OrderBookLevel'
          description: Best (highest) price first.
        asks:
          type: array
          items:
            $ref: '#/components/schemas/OrderBookLevel'
          description: Best (lowest) price first.
        asOf:
          type: string
          format: date-time
          description: The time the book is current as of. From a live feed this can be the read time, even when the last
            change arrived earlier.
      required:
      - instrument
      - bids
      - asks
      - asOf
    OrderBookLevel:
      type: object
