components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-KEY
    ApiSecret:
      type: apiKey
      in: header
      name: X-API-SECRET
  responses:
    BadRequest:
      description: 400 BadRequest; code is InvalidRequest.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            InvalidRequest:
              summary: The body is malformed, has unknown fields or wrong types, or a value is invalid
              value:
                code: InvalidRequest
                message: Invalid cursor
    Unauthenticated:
      description: 401 Unauthenticated; code is Unauthenticated.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            Unauthenticated:
              summary: The API key headers are missing or invalid
              value:
                code: Unauthenticated
                message: Unauthorized
    Forbidden:
      description: 403 Forbidden; code is Forbidden.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            Forbidden:
              summary: The key cannot access this account or operation
              value:
                code: Forbidden
                message: Forbidden
    NotFound:
      description: 404 NotFound; code is AccountNotFound, OrderNotFound or NotFound.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            AccountNotFound:
              summary: The accountId does not exist
              value:
                code: AccountNotFound
                message: 'Account not found: acc_123'
            OrderNotFound:
              summary: The account exists, but the order identifier does not
              value:
                code: OrderNotFound
                message: 'Order not found: ord_456'
            NotFound:
              summary: Unknown path, host or venue
              value:
                code: NotFound
                message: Not Found
    Conflict:
      description: 409 Conflict; code is DuplicateClientOrderId or OrderAlreadyClosed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            DuplicateClientOrderId:
              summary: The host holds another order with this clientOrderId
              value:
                code: DuplicateClientOrderId
                message: Client order ID already exists
            OrderAlreadyClosed:
              summary: The order is already filled, cancelled or rejected
              value:
                code: OrderAlreadyClosed
                message: Order is already closed
    Rejected:
      description: 422 Rejected; code is InsufficientFunds, InvalidProviderCredentials, ProviderAccessDenied, AccountLimit,
        NotSupported or Rejected.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            InsufficientFunds:
              summary: The account cannot fund the order or withdrawal
              value:
                code: InsufficientFunds
                message: Insufficient Funds
            InvalidProviderCredentials:
              summary: The provider did not accept the credentials
              value:
                code: InvalidProviderCredentials
                message: API key is invalid
            ProviderAccessDenied:
              summary: The provider accepted the credentials, but they lack the access needed
              value:
                code: ProviderAccessDenied
                message: The credentials do not grant the access this account needs
            AccountLimit:
              summary: An account or subscription limit was reached
              value:
                code: AccountLimit
                message: Subscription limit reached
            NotSupported:
              summary: The host does not support this operation, variant or instrument
              value:
                code: NotSupported
                message: Unprocessable Entity
            Rejected:
              summary: The host or validation rejected the command
              value:
                code: Rejected
                message: Order price is not a multiple of the price increment
    RateLimited:
      description: 429 RateLimited; code is RateLimited.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            RateLimited:
              summary: The provider rate limited the request
              value:
                code: RateLimited
                message: Provider rate limited
    UnexpectedError:
      description: 500 UnexpectedError; code is UnexpectedError.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            UnexpectedError:
              summary: Unexpected server failure
              value:
                code: UnexpectedError
                message: Internal Server Error
    UpstreamFailure:
      description: 502 UpstreamFailure; code is UpstreamFailure or CancelAllFailed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            UpstreamFailure:
              summary: The host or venue failed or returned something unreadable
              value:
                code: UpstreamFailure
                message: Bad Gateway
            CancelAllFailed:
              summary: At least one sub-cancel failed; reconcile with ListOpenOrders
              value:
                code: CancelAllFailed
                message: Bad Gateway
    Unavailable:
      description: 503 Unavailable; code is Unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            Unavailable:
              summary: The service or provider is temporarily unavailable
              value:
                code: Unavailable
                message: Service Unavailable
    UpstreamTimeout:
      description: 504 UpstreamTimeout; code is UpstreamTimeout.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            UpstreamTimeout:
              summary: The provider did not respond in time
              value:
                code: UpstreamTimeout
                message: Gateway Timeout
    UnsupportedMediaType:
      description: 415 UnsupportedMediaType; code is UnsupportedMediaType.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            UnsupportedMediaType:
              summary: The request is not Content-Type application/json
              value:
                code: UnsupportedMediaType
                message: Content type text/plain is not supported
  schemas:
    AccountCredentialPublic:
      type: object
      properties:
        publicValue:
          type:
          - string
          - 'null'
          description: The non-secret part of the credential, such as the API key; null when the credential type has none.
        credentialType:
          $ref: '#/components/schemas/HostCredentialType'
      required:
      - publicValue
      - credentialType
      description: The non-secret view of an account's credential. Secrets are never returned.
    HostCredentialType:
      type: string
      enum:
      - ApiKey
      - Paper
      description: 'How an account authenticates with its host: ApiKey for a connected account, Paper for a paper account.'
    AccountHeader:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
          description: The tenant that owns the account.
        hostId:
          type: string
        isPaper:
          type: boolean
        name:
          type: string
        credential:
          $ref: '#/components/schemas/AccountCredentialPublic'
      required:
      - id
      - tenantId
      - hostId
      - isPaper
      - name
      - credential
      description: A trading account on one host.
    AccountMarginState:
      type: object
      properties:
        baseCollateralAsset:
          type: string
        totalCollateralValue:
          $ref: '#/components/schemas/Decimal'
        totalInitialMargin:
          $ref: '#/components/schemas/Decimal'
        totalMaintenanceMargin:
          $ref: '#/components/schemas/Decimal'
        accountMarginRatio:
          anyOf:
          - $ref: '#/components/schemas/Decimal'
          - type: 'null'
          description: Null when the host does not report it.
      required:
      - baseCollateralAsset
      - totalCollateralValue
      - totalInitialMargin
      - totalMaintenanceMargin
      - accountMarginRatio
      description: The account's margin totals for one margin group, in its base collateral asset.
    AccountMarketState:
      oneOf:
      - $ref: '#/components/schemas/AccountMarketStateDerivative'
      - $ref: '#/components/schemas/AccountMarketStateSpot'
      - $ref: '#/components/schemas/AccountMarketStateSpotMargin'
      discriminator:
        propertyName: type
        mapping:
          Derivative: '#/components/schemas/AccountMarketStateDerivative'
          Spot: '#/components/schemas/AccountMarketStateSpot'
          SpotMargin: '#/components/schemas/AccountMarketStateSpotMargin'
      description: The account's state in one market, shaped by the kind of market.
    AccountMarketStateDerivative:
      title: Derivative
      type: object
      properties:
        instrument:
          $ref: '#/components/schemas/Instrument'
        currentLeverageSetting:
          anyOf:
          - $ref: '#/components/schemas/MarketLeverageSetting'
          - type: 'null'
          description: The account's current leverage; null when the market has no leverage.
        collateral:
          $ref: '#/components/schemas/MarketCollateral'
        position:
          $ref: '#/components/schemas/MarketPosition'
        type:
          type: string
          enum:
          - Derivative
      required:
      - type
      - instrument
      - currentLeverageSetting
      - collateral
      - position
      description: The account's state in a derivative market (perpetual, future or option).
    CanonicalInstrumentSymbol:
      type: string
      readOnly: true
      pattern: ^[A-Z0-9.]{1,32}-[A-Z0-9.]{1,32}-(?:SPOT|PERP|PERPINV|FUT_[0-9]{8}|FUTINV_[0-9]{8}|OPT_[0-9]{8}_(?:0|[1-9][0-9]*)(?:\.[0-9]*[1-9])?_(?:CALL|PUT))$
      description: 'Canonical BASE-QUOTE-TYPE symbol of an instrument, independent of venue naming. It is base, "-", quote,
        "-", then the type token: Spot -> SPOT, Perp -> PERP, PerpInv -> PERPINV, Future -> FUT_YYYYMMDD, FutureInv -> FUTINV_YYYYMMDD,
        Option -> OPT_YYYYMMDD_STRIKE_RIGHT, where YYYYMMDD is the expiry without dashes, STRIKE is the strike as given and
        RIGHT is CALL or PUT, such as BTC-USD-OPT_20300329_50000_CALL. Never an input field.'
    Instrument:
      oneOf:
      - $ref: '#/components/schemas/InstrumentFuture'
      - $ref: '#/components/schemas/InstrumentFutureInv'
      - $ref: '#/components/schemas/InstrumentOption'
      - $ref: '#/components/schemas/InstrumentPerp'
      - $ref: '#/components/schemas/InstrumentPerpInv'
      - $ref: '#/components/schemas/InstrumentSpot'
      discriminator:
        propertyName: type
        mapping:
          Future: '#/components/schemas/InstrumentFuture'
          FutureInv: '#/components/schemas/InstrumentFutureInv'
          Option: '#/components/schemas/InstrumentOption'
          Perp: '#/components/schemas/InstrumentPerp'
          PerpInv: '#/components/schemas/InstrumentPerpInv'
          Spot: '#/components/schemas/InstrumentSpot'
      description: An instrument, identified by its fields rather than a venue symbol.
    InstrumentFuture:
      title: Future
      type: object
      properties:
        base:
          type: string
          pattern: ^[A-Z0-9.]{1,32}$
        quote:
          type: string
          pattern: ^[A-Z0-9.]{1,32}$
        expiry:
          type: string
          format: date
          description: Contract expiry date (YYYY-MM-DD).
        type:
          type: string
          enum:
          - Future
      required:
      - type
      - base
      - quote
      - expiry
      description: A linear dated future, quoted and settled in the quote asset.
    InstrumentFutureInv:
      title: FutureInv
      type: object
      properties:
        base:
          type: string
          pattern: ^[A-Z0-9.]{1,32}$
        quote:
          type: string
          pattern: ^[A-Z0-9.]{1,32}$
        expiry:
          type: string
          format: date
          description: Contract expiry date (YYYY-MM-DD).
        type:
          type: string
          enum:
          - FutureInv
      required:
      - type
      - base
      - quote
      - expiry
      description: An inverse dated future, quoted in the quote asset and settled in the base asset.
    InstrumentOption:
      title: Option
      type: object
      properties:
        base:
          type: string
          pattern: ^[A-Z0-9.]{1,32}$
        quote:
          type: string
          pattern: ^[A-Z0-9.]{1,32}$
        expiry:
          type: string
          format: date
          description: Contract expiry date (YYYY-MM-DD).
        strike:
          type: string
          pattern: ^(?:0|[1-9][0-9]*)(?:\.[0-9]*[1-9])?$
          description: Positive strike price in the quote asset, as a plain decimal with no exponent or trailing fractional
            zeros (50000, not 50000.0 or 5E4).
        right:
          $ref: '#/components/schemas/OptionRight'
        type:
          type: string
          enum:
          - Option
      required:
      - type
      - base
      - quote
      - expiry
      - strike
      - right
      description: An option contract. Options are not listed or tradable; they appear only in account activity a host reports.
    OptionRight:
      type: string
      enum:
      - Call
      - Put
      description: Whether an option gives the right to buy (Call) or to sell (Put) the underlying at the strike.
    InstrumentPerp:
      title: Perp
      type: object
      properties:
        base:
          type: string
          pattern: ^[A-Z0-9.]{1,32}$
        quote:
          type: string
          pattern: ^[A-Z0-9.]{1,32}$
        type:
          type: string
          enum:
          - Perp
      required:
      - type
      - base
      - quote
      description: A linear perpetual swap, quoted and settled in the quote asset.
    InstrumentPerpInv:
      title: PerpInv
      type: object
      properties:
        base:
          type: string
          pattern: ^[A-Z0-9.]{1,32}$
        quote:
          type: string
          pattern: ^[A-Z0-9.]{1,32}$
        type:
          type: string
          enum:
          - PerpInv
      required:
      - type
      - base
      - quote
      description: An inverse perpetual swap, quoted in the quote asset and settled in the base asset.
    InstrumentSpot:
      title: Spot
      type: object
      properties:
        base:
          type: string
          pattern: ^[A-Z0-9.]{1,32}$
        quote:
          type: string
          pattern: ^[A-Z0-9.]{1,32}$
        type:
          type: string
          enum:
          - Spot
      required:
      - type
      - base
      - quote
      description: 'A spot pair: buying or selling the base asset for the quote asset.'
    MarketLeverageSetting:
      description: The account's current leverage in a market. Leveraged carries the multiple; Disabled means the market offers
        leverage but it is off for this account; Unknown means the host cannot report it.
      oneOf:
      - $ref: '#/components/schemas/MarketLeverageSettingDisabled'
      - $ref: '#/components/schemas/MarketLeverageSettingLeveraged'
      - $ref: '#/components/schemas/MarketLeverageSettingUnknown'
      discriminator:
        propertyName: type
        mapping:
          Disabled: '#/components/schemas/MarketLeverageSettingDisabled'
          Leveraged: '#/components/schemas/MarketLeverageSettingLeveraged'
          Unknown: '#/components/schemas/MarketLeverageSettingUnknown'
    MarketLeverageSettingDisabled:
      title: Disabled
      type: object
      properties:
        type:
          type: string
          enum:
          - Disabled
      required:
      - type
      description: The market offers leverage, but it is turned off for this account.
    MarketLeverageSettingLeveraged:
      title: Leveraged
      type: object
      properties:
        leverage:
          $ref: '#/components/schemas/Decimal'
        type:
          type: string
          enum:
          - Leveraged
      required:
      - type
      - leverage
      description: Leverage is on for this market at the given leverage.
    MarketLeverageSettingUnknown:
      title: Unknown
      type: object
      properties:
        message:
          type: string
        type:
          type: string
          enum:
          - Unknown
      required:
      - type
      - message
      description: The host cannot report the leverage setting; message says why.
    MarketCollateral:
      type: object
      properties:
        valueAsset:
          type: string
        total:
          $ref: '#/components/schemas/Decimal'
        available:
          $ref: '#/components/schemas/Decimal'
      required:
      - valueAsset
      - total
      - available
      description: Collateral backing the account's activity in one market, valued in valueAsset.
    MarketPosition:
      type: object
      properties:
        instrument:
          $ref: '#/components/schemas/Instrument'
        long:
          $ref: '#/components/schemas/Position'
        short:
          $ref: '#/components/schemas/Position'
        mode:
          anyOf:
          - $ref: '#/components/schemas/PositionMode'
          - type: 'null'
          description: Null when the host does not report it.
      required:
      - instrument
      - long
      - short
      - mode
      description: The account's position in one market, as a long and a short side. Netting reports at most one non-empty
        side, Hedging can report both; an empty side has size "0".
    Position:
      type: object
      properties:
        size:
          $ref: '#/components/schemas/Decimal'
          description: Non-negative, in native contract units (see ContractDetails); the side gives the direction.
        entryPrice:
          anyOf:
          - $ref: '#/components/schemas/Decimal'
          - type: 'null'
          description: Null when the host does not report it.
        markPrice:
          anyOf:
          - $ref: '#/components/schemas/Decimal'
          - type: 'null'
          description: The mark price the position is valued at; null when the host does not report it.
        unrealizedPnl:
          anyOf:
          - $ref: '#/components/schemas/AssetValue'
          - type: 'null'
          description: Profit or loss if the position closed at markPrice, in the settlement asset; null when the host does
            not report it or the side is empty.
      required:
      - size
      - entryPrice
      - markPrice
      - unrealizedPnl
      description: One side of a market position.
    PositionMode:
      type: string
      enum:
      - Hedging
      - Netting
      description: 'How a market holds positions: Hedging keeps separate long and short positions, Netting keeps one net position.'
    AccountMarketStateSpot:
      title: Spot
      type: object
      properties:
        instrument:
          $ref: '#/components/schemas/Instrument'
        base:
          $ref: '#/components/schemas/AssetBalance'
        quote:
          $ref: '#/components/schemas/AssetBalance'
        type:
          type: string
          enum:
          - Spot
      required:
      - type
      - instrument
      - base
      - quote
      description: 'The account''s state in a spot market: its base and quote asset balances.'
    AssetBalance:
      type: object
      properties:
        available:
          $ref: '#/components/schemas/Decimal'
      required:
      - available
      description: The balance of one asset available to trade.
    AccountMarketStateSpotMargin:
      title: SpotMargin
      type: object
      properties:
        instrument:
          $ref: '#/components/schemas/Instrument'
        currentLeverageSetting:
          $ref: '#/components/schemas/MarketLeverageSetting'
        collateral:
          $ref: '#/components/schemas/MarketCollateral'
        base:
          $ref: '#/components/schemas/AssetBalance'
        quote:
          $ref: '#/components/schemas/AssetBalance'
        type:
          type: string
          enum:
          - SpotMargin
      required:
      - type
      - instrument
      - currentLeverageSetting
      - collateral
      - base
      - quote
      description: The account's state in a spot market with a market-level leverage setting, returned only when settings.leverage
        is non-null. Spot margin offered only per order is not supported; those markets are returned as Spot.
    AccountOpenOrders:
      type: object
      properties:
        orders:
          type: array
          items:
            $ref: '#/components/schemas/Order'
      required:
      - orders
      description: The account's open orders when the stream opens.
    AccountOrderUpdate:
      type: object
      properties:
        change:
          $ref: '#/components/schemas/OrderChange'
        order:
          $ref: '#/components/schemas/Order'
      required:
      - change
      - order
      description: One change to one of the account's orders, with the complete order after the change.
    OrderChange:
      oneOf:
      - $ref: '#/components/schemas/OrderChangeCancelled'
      - $ref: '#/components/schemas/OrderChangeFilled'
      - $ref: '#/components/schemas/OrderChangeOpened'
      - $ref: '#/components/schemas/OrderChangeOther'
      - $ref: '#/components/schemas/OrderChangeRejected'
      discriminator:
        propertyName: type
        mapping:
          Cancelled: '#/components/schemas/OrderChangeCancelled'
          Filled: '#/components/schemas/OrderChangeFilled'
          Opened: '#/components/schemas/OrderChangeOpened'
          Other: '#/components/schemas/OrderChangeOther'
          Rejected: '#/components/schemas/OrderChangeRejected'
      description: What changed on the order. One update per change, so a push that fills and cancels sends Filled then Cancelled
        with the same order; handle an unknown type as Other.
    OrderChangeCancelled:
      title: Cancelled
      type: object
      properties:
        type:
          type: string
          enum:
          - Cancelled
      required:
      - type
      description: The order was cancelled.
    OrderChangeOpened:
      title: Opened
      type: object
      properties:
        type:
          type: string
          enum:
          - Opened
      required:
      - type
      description: The order first appeared on the stream, at most once per order; one seen already traded follows with Filled.
        Orders in the Reset get no Opened, and an order first seen rejected gets only Rejected.
    OrderChangeFilled:
      title: Filled
      type: object
      properties:
        type:
          type: string
          enum:
          - Filled
      required:
      - type
      description: The order traded more, or reached Filled; the order's state says whether it is partly or fully filled.
        Executions are in ListFills.
    Fill:
      type: object
      properties:
        orderId:
          type: string
          description: The ID of the order this execution belongs to.
        instrument:
          $ref: '#/components/schemas/Instrument'
        side:
          $ref: '#/components/schemas/OrderSide'
          description: The account's side, which is its order's side, not the taker's side.
        executedAt:
          type: string
          format: date-time
        price:
          $ref: '#/components/schemas/Decimal'
        size:
          $ref: '#/components/schemas/Decimal'
          description: In native contracts; see ContractDetails.
        fees:
          type: array
          items:
            $ref: '#/components/schemas/AssetValue'
        realizedPnl:
          anyOf:
          - $ref: '#/components/schemas/AssetValue'
          - type: 'null'
          description: Null when the host does not report it.
        id:
          type:
          - string
          - 'null'
          description: The host's execution ID; null when the host does not report it.
        role:
          anyOf:
          - $ref: '#/components/schemas/TradeRole'
          - type: 'null'
          description: Maker or taker; null when the host does not report it.
      required:
      - orderId
      - instrument
      - side
      - executedAt
      - price
      - size
      - fees
      - realizedPnl
      - id
      - role
      description: One execution of an account's order.
    AssetValue:
      type: object
      properties:
        asset:
          type: string
        value:
          $ref: '#/components/schemas/Decimal'
      required:
      - asset
      - value
      description: An amount of one asset.
    TradeRole:
      type: string
      enum:
      - Maker
      - Taker
      description: Whether the account's side of a trade added liquidity (Maker) or took it (Taker).
    OrderChangeRejected:
      title: Rejected
      type: object
      properties:
        reason:
          type:
          - string
          - 'null'
          description: The host's rejection reason; null when the host gives none.
        code:
          type:
          - string
          - 'null'
          description: The host's own rejection code, not an ErrorCode; null when the host gives none.
        type:
          type: string
          enum:
          - Rejected
      required:
      - reason
      - code
      - type
      description: The host rejected the order.
    OrderChangeOther:
      title: Other
      type: object
      properties:
        nativeType:
          type:
          - string
          - 'null'
          description: The host's own status for the change; null when it gives none.
        type:
          type: string
          enum:
          - Other
      required:
      - type
      - nativeType
      description: A change to the order that no other type names, such as an amended price or size.
    Order:
      oneOf:
      - $ref: '#/components/schemas/OrderLimit'
      - $ref: '#/components/schemas/OrderMarket'
      - $ref: '#/components/schemas/OrderTriggerLimit'
      - $ref: '#/components/schemas/OrderTriggerMarket'
      discriminator:
        propertyName: type
        mapping:
          Limit: '#/components/schemas/OrderLimit'
          Market: '#/components/schemas/OrderMarket'
          TriggerLimit: '#/components/schemas/OrderTriggerLimit'
          TriggerMarket: '#/components/schemas/OrderTriggerMarket'
      description: An order on the account as the host reports it. The type selects the order's own fields.
    OrderLimit:
      title: Limit
      type: object
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        side:
          $ref: '#/components/schemas/OrderSide'
        instrument:
          $ref: '#/components/schemas/Instrument'
        state:
          $ref: '#/components/schemas/OrderState'
        sizeTraded:
          $ref: '#/components/schemas/Decimal'
        averagePrice:
          anyOf:
          - $ref: '#/components/schemas/Decimal'
          - type: 'null'
          description: Average execution price; null when the host does not report it.
        realizedPnl:
          anyOf:
          - $ref: '#/components/schemas/AssetValue'
          - type: 'null'
          description: Null when the host does not report it.
        totalFees:
          type: array
          items:
            $ref: '#/components/schemas/AssetValue'
        clientOrderId:
          type:
          - string
          - 'null'
          description: Null when none was submitted or the host does not report it.
        size:
          $ref: '#/components/schemas/Decimal'
          description: Native contract units; see ContractDetails.
        price:
          $ref: '#/components/schemas/Decimal'
        type:
          type: string
          enum:
          - Limit
      required:
      - type
      - id
      - createdAt
      - side
      - instrument
      - state
      - sizeTraded
      - averagePrice
      - realizedPnl
      - totalFees
      - clientOrderId
      - size
      - price
      description: A limit order as the host reports it. Submitted options (tif, postOnly, reduceOnly, positionEffect) are
        not echoed.
    OrderSide:
      type: string
      enum:
      - Buy
      - Sell
      description: 'The direction of an order: Buy or Sell.'
    OrderState:
      type: string
      enum:
      - Live
      - Filled
      - Cancelled
      - Rejected
      description: 'Where an order is in its life: Live, or the final states Filled, Cancelled and Rejected.'
    OrderMarket:
      title: Market
      type: object
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        side:
          $ref: '#/components/schemas/OrderSide'
        instrument:
          $ref: '#/components/schemas/Instrument'
        state:
          $ref: '#/components/schemas/OrderState'
        sizeTraded:
          $ref: '#/components/schemas/Decimal'
        averagePrice:
          anyOf:
          - $ref: '#/components/schemas/Decimal'
          - type: 'null'
          description: Average execution price; null when the host does not report it.
        realizedPnl:
          anyOf:
          - $ref: '#/components/schemas/AssetValue'
          - type: 'null'
          description: Null when the host does not report it.
        totalFees:
          type: array
          items:
            $ref: '#/components/schemas/AssetValue'
        clientOrderId:
          type:
          - string
          - 'null'
          description: Null when none was submitted or the host does not report it.
        sizing:
          anyOf:
          - $ref: '#/components/schemas/MarketSizing'
          - type: 'null'
          description: The amount and unit as the host accepted it, which may round a notional; null when the host does not
            report it.
        type:
          type: string
          enum:
          - Market
      required:
      - type
      - id
      - createdAt
      - side
      - instrument
      - state
      - sizeTraded
      - averagePrice
      - realizedPnl
      - totalFees
      - clientOrderId
      - sizing
      description: A market order as the host reports it. Submitted options (tif, postOnly, reduceOnly, positionEffect) are
        not echoed.
    OrderTriggerLimit:
      title: TriggerLimit
      type: object
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        side:
          $ref: '#/components/schemas/OrderSide'
        instrument:
          $ref: '#/components/schemas/Instrument'
        state:
          $ref: '#/components/schemas/OrderState'
        sizeTraded:
          $ref: '#/components/schemas/Decimal'
        averagePrice:
          anyOf:
          - $ref: '#/components/schemas/Decimal'
          - type: 'null'
          description: Average execution price; null when the host does not report it.
        realizedPnl:
          anyOf:
          - $ref: '#/components/schemas/AssetValue'
          - type: 'null'
          description: Null when the host does not report it.
        totalFees:
          type: array
          items:
            $ref: '#/components/schemas/AssetValue'
        clientOrderId:
          type:
          - string
          - 'null'
          description: Null when none was submitted or the host does not report it.
        size:
          $ref: '#/components/schemas/Decimal'
          description: Native contract units; see ContractDetails.
        price:
          $ref: '#/components/schemas/Decimal'
        trigger:
          $ref: '#/components/schemas/Trigger'
        type:
          type: string
          enum:
          - TriggerLimit
      required:
      - type
      - id
      - createdAt
      - side
      - instrument
      - state
      - sizeTraded
      - averagePrice
      - realizedPnl
      - totalFees
      - clientOrderId
      - size
      - price
      - trigger
      description: A trigger limit order as the host reports it. Submitted options (tif, postOnly, reduceOnly, positionEffect)
        are not echoed.
    Trigger:
      type: object
      properties:
        price:
          $ref: '#/components/schemas/Decimal'
        condition:
          $ref: '#/components/schemas/TriggerCondition'
        reference:
          anyOf:
          - $ref: '#/components/schemas/TriggerReferencePrice'
          - type: 'null'
          description: Price the trigger watches. Required under a UserSelectable referencePrice policy; under HostSelected
            leave it null, as any value is rejected, even a matching one.
      required:
      - price
      - condition
      description: 'The condition that places a trigger order: the reference price crossing price in the given direction.'
    TriggerCondition:
      type: string
      enum:
      - RefPriceGTE
      - RefPriceLTE
      description: 'The direction that activates a trigger: RefPriceGTE when the reference price rises to or above the trigger
        price, RefPriceLTE when it falls to or below.'
    TriggerReferencePrice:
      type: string
      enum:
      - Mark
      - Index
      - LastTrade
      - BestBid
      - BestAsk
      description: The market price a trigger watches.
    OrderTriggerMarket:
      title: TriggerMarket
      type: object
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        side:
          $ref: '#/components/schemas/OrderSide'
        instrument:
          $ref: '#/components/schemas/Instrument'
        state:
          $ref: '#/components/schemas/OrderState'
        sizeTraded:
          $ref: '#/components/schemas/Decimal'
        averagePrice:
          anyOf:
          - $ref: '#/components/schemas/Decimal'
          - type: 'null'
          description: Average execution price; null when the host does not report it.
        realizedPnl:
          anyOf:
          - $ref: '#/components/schemas/AssetValue'
          - type: 'null'
          description: Null when the host does not report it.
        totalFees:
          type: array
          items:
            $ref: '#/components/schemas/AssetValue'
        clientOrderId:
          type:
          - string
          - 'null'
          description: Null when none was submitted or the host does not report it.
        sizing:
          anyOf:
          - $ref: '#/components/schemas/MarketSizing'
          - type: 'null'
          description: The amount and unit as the host accepted it, which may round a notional; null when the host does not
            report it.
        trigger:
          $ref: '#/components/schemas/Trigger'
        type:
          type: string
          enum:
          - TriggerMarket
      required:
      - type
      - id
      - createdAt
      - side
      - instrument
      - state
      - sizeTraded
      - averagePrice
      - realizedPnl
