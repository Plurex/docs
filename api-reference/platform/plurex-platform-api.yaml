          description: 'setMarketLeverage on this market: what a set affects (this market, its host-defined group, or the
            whole account). Null means it cannot be set.'
      required:
      - min
      - max
      - step
      - get
      - setEffectScope
      description: Inclusive min/max; accepted values are exactly min plus a whole number of steps.
    MarketSettingEffectScope:
      oneOf:
      - $ref: '#/components/schemas/MarketSettingEffectScopeAccount'
      - $ref: '#/components/schemas/MarketSettingEffectScopeMarket'
      - $ref: '#/components/schemas/MarketSettingEffectScopeMarketGroup'
      discriminator:
        propertyName: type
        mapping:
          Account: '#/components/schemas/MarketSettingEffectScopeAccount'
          Market: '#/components/schemas/MarketSettingEffectScopeMarket'
          MarketGroup: '#/components/schemas/MarketSettingEffectScopeMarketGroup'
    MarketSettingEffectScopeAccount:
      type: object
      properties:
        type:
          type: string
          enum:
          - Account
      required:
      - type
    MarketSettingEffectScopeMarket:
      type: object
      properties:
        type:
          type: string
          enum:
          - Market
      required:
      - type
    MarketSettingEffectScopeMarketGroup:
      type: object
      properties:
        type:
          type: string
          enum:
          - MarketGroup
      required:
      - type
    MarketPositionModeSpec:
