asyncapi: 3.0.0
info:
  title: Plurex Platform Streams
  version: 1.0.0
  description: >-
    Live updates over WebSocket, grouped like the REST API: hosts streams follow trading activity on your accounts. Each stream
    type is one WebSocket connection at `/api/v1/{domain}/stream/{Action}`, named after the capability that says whether it
    is supported (for example subscribeToAccountOrders). One connection carries one type and streams many topics of it, such
    as accounts.


    **Connecting.** Send the X-API-KEY and X-API-SECRET headers with the upgrade request. Authentication failures are ordinary
    HTTP errors with the ErrorEnvelope body, before the upgrade. Browser authentication is not supported. WebSocket ping/pong
    frames keep the connection alive.


    **Subscribing.** Send Subscribe with your own request id and the topics to stream. The server sends a Rejected for each
    refused topic (for example an account you cannot access), then one Subscribed listing the topics now streaming; their
    events follow it. Unsubscribe is answered with one Unsubscribed, after which nothing more arrives for those topics. A
    refused topic never closes the connection. Every message names its topic, and order holds per topic, not across topics.
    A message the server cannot decode closes the connection with 1008. A connection with no topics streaming for 30 seconds,
    including right after connecting, is closed with 1008 "No topics".


    **Reconciling.** A stream starts with no snapshot and does not replay missed events. After Subscribed, read the current
    state with the matching REST operation and apply events on top of it. When a topic Ends, or after any disconnect, subscribe
    and read again. Close code 1000 is a normal shutdown; 1011 "Stream failed" means the stream itself failed.


    **Keeping up.** Read messages as they arrive. A connection that falls too far behind is closed with 1013 "Slow consumer"
    rather than delaying the stream: reconnect, subscribe, then reconcile as above. Streaming fewer topics per connection
    reduces the load on each.


    **Compatibility.** Enum values, union variants, error codes and fields are added over time without a new version. Ignore
    fields you do not recognise, and treat unknown enum values and variants as an unrecognised case instead of failing.
  tags:
  - name: hosts
    description: 'Live trading activity on your accounts: order changes and balance postings. Paper accounts stream the same
      way.'
  - name: orders
    description: Order changes on your accounts.
  - name: transactions
    description: 'Balance postings: fees, funding payments, deposits and so on.'
servers:
  api:
    host: api.plurex.io
    protocol: wss
    security:
    - $ref: '#/components/securitySchemes/ApiKeyPair'
channels:
  hostsSubscribeToAccountOrders:
    address: /api/v1/hosts/stream/SubscribeToAccountOrders
    messages:
      AccountStreamSubscribe:
        $ref: '#/components/messages/AccountStreamSubscribe'
      AccountStreamUnsubscribe:
        $ref: '#/components/messages/AccountStreamUnsubscribe'
      AccountStreamSubscribed:
        $ref: '#/components/messages/AccountStreamSubscribed'
      AccountStreamUnsubscribed:
        $ref: '#/components/messages/AccountStreamUnsubscribed'
      AccountStreamRejected:
        $ref: '#/components/messages/AccountStreamRejected'
      AccountStreamEnded:
        $ref: '#/components/messages/AccountStreamEnded'
      AccountOrderStreamEvent:
        $ref: '#/components/messages/AccountOrderStreamEvent'
  hostsSubscribeToAccountTransactions:
    address: /api/v1/hosts/stream/SubscribeToAccountTransactions
    messages:
      AccountStreamSubscribe:
        $ref: '#/components/messages/AccountStreamSubscribe'
      AccountStreamUnsubscribe:
        $ref: '#/components/messages/AccountStreamUnsubscribe'
      AccountStreamSubscribed:
        $ref: '#/components/messages/AccountStreamSubscribed'
      AccountStreamUnsubscribed:
        $ref: '#/components/messages/AccountStreamUnsubscribed'
      AccountStreamRejected:
        $ref: '#/components/messages/AccountStreamRejected'
      AccountStreamEnded:
        $ref: '#/components/messages/AccountStreamEnded'
      AccountTransactionStreamEvent:
        $ref: '#/components/messages/AccountTransactionStreamEvent'
operations:
  hostsSubscribeToAccountOrders:
    action: send
    channel:
      $ref: '#/channels/hostsSubscribeToAccountOrders'
    messages:
    - $ref: '#/channels/hostsSubscribeToAccountOrders/messages/AccountStreamSubscribed'
    - $ref: '#/channels/hostsSubscribeToAccountOrders/messages/AccountStreamUnsubscribed'
    - $ref: '#/channels/hostsSubscribeToAccountOrders/messages/AccountStreamRejected'
    - $ref: '#/channels/hostsSubscribeToAccountOrders/messages/AccountStreamEnded'
    - $ref: '#/channels/hostsSubscribeToAccountOrders/messages/AccountOrderStreamEvent'
    summary: Stream account orders
    description: 'Every change to the subscribed accounts'' orders: created, filled, cancelled, rejected. Each Event carries
      the change and the complete order, as GetOrder returns it. Reconcile with ListOpenOrders. Supported when the host''s
      accountOrders.subscribeToAccountOrders is, otherwise the account is Rejected with NotSupported; accountOrders.changes
      lists the changes it sends.'
    tags:
    - name: hosts
    - name: orders
  hostsSubscribeToAccountOrdersControl:
    action: receive
    channel:
      $ref: '#/channels/hostsSubscribeToAccountOrders'
    messages:
    - $ref: '#/channels/hostsSubscribeToAccountOrders/messages/AccountStreamSubscribe'
    - $ref: '#/channels/hostsSubscribeToAccountOrders/messages/AccountStreamUnsubscribe'
    summary: Choose account orders accounts
    description: Subscribe and Unsubscribe the accounts whose orders this connection streams.
    tags:
    - name: hosts
    - name: orders
  hostsSubscribeToAccountTransactions:
    action: send
    channel:
      $ref: '#/channels/hostsSubscribeToAccountTransactions'
    messages:
    - $ref: '#/channels/hostsSubscribeToAccountTransactions/messages/AccountStreamSubscribed'
    - $ref: '#/channels/hostsSubscribeToAccountTransactions/messages/AccountStreamUnsubscribed'
    - $ref: '#/channels/hostsSubscribeToAccountTransactions/messages/AccountStreamRejected'
    - $ref: '#/channels/hostsSubscribeToAccountTransactions/messages/AccountStreamEnded'
    - $ref: '#/channels/hostsSubscribeToAccountTransactions/messages/AccountTransactionStreamEvent'
    summary: Stream account transactions
    description: New balance postings on the subscribed accounts (fees, funding payments, deposits and so on), each with the
      same ID ListTransactions returns. Reconcile with ListTransactions. Transaction events are ordered only among themselves,
      not relative to order events. Supported when the host's accountTransactions.subscribeToAccountTransactions is, otherwise
      the account is Rejected with NotSupported.
    tags:
    - name: hosts
    - name: transactions
  hostsSubscribeToAccountTransactionsControl:
    action: receive
    channel:
      $ref: '#/channels/hostsSubscribeToAccountTransactions'
    messages:
    - $ref: '#/channels/hostsSubscribeToAccountTransactions/messages/AccountStreamSubscribe'
    - $ref: '#/channels/hostsSubscribeToAccountTransactions/messages/AccountStreamUnsubscribe'
    summary: Choose account transactions accounts
    description: Subscribe and Unsubscribe the accounts whose transactions this connection streams.
    tags:
    - name: hosts
    - name: transactions
components:
  securitySchemes:
    ApiKeyPair:
      type: httpApiKey
      in: header
      name: X-API-KEY
      description: X-API-KEY and X-API-SECRET headers are both required.
  messages:
    AccountStreamSubscribe:
      name: AccountStreamSubscribe
      title: Subscribe
      summary: Start streaming accounts.
      description: Sent by you to start streaming one or more accounts on this connection. The server answers with a Rejected
        for each refused account, then exactly one Subscribed; events for the accepted accounts follow that Subscribed. An
        account that is already streaming is listed again without a second stream.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/AccountStreamSubscribe'
      examples:
      - name: accountStreamSubscribe
        summary: Stream two accounts.
        payload:
          type: Subscribe
          id: r1
          topics:
          - accountId: acc_1
          - accountId: acc_2
    AccountStreamUnsubscribe:
      name: AccountStreamUnsubscribe
      title: Unsubscribe
      summary: Stop streaming accounts.
      description: Sent by you to stop streaming accounts. The server answers with one Unsubscribed, after which nothing more
        arrives for those accounts. Accounts that are not streaming are acknowledged too.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/AccountStreamUnsubscribe'
      examples:
      - name: accountStreamUnsubscribe
        summary: Stop streaming one account.
        payload:
          type: Unsubscribe
          id: r2
          topics:
          - accountId: acc_1
    AccountStreamSubscribed:
      name: AccountStreamSubscribed
      title: Subscribed
      summary: 'Reply to Subscribe: the accounts now streaming.'
      description: Sent exactly once per Subscribe, after any Rejected for that request. Lists the accounts now streaming;
        their events follow this message, ordered per account but not across accounts. An empty list means every account was
        refused.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/AccountStreamSubscribed'
      examples:
      - name: accountStreamSubscribed
        summary: acc_2 was refused, so only acc_1 streams.
        payload:
          type: Subscribed
          id: r1
          topics:
          - accountId: acc_1
    AccountStreamUnsubscribed:
      name: AccountStreamUnsubscribed
      title: Unsubscribed
      summary: 'Reply to Unsubscribe: nothing more follows.'
      description: Sent exactly once per Unsubscribe. Nothing more arrives for the listed accounts.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/AccountStreamUnsubscribed'
      examples:
      - name: accountStreamUnsubscribed
        summary: acc_1 no longer streams.
        payload:
          type: Unsubscribed
          id: r2
          topics:
          - accountId: acc_1
    AccountStreamRejected:
      name: AccountStreamRejected
      title: Rejected
      summary: One account in a Subscribe was refused.
      description: Sent once per refused account, before the request's Subscribed; the connection stays open and the other
        accounts stream normally. Nothing arrives for a refused account.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/AccountStreamRejected'
      examples:
      - name: accountStreamRejected
        summary: acc_2 is not accessible with this API key.
        payload:
          type: Rejected
          id: r1
          topic:
            accountId: acc_2
          code: Forbidden
          message: Forbidden
    AccountStreamEnded:
      name: AccountStreamEnded
      title: Ended
      summary: An account stopped streaming.
      description: 'Sent when a streaming account stops without an Unsubscribe, for example because the host''s own feed ended.
        Nothing more arrives for it: read current state through the REST API, then subscribe again. The connection and the
        other accounts are unaffected.'
      contentType: application/json
      payload:
        $ref: '#/components/schemas/AccountStreamEnded'
      examples:
      - name: accountStreamEnded
        summary: The host's feed for acc_1 ended.
        payload:
          type: Ended
          topic:
            accountId: acc_1
          code: UpstreamFailure
          message: Upstream stream ended
    AccountOrderStreamEvent:
      name: AccountOrderStreamEvent
      title: Order event
      summary: A change to an order on a streaming account.
      description: 'Sent for every change to a streaming account''s orders, after that account''s Subscribed: created, filled,
        cancelled, rejected. Carries the change and the complete order as GetOrder returns it. Ordered per account, not across
        accounts.'
      contentType: application/json
      payload:
        $ref: '#/components/schemas/AccountOrderStreamEvent'
      examples:
      - name: accountOrderStreamEvent
        summary: A resting limit order was cancelled.
        payload:
          type: Event
          topic:
            accountId: acc_1
          timestamp: '2026-10-26T08:17:18.732Z'
          data:
            change:
              type: Cancelled
            order:
              type: Limit
              id: BTC-USDT-SPOT|5fee96c0-8063-412d-8b4d-e36e44a8ea2d
              createdAt: '2026-10-26T08:17:17.709Z'
              side: Buy
              instrument:
                type: Spot
                base: BTC
                quote: USDT
              state: Cancelled
              sizeTraded: '0'
              averagePrice: null
              realizedPnl: null
              totalFees: []
              clientOrderId: my-order-1
              size: '1'
              price: '90'
    AccountTransactionStreamEvent:
      name: AccountTransactionStreamEvent
      title: Transaction event
      summary: A new balance posting on a streaming account.
      description: Sent for every new balance posting on a streaming account, after that account's Subscribed, with the same
        ID ListTransactions returns. Ordered per account, not across accounts, and not relative to order events.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/AccountTransactionStreamEvent'
      examples:
      - name: accountTransactionStreamEvent
        summary: A trading fee was charged.
        payload:
          type: Event
          topic:
            accountId: acc_1
          timestamp: '2026-10-26T08:20:00.120Z'
          data:
            id: trade-fee:7f3a
            effectiveAt: '2026-10-26T08:20:00.104Z'
            amount:
              asset: USDT
              value: '-0.055'
            type: TradingFee
            instrument:
              type: Perp
              base: BTC
              quote: USDT
            orderId: BTC-USDT-PERP|0b6c1e52-2f7e-4c55-9d43-1c1a9b6f2e10
            fillId: fill-91
            positionId: null
            groupId: trade:BTC-USDT-PERP:fill-91
            nativeType: TRADE_FEE
            description: null
  schemas:
    Instrument:
      oneOf:
      - $ref: '#/components/schemas/InstrumentFuture'
      - $ref: '#/components/schemas/InstrumentFutureInv'
      - $ref: '#/components/schemas/InstrumentOption'
      - $ref: '#/components/schemas/InstrumentPerp'
      - $ref: '#/components/schemas/InstrumentPerpInv'
      - $ref: '#/components/schemas/InstrumentSpot'
      description: 'An instrument, identified by its fields rather than a venue symbol: type, base, quote, and expiry, strike
        and right where they apply. type takes the InstrumentType values; unknown types are rejected. Market summaries also
        give its canonical symbol.'
    InstrumentFuture:
      title: Future
      type: object
      properties:
        base:
          type: string
          pattern: ^[A-Z0-9.]{1,32}$
        quote:
          type: string
          pattern: ^[A-Z0-9.]{1,32}$
        expiry:
          type: string
          format: date
          description: Contract expiry date (YYYY-MM-DD).
        type:
          type: string
          enum:
          - Future
      required:
      - type
      - base
      - quote
      - expiry
      description: A linear dated future, quoted and settled in the quote asset, that expires on expiry.
    InstrumentFutureInv:
      title: FutureInv
      type: object
      properties:
        base:
          type: string
          pattern: ^[A-Z0-9.]{1,32}$
        quote:
          type: string
          pattern: ^[A-Z0-9.]{1,32}$
        expiry:
          type: string
          format: date
          description: Contract expiry date (YYYY-MM-DD).
        type:
          type: string
          enum:
          - FutureInv
      required:
      - type
      - base
      - quote
      - expiry
      description: An inverse dated future, quoted in the quote asset and settled in the base asset, that expires on expiry.
    InstrumentOption:
      title: Option
      type: object
      properties:
        base:
          type: string
          pattern: ^[A-Z0-9.]{1,32}$
        quote:
          type: string
          pattern: ^[A-Z0-9.]{1,32}$
        expiry:
          type: string
          format: date
          description: Contract expiry date (YYYY-MM-DD).
        strike:
          type: string
          pattern: ^(?:0|[1-9][0-9]*)(?:\.[0-9]*[1-9])?$
          description: Positive strike price in the quote asset, in canonical form so identity is exact; a plain decimal with
            no exponent and no trailing fractional zeros (50000, not 50000.0 or 5E4).
        right:
          $ref: '#/components/schemas/OptionRight'
        type:
          type: string
          enum:
          - Option
      required:
      - type
      - base
      - quote
      - expiry
      - strike
      - right
      description: Option contract. Option markets are not listed or tradable; options appear only where a host reports account
        activity on them.
    OptionRight:
      type: string
      enum:
      - Call
      - Put
      description: Whether an option gives the right to buy (Call) or to sell (Put) the underlying at the strike.
    InstrumentPerp:
      title: Perp
      type: object
      properties:
        base:
          type: string
          pattern: ^[A-Z0-9.]{1,32}$
        quote:
          type: string
          pattern: ^[A-Z0-9.]{1,32}$
        type:
          type: string
          enum:
          - Perp
      required:
      - type
      - base
      - quote
      description: A linear perpetual swap, with no expiry, quoted and settled in the quote asset.
    InstrumentPerpInv:
      title: PerpInv
      type: object
      properties:
        base:
          type: string
          pattern: ^[A-Z0-9.]{1,32}$
        quote:
          type: string
          pattern: ^[A-Z0-9.]{1,32}$
        type:
          type: string
          enum:
          - PerpInv
      required:
      - type
      - base
      - quote
      description: An inverse perpetual swap, with no expiry, quoted in the quote asset and settled in the base asset.
    InstrumentSpot:
      title: Spot
      type: object
      properties:
        base:
          type: string
          pattern: ^[A-Z0-9.]{1,32}$
        quote:
          type: string
          pattern: ^[A-Z0-9.]{1,32}$
        type:
          type: string
          enum:
          - Spot
      required:
      - type
      - base
      - quote
      description: 'A spot pair: buying or selling the base asset for the quote asset.'
    AccountOrderEvent:
      type: object
      properties:
        change:
          $ref: '#/components/schemas/OrderChange'
        order:
          $ref: '#/components/schemas/Order'
      required:
      - change
      - order
      description: One change to one of the account's orders, with the complete order as it stands after the change. Use change
        to see what happened and order for the current state.
    OrderChange:
      oneOf:
      - $ref: '#/components/schemas/OrderChangeCancelled'
      - $ref: '#/components/schemas/OrderChangeCreated'
      - $ref: '#/components/schemas/OrderChangeFillApplied'
      - $ref: '#/components/schemas/OrderChangeRejected'
      - $ref: '#/components/schemas/OrderChangeUnknown'
      description: 'What happened to the order in this event: created, filled further, cancelled, rejected, or a host change
        with no standard meaning.'
    OrderChangeCancelled:
      title: Cancelled
      type: object
      properties:
        type:
          type: string
          enum:
          - Cancelled
      required:
      - type
      description: The order was cancelled; the order's state is Cancelled.
    OrderChangeCreated:
      title: Created
      type: object
      properties:
        type:
          type: string
          enum:
          - Created
      required:
      - type
      description: The host accepted a new order; it is now live.
    OrderChangeFillApplied:
      title: FillApplied
      type: object
      properties:
        fill:
          anyOf:
          - $ref: '#/components/schemas/Fill'
          - type: 'null'
          description: Execution details of the fill; null when the host does not supply them (accountOrders.includesFillDetails
            is false).
        type:
          type: string
          enum:
          - FillApplied
      required:
      - fill
      - type
      description: The traded size increased. The order contains cumulative sizeTraded, averagePrice and state. fill is absent/null
        when the host reports only cumulative order state; call ListFills for individual executions. includesFillDetails advertises
        whether executions accompany these changes.
    Fill:
      type: object
      properties:
        orderId:
          type: string
          description: ID of the order this execution belongs to, as returned on Order.id.
        instrument:
          $ref: '#/components/schemas/Instrument'
        side:
          $ref: '#/components/schemas/OrderSide'
          description: The account's side of the execution, which is its order's side, not the taker's side.
        executedAt:
          type: string
          format: date-time
        price:
          $ref: '#/components/schemas/Decimal'
        size:
          $ref: '#/components/schemas/Decimal'
          description: Native contract units; see ContractDetails.
        fees:
          type: array
          items:
            $ref: '#/components/schemas/AssetValue'
        realizedPnl:
          anyOf:
          - $ref: '#/components/schemas/AssetValue'
          - type: 'null'
          description: Host-reported value; null if the host does not supply it.
        id:
          type:
          - string
          - 'null'
          description: The host's execution ID; null when the host does not report one. Plurex does not invent one.
        role:
          anyOf:
          - $ref: '#/components/schemas/TradeRole'
          - type: 'null'
          description: Maker/taker classification, null when not reported.
      required:
      - orderId
      - instrument
      - side
      - executedAt
      - price
      - size
      - fees
      - realizedPnl
      - id
      - role
      description: 'One execution of an account''s order: the price, size and fees of a single trade.'
    AssetValue:
      type: object
      properties:
        asset:
          type: string
        value:
          $ref: '#/components/schemas/Decimal'
      required:
      - asset
      - value
      description: An amount of one asset.
    TradeRole:
      type: string
      enum:
      - Maker
      - Taker
      description: Whether the account's side of a trade added liquidity (Maker) or took it (Taker).
    OrderChangeRejected:
      title: Rejected
      type: object
      properties:
        reason:
          type:
          - string
          - 'null'
          description: Host-supplied rejection reason; null if the host gives none.
        code:
          type:
          - string
          - 'null'
          description: Host-native rejection code; null if the host gives none. Not an ErrorCode.
        type:
          type: string
          enum:
          - Rejected
      required:
      - reason
      - code
      - type
      description: The host rejected the order; the order's state is Rejected. reason and code are the host's own when it
        gives them.
    OrderChangeUnknown:
      title: Unknown
      type: object
      properties:
        nativeType:
          type: string
        type:
          type: string
          enum:
          - Unknown
      required:
      - type
      - nativeType
      description: A host order change with no standard meaning; nativeType holds the host's own event type.
    Order:
      oneOf:
      - $ref: '#/components/schemas/OrderLimit'
      - $ref: '#/components/schemas/OrderMarket'
      - $ref: '#/components/schemas/OrderTriggerLimit'
      - $ref: '#/components/schemas/OrderTriggerMarket'
      description: 'An order on the account as the host reports it: type, side, instrument, state, traded size and fees. The
        type selects the order''s own fields, such as price for limit orders.'
    OrderLimit:
      title: Limit
      type: object
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        side:
          $ref: '#/components/schemas/OrderSide'
        instrument:
          $ref: '#/components/schemas/Instrument'
        state:
          $ref: '#/components/schemas/OrderState'
        sizeTraded:
          $ref: '#/components/schemas/Decimal'
        averagePrice:
          anyOf:
          - $ref: '#/components/schemas/Decimal'
          - type: 'null'
          description: Host-reported average execution price; null if unavailable. Plurex does not calculate it from fills.
        realizedPnl:
          anyOf:
          - $ref: '#/components/schemas/AssetValue'
          - type: 'null'
          description: Host-reported value; null if the host does not supply it.
        totalFees:
          type: array
          items:
            $ref: '#/components/schemas/AssetValue'
        clientOrderId:
          type:
          - string
          - 'null'
          description: clientOrderId submitted with the order; null if none was submitted or the host does not report it.
        size:
          $ref: '#/components/schemas/Decimal'
          description: Native contract units; see ContractDetails.
        price:
          $ref: '#/components/schemas/Decimal'
        type:
          type: string
          enum:
          - Limit
      required:
      - type
      - id
      - createdAt
      - side
      - instrument
      - state
      - sizeTraded
      - averagePrice
      - realizedPnl
      - totalFees
      - clientOrderId
      - size
      - price
      description: Host-reported order state. Submitted options (tif, postOnly, reduceOnly, positionEffect) are not echoed.
    OrderSide:
      type: string
      enum:
      - Buy
      - Sell
      description: 'The direction of an order: Buy or Sell.'
    OrderState:
      type: string
      enum:
      - Live
      - Filled
      - Cancelled
      - Rejected
      description: 'Where an order is in its life: Live (working on the host), or the final states Filled, Cancelled and Rejected.'
    OrderMarket:
      title: Market
      type: object
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        side:
          $ref: '#/components/schemas/OrderSide'
        instrument:
          $ref: '#/components/schemas/Instrument'
        state:
          $ref: '#/components/schemas/OrderState'
        sizeTraded:
          $ref: '#/components/schemas/Decimal'
        averagePrice:
          anyOf:
          - $ref: '#/components/schemas/Decimal'
          - type: 'null'
          description: Host-reported average execution price; null if unavailable. Plurex does not calculate it from fills.
        realizedPnl:
          anyOf:
          - $ref: '#/components/schemas/AssetValue'
          - type: 'null'
          description: Host-reported value; null if the host does not supply it.
        totalFees:
          type: array
          items:
            $ref: '#/components/schemas/AssetValue'
        clientOrderId:
          type:
          - string
          - 'null'
          description: clientOrderId submitted with the order; null if none was submitted or the host does not report it.
        sizing:
          anyOf:
          - $ref: '#/components/schemas/MarketSizing'
          - type: 'null'
          description: The requested amount and its unit, as the host accepted it (it may round a notional). Null when the
            host does not report both; never inferred from fills.
        type:
          type: string
          enum:
          - Market
      required:
      - type
      - id
      - createdAt
      - side
      - instrument
      - state
      - sizeTraded
      - averagePrice
      - realizedPnl
      - totalFees
      - clientOrderId
      - sizing
      description: Host-reported order state. Submitted options (tif, postOnly, reduceOnly, positionEffect) are not echoed.
    OrderTriggerLimit:
      title: TriggerLimit
      type: object
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        side:
          $ref: '#/components/schemas/OrderSide'
        instrument:
          $ref: '#/components/schemas/Instrument'
        state:
          $ref: '#/components/schemas/OrderState'
        sizeTraded:
          $ref: '#/components/schemas/Decimal'
        averagePrice:
          anyOf:
          - $ref: '#/components/schemas/Decimal'
          - type: 'null'
          description: Host-reported average execution price; null if unavailable. Plurex does not calculate it from fills.
        realizedPnl:
          anyOf:
          - $ref: '#/components/schemas/AssetValue'
          - type: 'null'
          description: Host-reported value; null if the host does not supply it.
        totalFees:
          type: array
          items:
            $ref: '#/components/schemas/AssetValue'
        clientOrderId:
          type:
          - string
          - 'null'
          description: clientOrderId submitted with the order; null if none was submitted or the host does not report it.
        size:
          $ref: '#/components/schemas/Decimal'
          description: Native contract units; see ContractDetails.
        price:
          $ref: '#/components/schemas/Decimal'
        trigger:
          $ref: '#/components/schemas/Trigger'
        type:
          type: string
          enum:
          - TriggerLimit
      required:
      - type
      - id
      - createdAt
      - side
      - instrument
      - state
      - sizeTraded
      - averagePrice
      - realizedPnl
      - totalFees
      - clientOrderId
      - size
      - price
      - trigger
      description: Host-reported order state. Submitted options (tif, postOnly, reduceOnly, positionEffect) are not echoed.
    Trigger:
      type: object
      properties:
        price:
          $ref: '#/components/schemas/Decimal'
        condition:
          $ref: '#/components/schemas/TriggerCondition'
        reference:
          anyOf:
          - $ref: '#/components/schemas/TriggerReferencePrice'
          - type: 'null'
          description: Price the trigger watches; null or omitted lets the host choose, as described by the market's trigger
            referencePrice policy.
      required:
      - price
      - condition
      description: 'The condition that activates a trigger order: when the reference price crosses price in the given direction,
        the order is placed.'
    TriggerCondition:
      type: string
      enum:
      - RefPriceGTE
      - RefPriceLTE
      description: 'The direction that activates a trigger: RefPriceGTE when the reference price rises to or above the trigger
        price, RefPriceLTE when it falls to or below.'
    TriggerReferencePrice:
      type: string
      enum:
      - Mark
      - Index
      - LastTrade
      - BestBid
      - BestAsk
      description: The market price a trigger watches, such as the mark price, index price, last trade or best bid or ask.
    OrderTriggerMarket:
      title: TriggerMarket
      type: object
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        side:
          $ref: '#/components/schemas/OrderSide'
        instrument:
          $ref: '#/components/schemas/Instrument'
        state:
          $ref: '#/components/schemas/OrderState'
        sizeTraded:
          $ref: '#/components/schemas/Decimal'
        averagePrice:
          anyOf:
          - $ref: '#/components/schemas/Decimal'
          - type: 'null'
          description: Host-reported average execution price; null if unavailable. Plurex does not calculate it from fills.
        realizedPnl:
          anyOf:
          - $ref: '#/components/schemas/AssetValue'
          - type: 'null'
          description: Host-reported value; null if the host does not supply it.
        totalFees:
          type: array
          items:
            $ref: '#/components/schemas/AssetValue'
        clientOrderId:
          type:
          - string
          - 'null'
          description: clientOrderId submitted with the order; null if none was submitted or the host does not report it.
        sizing:
          anyOf:
          - $ref: '#/components/schemas/MarketSizing'
          - type: 'null'
          description: The requested amount and its unit, as the host accepted it (it may round a notional). Null when the
            host does not report both; never inferred from fills.
        trigger:
          $ref: '#/components/schemas/Trigger'
        type:
          type: string
          enum:
          - TriggerMarket
      required:
      - type
      - id
      - createdAt
      - side
      - instrument
      - state
      - sizeTraded
      - averagePrice
      - realizedPnl
      - totalFees
      - clientOrderId
      - sizing
      - trigger
      description: Host-reported order state. Submitted options (tif, postOnly, reduceOnly, positionEffect) are not echoed.
    MarketSizing:
      oneOf:
      - $ref: '#/components/schemas/MarketSizingNotional'
      - $ref: '#/components/schemas/MarketSizingSize'
      description: 'The amount of a market order: a size in native contracts, or a notional amount of the quote asset.'
    MarketSizingNotional:
      title: Notional
      type: object
      properties:
        notional:
          $ref: '#/components/schemas/Decimal'
          description: Amount of the quote asset.
        type:
          type: string
          enum:
          - Notional
      required:
      - type
      - notional
      description: Sizes the order by an amount of the quote asset to spend or receive.
    MarketSizingSize:
      title: Size
      type: object
      properties:
        size:
          $ref: '#/components/schemas/Decimal'
          description: Native contract units; see ContractDetails.
        type:
          type: string
          enum:
          - Size
      required:
      - type
      - size
      description: Sizes the order in native contracts.
    Decimal:
      type: string
      pattern: ^-?(?:0|[1-9][0-9]*)(?:\.[0-9]+)?(?:[eE][+-]?[0-9]+)?$
      description: An exact decimal number encoded as a string. No binary floating-point rounding.
    AccountStreamTopic:
      type: object
      properties:
        accountId:
          type: string
          description: The account to stream.
      required:
      - accountId
      description: One account on an account stream. Requires access to the account.
    AccountStreamSubscribe:
      title: Subscribe
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          description: Your ID for this request, echoed on its reply.
        topics:
          type: array
          items:
            $ref: '#/components/schemas/AccountStreamTopic'
          minItems: 1
          maxItems: 25
          description: Accounts to stream, 1 to 25 per message. A connection streams at most 25 accounts in total; accounts
            beyond that are Rejected with InvalidRequest.
        type:
          type: string
          enum:
          - Subscribe
          description: Always Subscribe.
      required:
      - type
      - id
      - topics
      description: Start streaming these accounts. The reply is a Rejected for each refused account, then one Subscribed listing
        the accounts now streaming; their events follow it. An account already streaming is listed again without a second
        stream.
    AccountStreamUnsubscribe:
      title: Unsubscribe
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          description: Your ID for this request, echoed on its reply.
        topics:
          type: array
          items:
            $ref: '#/components/schemas/AccountStreamTopic'
          minItems: 1
          description: Accounts to stop streaming; at least one.
        type:
          type: string
          enum:
          - Unsubscribe
          description: Always Unsubscribe.
      required:
      - type
      - id
      - topics
      description: Stop streaming these accounts. The reply is one Unsubscribed, after which nothing more arrives for them.
        Accounts that are not streaming are acknowledged too.
    AccountStreamSubscribed:
      title: Subscribed
      type: object
      properties:
        id:
          type: string
          description: The id of the request this replies to.
        topics:
          type: array
          items:
            $ref: '#/components/schemas/AccountStreamTopic'
          description: The accounts now streaming from this request; empty when every account was refused.
        type:
          type: string
          enum:
          - Subscribed
          description: Always Subscribed.
      required:
      - type
      - id
      - topics
      description: Reply to Subscribe. Events for these accounts follow this message.
    AccountStreamUnsubscribed:
      title: Unsubscribed
      type: object
      properties:
        id:
          type: string
          description: The id of the request this replies to.
        topics:
          type: array
          items:
            $ref: '#/components/schemas/AccountStreamTopic'
          description: The accounts no longer streaming, as listed in the Unsubscribe.
        type:
          type: string
          enum:
          - Unsubscribed
          description: Always Unsubscribed.
      required:
      - type
      - id
      - topics
      description: Reply to Unsubscribe. Nothing more arrives for these accounts.
    AccountStreamRejected:
      title: Rejected
      type: object
      properties:
        id:
          type: string
          description: The id of the request this replies to.
        topic:
          $ref: '#/components/schemas/AccountStreamTopic'
          description: The refused account, as you sent it.
        code:
          $ref: '#/components/schemas/ErrorCode'
          description: 'Why the account was refused: for example Forbidden for an account you cannot access, NotSupported
            when the host does not stream it, or InvalidRequest beyond 25 accounts.'
        message:
          type: string
          description: Readable detail for logs; do not parse it.
        type:
          type: string
          enum:
          - Rejected
          description: Always Rejected.
      required:
      - type
      - id
      - topic
      - code
      - message
      description: One account in a Subscribe was refused, for example AccountNotFound, Forbidden, or NotSupported when the
        host does not stream it. Sent before the request's Subscribed; the connection stays open.
    AccountStreamEnded:
      title: Ended
      type: object
      properties:
        topic:
          $ref: '#/components/schemas/AccountStreamTopic'
          description: The account that stopped streaming.
        code:
          $ref: '#/components/schemas/ErrorCode'
          description: Why it stopped, for example UpstreamFailure when the host's own feed ended.
        message:
          type: string
          description: Readable detail for logs; do not parse it.
        type:
          type: string
          enum:
          - Ended
          description: Always Ended.
      required:
      - type
      - topic
      - code
      - message
      description: 'The account stopped streaming, for example because the host''s own feed ended (UpstreamFailure). Nothing
        more arrives for it: read current state through the REST API, then subscribe again.'
    AccountOrderStreamEvent:
      title: Event
      type: object
      properties:
        topic:
          $ref: '#/components/schemas/AccountStreamTopic'
          description: The account this event belongs to.
        timestamp:
          type: string
          format: date-time
          description: When Plurex sent the event.
        data:
          $ref: '#/components/schemas/AccountOrderEvent'
          description: The order change and the complete order.
        type:
          type: string
          enum:
          - Event
          description: Always Event.
      required:
      - type
      - topic
      - timestamp
      - data
      description: One order change on a streaming account.
    AccountTransaction:
      type: object
      properties:
        id:
          type: string
          description: Stable posting identifier within this account; identical across history and stream.
        effectiveAt:
          type: string
          format: date-time
        amount:
          $ref: '#/components/schemas/AssetValue'
          description: 'Signed from the account holder''s perspective: positive increases the balance; negative decreases
            it.'
        type:
          $ref: '#/components/schemas/AccountTransactionType'
        instrument:
          anyOf:
          - $ref: '#/components/schemas/Instrument'
          - type: 'null'
          description: Related instrument, or null when unknown or not applicable.
        orderId:
          type:
          - string
          - 'null'
          description: Null when the host does not report it reliably.
        fillId:
          type:
          - string
          - 'null'
          description: Null when the host does not report it reliably.
        positionId:
          type:
          - string
          - 'null'
          description: Null when the host does not report it reliably.
        groupId:
          type:
          - string
          - 'null'
          description: Null when the host does not report it reliably.
        nativeType:
          type:
          - string
          - 'null'
          description: Null when the host does not report it reliably.
        description:
          type:
          - string
          - 'null'
          description: Null when the host does not report it reliably.
      required:
      - id
      - effectiveAt
      - amount
      - type
      - instrument
      - orderId
      - fillId
      - positionId
      - groupId
      - nativeType
      - description
      description: One posting to an account balance, such as a fee, funding payment or deposit. effectiveAt is when it took
        effect. Links to orders, fills and positions are given only when the host reports them. All fields are always present,
        null when empty.
    AccountTransactionType:
      type: string
      enum:
      - TradingFee
      - FundingPayment
      - BorrowInterest
      - Financing
      - LiquidationFee
      - Settlement
      - Rebate
      - Deposit
      - Withdrawal
      - Transfer
      - Conversion
      - Adjustment
      - Other
      description: The kind of balance posting, such as a trading fee, funding payment, deposit or withdrawal. Other covers
        postings with no standard type; see nativeType.
    AccountTransactionStreamEvent:
      title: Event
      type: object
      properties:
        topic:
          $ref: '#/components/schemas/AccountStreamTopic'
          description: The account this event belongs to.
        timestamp:
          type: string
          format: date-time
          description: When Plurex sent the event.
        data:
          $ref: '#/components/schemas/AccountTransaction'
          description: The new posting, as ListTransactions returns it.
        type:
          type: string
          enum:
          - Event
          description: Always Event.
      required:
      - type
      - topic
      - timestamp
      - data
      description: One new balance posting on a streaming account.
    ErrorCode:
      type: string
      enum:
      - InvalidRequest
      - Unauthenticated
      - Forbidden
      - AccountNotFound
      - OrderNotFound
      - NotFound
      - MethodNotAllowed
      - DuplicateClientOrderId
      - OrderAlreadyClosed
      - Conflict
      - UnsupportedMediaType
      - InsufficientFunds
      - InvalidProviderCredentials
      - AccountLimit
      - NotSupported
      - Rejected
      - RateLimited
      - UnexpectedError
      - CancelAllFailed
      - UpstreamFailure
      - Unavailable
      - UpstreamTimeout
      description: 'Stable error reason. The HTTP status for each code is fixed: InvalidRequest (400): Malformed JSON, wrong
        types, unknown fields or enum values, or invalid values.; Unauthenticated (401): Missing or invalid API key headers.;
        Forbidden (403): Authenticated, but without access to the account or operation.; AccountNotFound (404): The accountId
        does not exist.; OrderNotFound (404): The account exists, but the order identifier does not.; NotFound (404): Unknown
        path, host or venue.; MethodNotAllowed (405): The path exists but only accepts POST.; DuplicateClientOrderId (409):
        An order with this clientOrderId already exists.; OrderAlreadyClosed (409): The order is already filled, cancelled
        or rejected.; Conflict (409): A unique value (for example an account name) is already used.; UnsupportedMediaType
        (415): The request is not Content-Type application/json.; InsufficientFunds (422): The account cannot fund the order
        or withdrawal.; InvalidProviderCredentials (422): The provider rejected the account credentials.; AccountLimit (422):
        An account or subscription limit was reached.; NotSupported (422): The host does not support this operation, variant
        or instrument.; Rejected (422): The host or validation rejected the command.; RateLimited (429): The provider rate
        limited the request.; UnexpectedError (500): Unexpected server failure.; CancelAllFailed (502): At least one sub-cancel
        failed; reconcile with ListOpenOrders.; UpstreamFailure (502): The provider failed or returned an unusable response.;
        Unavailable (503): The service or provider is temporarily unavailable.; UpstreamTimeout (504): The provider did not
        respond in time. New codes may be added; treat an unknown code by its HTTP status.'
